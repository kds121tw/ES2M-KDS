":["ku wu wang","ku","wang"],"long":"這位滿臉堆笑的肥胖男子就是哭笑門門主劉乙忘玄最得意的兩名弟子中的一\n位，江湖人稱「哭無望」。至於他的本名自從入哭笑門那日起，就不再曾用\n過。數年前，劉乙忘玄出關重掌哭笑門，青邪大會之後，江湖之中對其刀法\n頗多猜忌。也許是為了可以和更多武林名門建立關係，哭無望這次奉劉乙忘\n玄之命來到雪吟莊。","weight":null,"value":null,"unit":null,"flags":[],"race":"yenhold","class":"fighter","level":40,"gender":"male","title":"哭笑門左使","equip":[{"path":"/custom/armor/waist/water_dragon_girdle","use":"wear"},{"path":"/custom/armor/cloth/worn_robe","use":"wear"},{"path":"/custom/weapon/staff/change_cane","use":"wield"},{"path":"/custom/armor/neck/silance_rosary","use":"wear"},{"path":"/custom/armor/head/black_doli","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/lady":{"id":"/custom/legacy_npc/lady","file":"source/upstream/mudlib/custom/legacy_npc/lady.c","name":"青衣女郎","ids":["lady"],"long":"一個二十多歲出頭的青衣女郎﹐容貌 ... 你覺得好像在哪裡看過她 ...","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":5,"gender":"female","title":null,"equip":[{"path":"/obj/area/obj/dagger","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/lay_ton":{"id":"/custom/legacy_npc/lay_ton","file":"source/upstream/mudlib/custom/legacy_npc/lay_ton.c","name":"雷同","ids":["lay ton","lay","ton"],"long":"雷同乃是斐縣人氏, 曾在武道通門下學了幾年的灸術, 從小好\n四處旅居增廣見識, 不耐習灸之枯燥乏味, 在灸術有些許火候\n之後便四處流浪, 近日才又回到故鄉。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"alchemist","level":20,"gender":"male","title":null,"equip":[{"path":"/obj/cloth","use":"wear"},{"path":"/custom/weapon/dagger/shadow_dagger","use":"wield"},{"path":"/custom/weapon/needle/iron_needle","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/lee_fong_chen":{"id":"/custom/legacy_npc/lee_fong_chen","file":"source/upstream/mudlib/custom/legacy_npc/lee_fong_chen.c","name":"李瘋塵","ids":["lee fong chen","lee","chen"],"long":"李瘋塵看起來相當強壯，一身黑色裝扮，腰上繫著一把長約三尺，形\n狀類似蟬翼的刀刃。也許他就是十年前江湖中那位殺人不眨眼的蟬翼\n刀客。","weight":null,"value":null,"unit":null,"flags":[],"race":"ashura","class":"fighter","level":30,"gender":"male","title":null,"equip":[{"path":"/custom/weapon/blade/wing_blade","use":"wield"},{"path":"/custom/armor/armor/raw_iron_armor","use":"wear"},{"path":"/custom/armor/finger/beast_ring","use":"wear"},{"path":"/custom/armor/hand/black_gauntlets","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/lee_fong_hwa":{"id":"/custom/legacy_npc/lee_fong_hwa","file":"source/upstream/mudlib/custom/legacy_npc/lee_fong_hwa.c","name":"利丰華","ids":["lee fong-hwa","lee","fong-hwa"],"long":"一個容色十分美艷的女子，身形婀娜，臉上帶著淺淺的微笑。","weight":null,"value":null,"unit":null,"flags":[],"race":"ashura","class":"thief","level":50,"gender":"female","title":"隱教聖女","equip":[{"path":"/custom/armor/cloth/silk_cloth","use":"wear"},{"path":"/custom/armor/waist/silver_girth","use":"wear"},{"path":"/custom/armor/hand/silk_gloves","use":"wear"},{"path":"/custom/armor/armor/white_dragon_plate","use":"wear"},{"path":"/custom/armor/finger/white_ring","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/lee_hon_yun":{"id":"/custom/legacy_npc/lee_hon_yun","file":"source/upstream/mudlib/custom/legacy_npc/lee_hon_yun.c","name":"李洪雲","ids":["lee hon_yun","lee","hon_yun"],"long":"李洪雲是山寨的總管, 許多大大小小的事都必須經過他的允許, 他長得\n眉清目秀, 讓人覺得毫無防備之心, 但是他性情卻相當兇殘, 每次掠奪\n時絕對不留活口 。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":30,"gender":"male","title":"黑風山總管","equip":[{"path":"/custom/weapon/sword/snake_sword","use":"wield"},{"path":"/custom/armor/hand/black_gauntlets","use":"wear"},{"path":"/custom/armor/armor/iron_armor","use":"wear"},{"path":"/custom/armor/cloth/iron_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/legacy_npc":{"id":"/custom/legacy_npc/legacy_npc","file":"source/upstream/mudlib/custom/legacy_npc/legacy_npc.c","name":"legacy_npc","ids":[],"long":"","weight":null,"value":null,"unit":null,"flags":[],"race":null,"class":null,"level":null,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/leng_yin_yue":{"id":"/custom/legacy_npc/leng_yin_yue","file":"source/upstream/mudlib/custom/legacy_npc/leng_yin_yue.c","name":"冷吟月","ids":["leng yin yue","leng","yue"],"long":"在你眼前的是一位窈窕的清秀佳人，她瓜子般的精緻臉龐略顯蒼白，黑\n白分明的雙眸難掩驚慌的神情。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"female","title":"冷府千金","equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/li_ru":{"id":"/custom/legacy_npc/li_ru","file":"source/upstream/mudlib/custom/legacy_npc/li_ru.c","name":"李儒","ids":["li ru","li","ru"],"long":"李儒乃是當地的名士，雖然曾是縣官，可是卻結識了不少江\n湖中人。相傳他的輕功獨步江湖，只可惜歲月不饒人，人到\n晚年身子是一天不如一天了。兩年前辭官回家養病。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":20,"gender":"male","title":null,"equip":[{"path":"/custom/armor/head/black_doli","use":"wear"},{"path":"/custom/weapon/sword/steel_longsword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/lieutenant":{"id":"/custom/legacy_npc/lieutenant","file":"source/upstream/mudlib/custom/legacy_npc/lieutenant.c","name":"武官","ids":["lieutenant"],"long":"這是一名指揮官兵的武官﹐他們通常是軍人中出類拔萃的佼佼者。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":25,"gender":"male","title":null,"equip":[{"path":"/obj/area/obj/bastardsword","use":"wield"},{"path":"/d/snow/npc/obj/clothboot","use":"wear"},{"path":"/d/snow/npc/obj/helmet","use":"wear"},{"path":"/custom/armor/cloth/cyan_cloth","use":"wear"},{"path":"/custom/armor/waist/iron_girth","use":"wear"},{"path":"/custom/armor/armor/ring_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/lin_yu_lun":{"id":"/custom/legacy_npc/lin_yu_lun","file":"source/upstream/mudlib/custom/legacy_npc/lin_yu_lun.c","name":"林育崙","ids":["lin yu lun","lin","lun"],"long":"酉縣的總捕頭「林育崙」, 據說他曾經是某個著名山寨的大頭目, 後\n後來歸順了朝廷, 於是朝廷便封了他這總捕頭的職位, 不過由於他是\n綠林出身, 再加上辦案的態度十分強硬, 所以大家對他都是盡量迴避\n, 不與他有任何衝突, 以免惹禍上身.","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":30,"gender":"male","title":"酉縣總捕頭","equip":[{"path":"/custom/armor/armor/steel_chain_armor","use":"wear"},{"path":"/custom/armor/cloth/silkworm_tunic","use":"wear"},{"path":"/custom/armor/neck/iron_rosary","use":"wear"},{"path":"/custom/weapon/blade/moon_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ling_yue_heng":{"id":"/custom/legacy_npc/ling_yue_heng","file":"source/upstream/mudlib/custom/legacy_npc/ling_yue_heng.c","name":"凌月蘅","ids":["ling yue heng","ling","heng"],"long":"銅鏡前正在梳髮的女子，妝雖清雅，然而依舊能讓你有驚為天人\n的氣質。黑亮長髮垂至腰擺，細白的肌膚微透著紅暈。像極了古\n畫中讚歎不已的蘇州美人。別見她柔若無骨的姿態，她也是自幼\n跟從其父凌承軒習武的，一身武藝毫不遜色。從銅鏡看她，眼神\n若有所思的停佇在手中的那隻簪，大概是想念她的夫君蔚楓吧。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":35,"gender":"female","title":"武學才女","equip":[{"path":"/custom/weapon/dagger/wolf_dagger","use":"wield"},{"path":"/custom/weapon/dagger/beauty_dagger","use":"wield"},{"path":"/custom/armor/feet/embroidery_boots","use":"wear"},{"path":"/custom/armor/waist/girl_girth","use":"wear"},{"path":"/custom/armor/armor/light_plate","use":"wear"},{"path":"/d/snow/npc/obj/white_dress","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ling_yun_yu":{"id":"/custom/legacy_npc/ling_yun_yu","file":"source/upstream/mudlib/custom/legacy_npc/ling_yun_yu.c","name":"淩筠語","ids":["ling yun-yu","ling","yun-yu"],"long":"她穿著一身藍，衣物上還有玫瑰的\n刺繡。她的臉透出淡淡的紅潤，\n那只有到到肩膀的短髮也有著淡淡的紅棕色。她曾經是位傑出的藥\n師，可是卻一直醫不好母親的怪病，說也奇怪，他母親當初從森林\n裡回來後的隔天身上就發出黑斑，在森林裡沒受傷也沒吃過不知名\n草藥，過了一週便去世了。此後便前往天朝學習各種藥品，曾跟著\n聶晟學習過。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":20,"gender":"female","title":null,"equip":[{"path":"/custom/weapon/dagger/shennong_dagger","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/liu_feng":{"id":"/custom/legacy_npc/liu_feng","file":"source/upstream/mudlib/custom/legacy_npc/liu_feng.c","name":"柳風","ids":["liu feng","liu","feng"],"long":"柳風是來自西部的幻霧觀道士，據說，他此番跟隨師父來到天朝是\n奉了巫首王的特命，也難怪他對天朝的書籍會感興趣。","weight":null,"value":null,"unit":null,"flags":[],"race":"malik","class":"taoist","level":20,"gender":"male","title":"幻霧觀道士","equip":[{"path":"/custom/weapon/sword/peachwood_sword","use":"wield"},{"path":"/custom/armor/head/copper_hat","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/liu_kei":{"id":"/custom/legacy_npc/liu_kei","file":"source/upstream/mudlib/custom/legacy_npc/liu_kei.c","name":"劉開","ids":["liu kei","liu","kei"],"long":"劉開是檒城衛兵統領, 生性忌惡如仇, 他層經捉拿過無數的壞人,也立\n下過不少的戰功.","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":30,"gender":"male","title":"檒城衛兵統領","equip":[{"path":"/custom/weapon/pike/solar_pike","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/liu_ko":{"id":"/custom/legacy_npc/liu_ko","file":"source/upstream/mudlib/custom/legacy_npc/liu_ko.c","name":"劉可","ids":["liu ko","liu","ko"],"long":"你面前的這個中年男子只是哭笑門的一個管事，奉命將這裡改造成一間倉庫。\n他身後鼓鼓囊囊的袋子里也許有什麼好東西也不一定。你可以用 list 列出可\n以買哪些裝備﹐用 buy 跟他買。","weight":null,"value":null,"unit":null,"flags":[],"race":"yenhold","class":"commoner","level":1,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/liu_shang_min":{"id":"/custom/legacy_npc/liu_shang_min","file":"source/upstream/mudlib/custom/legacy_npc/liu_shang_min.c","name":"劉尚民","ids":["liu shang min","liu","min"],"long":"一位年約二十的魁武青年﹐高顴短髮蓄鬍﹐雙眼圓猙如銅鈴﹐身著黃麻\n短掛鹿皮靴。手上一根齊眉長棍撈在肩背正不時低聲嘆息著。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":10,"gender":"male","title":null,"equip":[{"path":"/obj/cloth","use":"wear"},{"path":"/custom/armor/feet/straw_boots","use":"wear"},{"path":"/d/lee/obj/brow_staff","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/liuh_chuen_fon":{"id":"/custom/legacy_npc/liuh_chuen_fon","file":"source/upstream/mudlib/custom/legacy_npc/liuh_chuen_fon.c","name":"柳淳風","ids":["liuh chuen-fon","liuh","chuen-fon"],"long":"柳淳風是前武林盟主─封山劍派掌門柳東蘆的長子，同時也是封山劍派的\n大弟子，柳淳風近年來武功、聲望都漸漸在武林中嶄露頭角，和他的弟弟\n柳新雨合稱「風雨雙劍」，但是因為他們為人正派，行俠仗義，所以大家\n都尊稱這兩個人為「風雨雙俠」。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":30,"gender":"male","title":null,"equip":[{"path":"/obj/cloth","use":"wear"},{"path":"/obj/area/obj/broadsword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/kangping/inn",1]]},"/custom/legacy_npc/liuh_don_lu":{"id":"/custom/legacy_npc/liuh_don_lu","file":"source/upstream/mudlib/custom/legacy_npc/liuh_don_lu.c","name":"柳東蘆","ids":["liuh don-lu","liuh","don-lu"],"long":"柳東蘆是赫赫有名的封山劍派掌門人，封山劍派原本只以劍法見長，但是柳東\n蘆近幾年以家傳拳法融合封山劍法劍意，彌補了封山劍法中的許多缺點，四年\n前的武林大會便技壓群雄奪得武林盟主的寶座，但是他當武林盟主不到半年便\n宣佈退隱，據說是因為身染絕症之故，不過在你面前的這位年約五、六十歲的\n白髮老者似乎仍然精神矍鑠，不像是身有重病的樣子。","weight":null,"value":null,"unit":null,"flags":["限平民"],"race":"human","class":"fighter","level":70,"gender":"male","title":"封山派掌門","equip":[{"path":"/custom/armor/leg/red_scale_leggings","use":"wear"},{"path":"/custom/armor/waist/red_scale_girth","use":"wear"},{"path":"/custom/armor/hand/red_scale_gloves","use":"wear"},{"path":"/custom/armor/head/red_scale_helm","use":"wear"},{"path":"/custom/armor/feet/red_scale_boots","use":"wear"},{"path":"/custom/armor/armor/red_scale_plate","use":"wear"},{"path":"/custom/armor/cloth/red_scale_cloth","use":"wear"},{"path":"/custom/weapon/sword/blackthorn","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin/fonxan_hall",1]]},"/custom/legacy_npc/liuh_hui_xin":{"id":"/custom/legacy_npc/liuh_hui_xin","file":"source/upstream/mudlib/custom/legacy_npc/liuh_hui_xin.c","name":"柳繪心","ids":["liuh hui xin","liuh","xin"],"long":"一個十二、三歲的小女孩，臉上稚氣未脫，卻在眉目之間顯露出一股頤氣指使\n的威嚴。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"female","title":"封山派弟子","equip":[{"path":"/obj/area/obj/longsword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/liuh_xin_yu":{"id":"/custom/legacy_npc/liuh_xin_yu","file":"source/upstream/mudlib/custom/legacy_npc/liuh_xin_yu.c","name":"柳新雨","ids":["liuh xin yu","liuh","yu"],"long":"柳新雨是前武林盟主─封山劍派掌門柳東蘆的次子，近年來武功、聲望都\n漸漸在武林中嶄露頭角，和他的哥哥柳淳風合稱「風雨雙劍」，但是因為\n他們為人正派，行俠仗義，所以大家都尊稱這兩個人為「風雨雙俠」。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":30,"gender":"male","title":"封山派弟子","equip":[{"path":"/custom/armor/feet/cloud_boots","use":"wear"},{"path":"/custom/armor/waist/lion_belt","use":"wear"},{"path":"/d/wutang/obj/blue_cloth","use":"wear"},{"path":"/custom/weapon/sword/colosus_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/liuye_the_master_of_grimace":{"id":"/custom/legacy_npc/liuye_the_master_of_grimace","file":"source/upstream/mudlib/custom/legacy_npc/liuye_the_master_of_grimace.c","name":"劉乙忘玄","ids":["liuye the master of grimace","liuye","grimace","master"],"long":"這位兩眼如鷹, 滿臉鬚髦的八尺大漢, 正是青邪宮四門中位於首座的哭笑門\n門主劉乙忘玄。劉乙忘玄是青邪宮殘蟻師太的大弟子, 武藝超群, 為人極為\n深沉內斂, 年輕時膂力驚人, 身形魁梧, 一手青邪杖法打遍難逢敵手, 在當\n時在江湖上便得了個「降天山」的外號。\n劉乙忘玄中年時青邪宮發生重大變故, 青邪宮四門中的擾心門門主梵雲飛,\n和吹雪門門主王雙兒雙雙失蹤, 當時參與青邪宮「封鬼」盛會的武林豪傑死\n傷更是慘重。劉乙忘玄在此事過後, 突然性情大變, 整天又哭又笑, 意態狂\n亂, 狀如瘋癲。五十三歲那年, 殘蟻逝世, 劉乙忘玄瘋病竟然好轉, 自號「\n哭笑野人」, 成為青邪宮繼殘蟻師太之後的霸主, 之後潛心閉關五年, 創出\n「大邪心法」和「大邪七損刀」, 儼然成為武林中人皆敬佩的武學大宗師。","weight":null,"value":null,"unit":null,"flags":[],"race":"yenhold","class":"fighter","level":70,"gender":"male","title":"哭笑門門主","equip":[{"path":"/custom/armor/feet/flying_boots","use":"wear"},{"path":"/custom/armor/waist/ghosts_girdle","use":"wear"},{"path":"/custom/weapon/staff/god_cane","use":"wield"},{"path":"/custom/armor/cloth/soft_cloth","use":"wear"},{"path":"/custom/armor/neck/copper_rosary","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/lu_fei":{"id":"/custom/legacy_npc/lu_fei","file":"source/upstream/mudlib/custom/legacy_npc/lu_fei.c","name":"魯飛","ids":["lu fei","lu","fei"],"long":"魯飛曾經是征西大將軍神將帳下的第一猛將，後來由於臨時出征\n沒有跟隨神將去征討黑風山，至今仍為此事耿耿於懷，屢次上書\n請命再次發兵征討黑風山，為神將復仇。","weight":null,"value":null,"unit":null,"flags":[],"race":"yenhold","class":"soldier","level":50,"gender":"male","title":null,"equip":[{"path":"/custom/armor/waist/water_dragon_girdle","use":"wear"},{"path":"/custom/armor/finger/ring_of_mighty_lord","use":"wear"},{"path":"/custom/armor/head/royal_helmet","use":"wear"},{"path":"/custom/armor/armor/royal_armor","use":"wear"},{"path":"/custom/weapon/blunt/whirlwind_blunt","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/lu_jing":{"id":"/custom/legacy_npc/lu_jing","file":"source/upstream/mudlib/custom/legacy_npc/lu_jing.c","name":"魯驚","ids":["lu jing","lu","jing"],"long":"一股冷到骨子里的殺氣讓你忍不住打起哆嗦來，眼前的漢子，寬胸闊背，\n手臉都是紫銅一般的顏色，像是長在日頭下曝曬，粗糙如砂礫的臉上透\n著股剽悍之氣，殺氣的來源卻是漢子身後的哪把巨槌，古樸的外型，已\n染成一片血黑色的槌頭。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":25,"gender":"male","title":null,"equip":[{"path":"/custom/armor/head/battle_helm","use":"wear"},{"path":"/custom/armor/armor/battle_armor","use":"wear"},{"path":"/custom/weapon/blunt/crasher_maul","use":"wield"},{"path":"/d/snow/npc/obj/clothboot","use":"wear"},{"path":"/custom/armor/cloth/cyan_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ma_zhong_shen":{"id":"/custom/legacy_npc/ma_zhong_shen","file":"source/upstream/mudlib/custom/legacy_npc/ma_zhong_shen.c","name":"馬鍾聖","ids":["ma zhong shen","ma","shen"],"long":"馬鍾聖在大漠八魔中是老五，為人沈默寡言，很少說話，但是殺起人來卻也是\n異常殘忍。馬鍾聖在拳法上的造詣極深，由於和他動過手的人都被他殺了，所\n以他的武功套路幾乎沒人知道。","weight":null,"value":null,"unit":null,"flags":[],"race":"blackteeth","class":"fighter","level":30,"gender":"male","title":null,"equip":[{"path":"/custom/zhenwu/obj/steel_boots","use":"wear"},{"path":"/custom/armor/head/iron_helmet","use":"wear"},{"path":"/custom/armor/hand/steel_bracers","use":"wear"},{"path":"/custom/armor/armor/ring_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/madam_han":{"id":"/custom/legacy_npc/madam_han","file":"source/upstream/mudlib/custom/legacy_npc/madam_han.c","name":"韓夫人","ids":["madam han","madam","han"],"long":"韓夫人是韓龍從小青梅竹馬的玩伴，他們結褵已經有二十年的光\n景。讓韓夫人一直很苦惱的，就是到現在他們還沒有生下一兒半\n女。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"commoner","level":1,"gender":"female","title":null,"equip":[{"path":"/d/snow/npc/obj/white_dress","use":"wear"},{"path":"/custom/armor/neck/ruby_necklace","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/man_in_black":{"id":"/custom/legacy_npc/man_in_black","file":"source/upstream/mudlib/custom/legacy_npc/man_in_black.c","name":"黑衣人","ids":["man in black","man","black"],"long":"一個一身黑衣的神秘男子，那雙充滿殺氣的眼睛讓人不敢直視。","weight":null,"value":null,"unit":null,"flags":[],"race":"yenhold","class":"thief","level":20,"gender":"male","title":null,"equip":[{"path":"/custom/armor/neck/iron_rosary","use":"wear"},{"path":"/custom/armor/head/black_doli","use":"wear"},{"path":"/custom/armor/hand/snake_bracers","use":"wear"},{"path":"/d/lee/obj/tight_cloth","use":"wear"},{"path":"/custom/weapon/blade/blood_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/may_lan_wu":{"id":"/custom/legacy_npc/may_lan_wu","file":"source/upstream/mudlib/custom/legacy_npc/may_lan_wu.c","name":"梅嵐武","ids":["may lan-wu","may","lan-wu"],"long":"梅嵐武是冷梅莊莊主梅影風的長子，雖然只有二十多歲，但一手冷梅劍法已經\n盡得乃父真傳，江湖上的朋友送他一個外號叫做「追風劍」。梅嵐武相貌十分\n俊美，平常也頗為倜儻自喜，縣城裡不少姑娘都為他著迷，一聽說梅大公子進\n城，都會忍不住躲在樓上偷偷瞧上幾眼。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":30,"gender":"male","title":null,"equip":[{"path":"/custom/armor/cloth/umber_robe","use":"wear"},{"path":"/custom/armor/armor/chain_shirt","use":"wear"},{"path":"/obj/area/obj/shortsword","use":"wield"},{"path":"/obj/area/obj/longsword","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/meng_jiang_hong":{"id":"/custom/legacy_npc/meng_jiang_hong","file":"source/upstream/mudlib/custom/legacy_npc/meng_jiang_hong.c","name":"孟驚鴻","ids":["meng jiang-hong","meng","jiang-hong"],"long":"孟家莊的二莊主，一手五虎斷門刀隨然不如其兄孟昭展，但在江湖上\n也是小有名氣。尤其是在他一刀擊敗塞北雙熊之後，更是獲得了出塵\n刀的美譽。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":30,"gender":"male","title":"出塵刀","equip":[{"path":"/custom/armor/cloth/iron_cloth","use":"wear"},{"path":"/custom/armor/waist/lion_belt","use":"wear"},{"path":"/custom/armor/leg/red_dust_legs","use":"wear"},{"path":"/custom/weapon/blade/ghosts_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/mie_xin":{"id":"/custom/legacy_npc/mie_xin","file":"source/upstream/mudlib/custom/legacy_npc/mie_xin.c","name":"滅心","ids":["mie xin","mie","xin"],"long":"守護神之遺跡的護衛﹐經受了神明對其心智體力的考驗和鍛煉﹐永生\n守衛神之遺跡的密寶不受凡人的侵犯。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"soldier","level":40,"gender":"male","title":null,"equip":[{"path":"/custom/armor/hand/steel_bracers","use":"wear"},{"path":"/custom/armor/cloth/blood_stained_cloth","use":"wear"},{"path":"/custom/zhenwu/obj/steel_armor","use":"wear"},{"path":"/custom/weapon/pike/huge_halberd","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/mie_yu":{"id":"/custom/legacy_npc/mie_yu","file":"source/upstream/mudlib/custom/legacy_npc/mie_yu.c","name":"滅慾","ids":["mie yu","mie","yu"],"long":"守護神之遺跡的護衛﹐經受了神明對其心智體力的考驗和鍛煉﹐永生\n守衛神之遺跡的密寶不受凡人的侵犯。你似乎覺得這個守護寶藏的衛\n士看起來有點眼熟﹐好像曾經是江湖中某位劍客﹐但是你一時間想不\n起他的名字來。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"soldier","level":40,"gender":"male","title":null,"equip":[{"path":"/custom/armor/hand/black_gauntlets","use":"wear"},{"path":"/custom/armor/cloth/blood_stained_cloth","use":"wear"},{"path":"/custom/zhenwu/obj/steel_armor","use":"wear"},{"path":"/custom/weapon/sword/dragon_heavy_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ming_ling_zi":{"id":"/custom/legacy_npc/ming_ling_zi","file":"source/upstream/mudlib/custom/legacy_npc/ming_ling_zi.c","name":"螟蛉子","ids":["ming ling zi","ming","zi"],"long":"螟蛉子是跟杜風凌從西方大漠來的一位道士，平生以探求神秘的地方為樂。\n據說，他有辦法到達三個不屬於人間的地方：古墓場、夜神殿和蟠龍殿。他\n這次來天朝多半是為了幫杜風凌的幻霧觀在江湖中贏得一席之地吧。","weight":null,"value":null,"unit":null,"flags":[],"race":"malik","class":"taoist","level":20,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/mountain_god":{"id":"/custom/legacy_npc/mountain_god","file":"source/upstream/mudlib/custom/legacy_npc/mountain_god.c","name":"桃仙","ids":["mountain god","mountain","god"],"long":"桃仙看起來沒有什麼特別。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"taoist","level":30,"gender":"male","title":null,"equip":[{"path":"/custom/weapon/staff/zenstaff","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/o_yan_zhi":{"id":"/custom/legacy_npc/o_yan_zhi","file":"source/upstream/mudlib/custom/legacy_npc/o_yan_zhi.c","name":"歐陽芝","ids":["o-yan zhi","o-yan","zhi"],"long":"大漠八魔之一，武功似乎是步玄派的，但為人心浮氣躁，自視極高，自認為風\n流倜儻，文采天下無雙。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":30,"gender":"male","title":null,"equip":[{"path":"/obj/area/obj/leather_boot","use":"wear"},{"path":"/obj/area/obj/belt","use":"wear"},{"path":"/custom/armor/cloth/white_cloth","use":"wear"},{"path":"/obj/area/obj/longsword","use":"wield"},{"path":"/obj/books/strange_tales_of_the_celestial_court","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/old_taoist":{"id":"/custom/legacy_npc/old_taoist","file":"source/upstream/mudlib/custom/legacy_npc/old_taoist.c","name":"安懶道人","ids":["old taoist","old","taoist"],"long":"安懶道人是個鬍鬚花白的老道士，他曾經在天邪國擔任御史大夫達三十多\n年，後來辭官入山學道。","weight":null,"value":null,"unit":null,"flags":["限平民"],"race":"human","class":"taoist","level":60,"gender":"male","title":"玄衣派弟子","equip":[{"path":"/custom/armor/finger/sapphire_ring","use":"wear"},{"path":"/custom/armor/cloth/tao_robe","use":"wear"},{"path":"/custom/armor/armor/magic_armor","use":"wear"},{"path":"/custom/weapon/sword/sword_of_raven","use":"wield"},{"path":"/custom/weapon/sword/peachwood_sword","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/kangping/hut",1]]},"/custom/legacy_npc/ou_yan_wu_ji":{"id":"/custom/legacy_npc/ou_yan_wu_ji","file":"source/upstream/mudlib/custom/legacy_npc/ou_yan_wu_ji.c","name":"歐陽無寂","ids":["ou-yan wu ji","ou-yan","ji"],"long":"歐陽無寂是隱風觀觀主歐陽無極的雙生弟弟，兩人同時拜在宇文太\n極門下。因為兩人面貌相似，名字發音又相同，觀中弟子都以「大\n師父」稱呼歐陽無極，而稱歐陽無寂為「二師父」。半個月前，他\n收到了歐陽無極的飛符傳書，連忙從宓縣北上，要趕在茅山三位觀\n主會面之前，先與歐陽無極會合。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"taoist","level":30,"gender":"male","title":"隱風觀道士","equip":[{"path":"/custom/armor/head/black_doli","use":"wear"},{"path":"/custom/armor/finger/han_jade_ring","use":"wear"},{"path":"/custom/armor/cloth/green_robe","use":"wear"},{"path":"/custom/weapon/sword/peachwood_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ou_yan_wu_ji_2":{"id":"/custom/legacy_npc/ou_yan_wu_ji_2","file":"source/upstream/mudlib/custom/legacy_npc/ou_yan_wu_ji_2.c","name":"歐陽無極","ids":["ou-yan wu ji","ou-yan","ji"],"long":"隱風觀觀主本是四十多年前離開茅山﹐自創隱風觀的宇文太極。怎料數日前\n宇文太極竟忽然一命歸天﹐引得江湖中盛傳『茅山劍法』再顯與世。新任的\n隱風觀觀主﹐歐陽無極則是一口咬定宇文太極是忙於重建茅山﹐操勞過度而\n死。歐陽無極是宇文太極生前最鐘愛的弟子﹐而且在『茅山幻術』上的造詣\n頗深。他此時離開隱風觀據說是有事要和靈雲觀觀主和幻霧觀觀主商討。","weight":null,"value":null,"unit":null,"flags":["限平民"],"race":"human","class":"taoist","level":40,"gender":"male","title":"隱風觀觀主","equip":[{"path":"/custom/armor/cloth/green_robe","use":"wear"},{"path":"/custom/weapon/sword/peachwood_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/kangping/inn",1]]},"/custom/legacy_npc/phoxin":{"id":"/custom/legacy_npc/phoxin","file":"source/upstream/mudlib/custom/legacy_npc/phoxin.c","name":"佛心","ids":["phoxin"],"long":"殺手佛心是個四十多歲的中年僧人，一身金線僧袍纖塵不染。佛心少年時\n就是個殺人無數的冷血殺手，後來因為發生了一件慘事而出家為僧，立誓\n從此不殺一人，但是他仍然是江湖上聞名喪膽的可怕殺手，他只替金主將\n敵人打倒廢去武功，並不殺死對方，據他的說法是盼望金主看到仇家的慘\n狀能夠忽發善心，就此了結一樁血海深仇。\n佛心的武功深不可測，尤其擅長短兵刃與擒拿格鬥之術，據說和江湖上武\n功最高的六賢只在伯仲之間，連當今武林盟主都曾有「一丈之外，我不如\n金籟，一丈之內，我不如佛心」之嘆，由此可見此人之驚人藝業。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":50,"gender":"male","title":"殺手","equip":[{"path":"/custom/armor/cloth/gold_robe","use":"wear"},{"path":"/custom/armor/leg/bamboo_legs","use":"wear"},{"path":"/custom/armor/armor/dark_armor","use":"wear"},{"path":"/custom/armor/neck/psakaml","use":"wear"},{"path":"/custom/weapon/dagger/cool_iron_dagger","use":"wield"},{"path":"/custom/weapon/dagger/wicked_dagger","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/red_lady":{"id":"/custom/legacy_npc/red_lady","file":"source/upstream/mudlib/custom/legacy_npc/red_lady.c","name":"紅衣女子","ids":["red lady","red","lady"],"long":"一個身形婀娜的中年女子, 她豔美的臉龐和那如羊脂白玉般的肌膚, 不\n禁令你看傻了眼。她一臉茫然地看著你, 口中喃喃地唱著清淒的小調,\n你見到她的雙手染滿了血跡, 在她雪白的手臂上如一片片滿開的鮮紅牡\n丹 ...。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":40,"gender":"female","title":null,"equip":[{"path":"/custom/armor/armor/white_dragon_plate","use":"wear"},{"path":"/custom/weapon/sword/iron_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ren_xiao_xiao":{"id":"/custom/legacy_npc/ren_xiao_xiao","file":"source/upstream/mudlib/custom/legacy_npc/ren_xiao_xiao.c","name":"任蕭蕭","ids":["ren xiao-xiao","ren","xiao-xiao"],"long":"她長的雖無沉魚落雁之容，卻也是風情萬種，讓人心生愛意。只是\n她看起來滿面愁容，似乎正在為什麼事發愁。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":10,"gender":"female","title":null,"equip":[{"path":"/custom/armor/feet/violet_shoes","use":"wear"},{"path":"/custom/armor/cloth/rainbow_gown","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ro_yi":{"id":"/custom/legacy_npc/ro_yi","file":"source/upstream/mudlib/custom/legacy_npc/ro_yi.c","name":"駱易","ids":["ro yi","ro","yi"],"long":"駱易本人性格恬淡，雖然身為步玄派掌門人，卻極為謙退自抑，外人只知道駱易\n少年時曾孤身一人犯險闖入西方大漠的飛狼城，救回當今的皇帝及香雪王，成為\n轟動一時的人物。駱易辭卻了朝廷及香雪王的豐厚賞賜及高官厚祿，隱居在喬陰\n的祖宅，也成為江湖傳頌的美談。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":65,"gender":"male","title":"步玄派掌門","equip":[{"path":"/custom/armor/armor/black_harness","use":"wear"},{"path":"/custom/armor/finger/han_jade_ring","use":"wear"},{"path":"/custom/armor/feet/snakeskin_boots","use":"wear"},{"path":"/custom/armor/waist/white_jade_girth","use":"wear"},{"path":"/custom/armor/cloth/golden_robe","use":"wear"},{"path":"/custom/armor/head/headgear","use":"wear"},{"path":"/custom/weapon/sword/cloudslay_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/rong_shi_guo":{"id":"/custom/legacy_npc/rong_shi_guo","file":"source/upstream/mudlib/custom/legacy_npc/rong_shi_guo.c","name":"榮世國","ids":["rong shi guo","rong","guo"],"long":"你面前的這位老者身材魁梧﹐雙目有神﹐三縷白鬚整齊的落在胸前。\n榮家世代在朝為官且身居要職﹐尤其是最近幾年﹐榮家的勢利迅速\n成長﹐對天朝的軍界政界都有不小的影響。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":40,"gender":"male","title":null,"equip":[{"path":"/custom/armor/finger/han_jade_ring","use":"wear"},{"path":"/custom/armor/cloth/dragon_cloth","use":"wear"},{"path":"/custom/armor/head/jade_hat","use":"wear"},{"path":"/custom/weapon/staff/serpent_cane","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/senkun_tez":{"id":"/custom/legacy_npc/senkun_tez","file":"source/upstream/mudlib/custom/legacy_npc/senkun_tez.c","name":"上官小翠","ids":["senkun tez","senkun","tez"],"long":"上官小翠是老劍山徑執法上官笑夢的獨生女兒, 別看她弱不禁風的樣子,\n她的劍法在巾幗輩中算是蠻突出的一位。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":10,"gender":"female","title":"老劍山徑第十三代弟子","equip":[{"path":"/custom/armor/feet/flower_boots","use":"wear"},{"path":"/custom/armor/head/jade_hairpin","use":"wear"},{"path":"/custom/armor/cloth/tender_cloth","use":"wear"},{"path":"/custom/weapon/sword/steel_longsword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/shao_chu_san":{"id":"/custom/legacy_npc/shao_chu_san","file":"source/upstream/mudlib/custom/legacy_npc/shao_chu_san.c","name":"蕭秋山","ids":["shao chu-san","shao","chu-san"],"long":"一個相貌相當俊秀的年青人, 山寨中習武的各個環節都必須經過他的\n同意, 若未經許可偷學習武功, 通常命運是相當悲慘的, 他同時也是\n黑風寨中高手之一, 所以整個山寨的人也都很怕他。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":30,"gender":"male","title":"武術教頭","equip":[{"path":"/custom/weapon/sword/hero_sword","use":"wield"},{"path":"/custom/armor/armor/iron_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/si_ma_cheng_du":{"id":"/custom/legacy_npc/si_ma_cheng_du","file":"source/upstream/mudlib/custom/legacy_npc/si_ma_cheng_du.c","name":"司馬成都","ids":["si-ma cheng du","si-ma","du"],"long":"你面前這位年已花甲的白髮老人就是天朝軍界的第一人，兵部尚書\n司馬成都。不僅是司馬成都本人，其實整個司馬家族幾乎都在天朝\n軍中效力。這雖然引來一些人的猜疑，但是司馬成都憑借其一身正\n氣和纍纍戰功依舊深得祐聖帝信賴。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":70,"gender":"male","title":"兵部尚書","equip":[{"path":"/custom/armor/armor/tiger_plate","use":"wear"},{"path":"/custom/zhenwu/obj/fire_gauntlets","use":"wear"},{"path":"/custom/weapon/blunt/black_iron_hammer","use":"wield"},{"path":"/custom/armor/cloth/dragon_cloth","use":"wear"},{"path":"/custom/armor/head/royal_helmet","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/si_ma_lei":{"id":"/custom/legacy_npc/si_ma_lei","file":"source/upstream/mudlib/custom/legacy_npc/si_ma_lei.c","name":"司馬雷","ids":["si-ma lei","si-ma","lei"],"long":"大漠八魔中的老七，據說原本是天朝的一名參將，不知為何放著好好的官不做，\n卻到北方大漠去幹打家劫舍的事。","weight":null,"value":null,"unit":null,"flags":[],"race":"ashura","class":"soldier","level":35,"gender":"male","title":null,"equip":[{"path":"/custom/weapon/pike/royal_pike","use":"wield"},{"path":"/custom/armor/head/royal_helmet","use":"wear"},{"path":"/custom/armor/armor/royal_armor","use":"wear"},{"path":"/custom/armor/finger/ring_of_mighty_lord","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/si_ma_wei":{"id":"/custom/legacy_npc/si_ma_wei","file":"source/upstream/mudlib/custom/legacy_npc/si_ma_wei.c","name":"司馬蔚","ids":["si-ma wei","si-ma","wei"],"long":"風城的大將軍。聽人說他兩年前還只是個小卒，也沒有什麼戰功，不知\n為什麼會被提升為大將軍。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":55,"gender":"male","title":"風城大將軍","equip":[{"path":"/custom/armor/finger/ring_of_mighty_lord","use":"wear"},{"path":"/custom/zhenwu/obj/steel_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/soldier_leader":{"id":"/custom/legacy_npc/soldier_leader","file":"source/upstream/mudlib/custom/legacy_npc/soldier_leader.c","name":"兵部軍官","ids":["soldier leader","soldier","leader"],"long":"這是一位對兵部尚書司馬成都忠心不二的兵部軍官。","weight":null,"value":null,"unit":null,"flags":[],"race":"headless","class":"soldier","level":20,"gender":"male","title":null,"equip":[{"path":"/custom/armor/feet/bull_boots","use":"wear"},{"path":"/custom/armor/waist/iron_girth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/stone_ghost":{"id":"/custom/legacy_npc/stone_ghost","file":"source/upstream/mudlib/custom/legacy_npc/stone_ghost.c","name":"八臂石妖","ids":["stone ghost","stone","ghost"],"long":"這！這是一個甚麼東西？怎麼看都是一座巨大的八臂無頭石像！\n他胸口的一塊石牌上刻著「雷神禁地」四個字。","weight":null,"value":null,"unit":null,"flags":[],"race":"headless","class":"soldier","level":40,"gender":"male","title":null,"equip":[{"path":"/custom/armor/feet/forgod_boots","use":"wear"},{"path":"/custom/weapon/blunt/crasher_maul","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/su_xiao":{"id":"/custom/legacy_npc/su_xiao","file":"source/upstream/mudlib/custom/legacy_npc/su_xiao.c","name":"蘇瀟","ids":["su xiao","su","xiao"],"long":"你眼前是一名相貌堂堂的中年男子，全身散發著一股內斂的英氣，他\n正是蘇家莊主蘇瀟，蘇家三代經營賭場，到蘇瀟手上創了十一家分號\n，家業可謂如日中天，加上為人慷慨豪氣，平日就為地方百姓貢獻不\n少心力，在市井小民之間也頗具人望。但是他現在看起來卻愁眉不展\n，似乎有什麼心事....。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":15,"gender":"male","title":null,"equip":[{"path":"/custom/armor/waist/water_dragon_girdle","use":"wear"},{"path":"/custom/armor/leg/red_dust_legs","use":"wear"},{"path":"/custom/armor/cloth/silk_cloth","use":"wear"},{"path":"/custom/weapon/sword/colosus_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/sun_yi":{"id":"/custom/legacy_npc/sun_yi","file":"source/upstream/mudlib/custom/legacy_npc/sun_yi.c","name":"孫漪","ids":["sun yi","sun","yi"],"long":"孫漪是韓笑十年前在山下遇到的一個修羅族女孩，後來韓笑成為虎刀門掌\n門便收她為義女。別被她嬌滴滴的樣子迷惑了，她在十三歲時就力克群雄\n成為虎刀門比武大會的武狀元。","weight":null,"value":null,"unit":null,"flags":[],"race":"ashura","class":"fighter","level":40,"gender":"female","title":"虎刀門護衛","equip":[{"path":"/custom/armor/finger/beast_ring","use":"wear"},{"path":"/custom/armor/armor/shapeless_heartguard","use":"wear"},{"path":"/custom/armor/waist/girl_girth","use":"wear"},{"path":"/custom/armor/feet/embroidery_boots","use":"wear"},{"path":"/d/snow/npc/obj/white_dress","use":"wear"},{"path":"/custom/weapon/blade/snow_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/taoist_leader":{"id":"/custom/legacy_npc/taoist_leader","file":"source/upstream/mudlib/custom/legacy_npc/taoist_leader.c","name":"白齊","ids":["taoist leader","taoist","leader"],"long":"在你眼前的是一位仙風道骨的道士，身著一件淡青色道袍，渾身\n散發出一股悠然的風範與氣度，他就是太乙觀的觀主--白齊。太\n乙觀內的上清道長，玉清道長跟玄清道長都是他的得意門徒，他\n對待觀內的小道童，道士們也都很親切，可以說是太乙觀中最具\n有影響力的人物。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"taoist","level":50,"gender":"male","title":"太乙觀觀主","equip":[{"path":"/custom/weapon/sword/shome_sword","use":"wield"},{"path":"/custom/armor/feet/black_cloth_boots","use":"wear"},{"path":"/custom/armor/cloth/green_robe","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/taoist_master":{"id":"/custom/legacy_npc/taoist_master","file":"source/upstream/mudlib/custom/legacy_npc/taoist_master.c","name":"正閒道長","ids":["taoist master","taoist","master"],"long":"他正是上清觀觀主, 人稱渡盡劫者的正閒道長。據說此人在\n十九歲時因觀粉蝶撲戲而有所開悟, 首創上清觀劍法, 更在\n四十中旬突領鬼眾道經, 開始修行引神道篇。他的外表看起\n來有點肥短, 但聲如洪鐘, 臉似初嬰, 一點也不像個快要七\n十的老頭。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"taoist","level":50,"gender":"male","title":"上清觀觀主","equip":[{"path":"/custom/armor/cloth/taoist_robe","use":"wear"},{"path":"/custom/weapon/sword/yiyoung_sword","use":"wield"},{"path":"/custom/armor/finger/clear_ring","use":"wear"},{"path":"/obj/area/obj/longsword","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/tian_long":{"id":"/custom/legacy_npc/tian_long","file":"source/upstream/mudlib/custom/legacy_npc/tian_long.c","name":"田龍","ids":["tian long","tian","long"],"long":"田龍是虎刀門新一代弟子中的佼佼者，據說他不僅內功刀法出神入化，就\n連虎刀門不很出名的輕功也練到了爐火純青的境界。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":30,"gender":"male","title":"虎刀門護衛","equip":[{"path":"/custom/armor/waist/lion_belt","use":"wear"},{"path":"/custom/armor/armor/iron_armor","use":"wear"},{"path":"/custom/armor/finger/beast_ring","use":"wear"},{"path":"/custom/armor/leg/red_dust_legs","use":"wear"},{"path":"/custom/weapon/blade/ceremonial_moon","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/tian_yu":{"id":"/custom/legacy_npc/tian_yu","file":"source/upstream/mudlib/custom/legacy_npc/tian_yu.c","name":"田由","ids":["tian yu","tian","yu"],"long":"田由是塞北雙熊中的老二，長得又高又大，打人全靠一身蠻力。偏偏卻\n又自認為武功高強，自從見過孟憶柔一面之後，就死皮賴臉的呆在孟家\n莊不走，要不是孟家現在正有事，早就把他殺了。","weight":null,"value":null,"unit":null,"flags":[],"race":"headless","class":"fighter","level":30,"gender":"male","title":"塞北雙熊","equip":[{"path":"/custom/armor/feet/cloud_boots","use":"wear"},{"path":"/custom/armor/leg/star_studded_legs","use":"wear"},{"path":"/custom/weapon/sword/copper_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/tiger_trainer":{"id":"/custom/legacy_npc/tiger_trainer","file":"source/upstream/mudlib/custom/legacy_npc/tiger_trainer.c","name":"虎刀門教頭","ids":["tiger trainer","tiger","trainer"],"long":"他是虎刀門的一位老教頭，負責傳授新弟子武功。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"male","title":null,"equip":[{"path":"/custom/armor/armor/ringmail","use":"wear"},{"path":"/custom/armor/feet/bull_boots","use":"wear"},{"path":"/custom/armor/cloth/tiger_coat","use":"wear"},{"path":"/custom/weapon/blade/colosus_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/wang_yean":{"id":"/custom/legacy_npc/wang_yean","file":"source/upstream/mudlib/custom/legacy_npc/wang_yean.c","name":"王燕","ids":["wang yean","wang","yean"],"long":"一個滿身藥味, 神情專注的女子正在清理一些木材, 似乎沒有注意到你正在看\n她. 有她的裝束來看, 不像學武之人, 反到像是到處尋藥之神醫. 她師兄陳度\n好管閒事, 反倒在藥材的研究上, 比不上默默鑽研的王燕. 由其專注的神貌,\n似乎正在調理重要的配方.","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"alchemist","level":20,"gender":"female","title":null,"equip":[{"path":"/custom/weapon/dagger/shennong_dagger","use":"wield"},{"path":"/custom/armor/head/goat_hat","use":"wear"},{"path":"/obj/cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/white_hell_agent":{"id":"/custom/legacy_npc/white_hell_agent","file":"source/upstream/mudlib/custom/legacy_npc/white_hell_agent.c","name":"白無常","ids":["white hell agent","white","agent"],"long":"勾魂使者白無常是負責將因戰亂和意外而喪生的人的靈魂引去接受\n閻王的審判。一般來說，活人是見不到他的。而現在他就在你的面\n前，而且滿臉愁容，似乎遇到了甚麼麻煩。","weight":null,"value":null,"unit":null,"flags":[],"race":"malik","class":"taoist","level":50,"gender":"male","title":"勾魂使者","equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/wu_changuei":{"id":"/custom/legacy_npc/wu_changuei","file":"source/upstream/mudlib/custom/legacy_npc/wu_changuei.c","name":"吳長貴","ids":["wu changuei","wu","changuei"],"long":"一個面皮白淨的高瘦漢子﹐左頰上一道長長的刀疤﹐你突然想起這個\n漢子就是這一帶著名的飛賊「無常鬼」吳長貴。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":15,"gender":"male","title":null,"equip":[{"path":"/obj/area/obj/dagger","use":"wield"},{"path":"/custom/armor/head/ghost_mask","use":"wear"},{"path":"/custom/armor/cloth/black_suit","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/wu_dauton":{"id":"/custom/legacy_npc/wu_dauton","file":"source/upstream/mudlib/custom/legacy_npc/wu_dauton.c","name":"武道通","ids":["wu dauton","wu","dauton"],"long":"武道通年輕時本為龍圖丹派的方士, 因為一次因緣際會結識了一位江湖異人, 習得\n了幾手針灸之術, 從此便不再苦煉丹道, 開始如著魔般浸淫於施針下灸之學。之後\n竟因久疏龍圖丹派本門功夫, 而遭致開革之禍。武道通離開龍圖丹派之後, 便隱居\n於斐縣縣郊, 為當地居民針灸治病, 沒有想到卻聲名大噪起來, 由於醫術高明, 行\n事瘋癲乖張, 得了個「鬼華陀」的稱號。到了晚年, 乃自行開宗立派, 創設「武陀\n灸堂」, 傳授附近居民武藝與防身灸術, 門下弟子不下百人, 多雲遊四海, 行醫救\n世。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"alchemist","level":60,"gender":"male","title":"武陀灸堂堂主","equip":[{"path":"/custom/armor/feet/boots_of_cleanse","use":"wear"},{"path":"/custom/weapon/needle/bee_needle","use":"wield"},{"path":"/custom/armor/finger/tiger_ring","use":"wear"},{"path":"/custom/weapon/needle/needle_of_bone_maggot","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/wu_yu_nun":{"id":"/custom/legacy_npc/wu_yu_nun","file":"source/upstream/mudlib/custom/legacy_npc/wu_yu_nun.c","name":"無慾師太","ids":["wu-yu nun","wu-yu","nun"],"long":"無慾師太是太陰門慘招滅門之災時的唯一的幸存者，然而，太陰門的大部份武\n功都失傳了，她也在被哭笑門追殺，幸而得到柳東蘆的保護才得以在喬陰縣安\n身。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"monk","level":30,"gender":"female","title":"太陰門弟子","equip":[{"path":"/custom/armor/neck/psakaml","use":"wear"},{"path":"/custom/weapon/whip/golden_buddha_duster","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin/fonxan_yard",1]]},"/custom/legacy_npc/xiao_li_ying":{"id":"/custom/legacy_npc/xiao_li_ying","file":"source/upstream/mudlib/custom/legacy_npc/xiao_li_ying.c","name":"肖麗穎","ids":["xiao li ying","xiao","ying"],"long":"你面前的這位女子真可謂是國色天香﹐讓人望其貌而不知色﹐聞其聲而\n不知音。這般美貌的女子天朝境內可是難得一見﹐你既然看過了﹐就該\n知足了。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"alchemist","level":25,"gender":"female","title":null,"equip":[{"path":"/custom/armor/cloth/cloudy_silk_cloth","use":"wear"},{"path":"/custom/weapon/whip/whip_of_evil_beauties","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/xiao_yin":{"id":"/custom/legacy_npc/xiao_yin","file":"source/upstream/mudlib/custom/legacy_npc/xiao_yin.c","name":"蕭尹","ids":["xiao yin","xiao","yin"],"long":"一個和藹可親的老年人，半白的髮絲睿智的面容，看來是個飽經風霜的人物，但\n看其精壯的身軀及微透紅光的臉龐，就可知道他一定是個武學根基深厚的高手，\n穿著長袍的他看來一派溫文，但接觸到他如鷹的眼神，不由得令你對他多了幾分\n敬畏，眼前這位長者，正是掌握了天朝水路交通的水路第一大幫漕幫傳說中的總\n舵主蕭尹。蕭尹與哭笑門門主劉乙忘玄為莫逆之交，相傳年輕時雙雄一見如故，\n於青邪山上暢談抱負及武學相談甚歡，蕭尹創漕幫之初劉乙忘玄相助甚多，而哭\n笑門在武林中的許多仇家莫名暴斃，據說也與漕幫脫不了關係，兩人之間或明或\n暗的存在著一種互利的合作關係。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":45,"gender":"male","title":"漕幫總舵主","equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/xie_qing_xiang":{"id":"/custom/legacy_npc/xie_qing_xiang","file":"source/upstream/mudlib/custom/legacy_npc/xie_qing_xiang.c","name":"謝青翔","ids":["xie qing-xiang","xie","qing-xiang"],"long":"謝青翔是虎刀門掌門的師弟，也是虎刀門最年輕的教席。平常負責新\n入門弟子的刀法指導。這次來到斐縣，除了視察虎刀門在這裡的哨站\n情況之外，也是為了籌備幾個月後的本門大會。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":25,"gender":"male","title":"虎刀門教席","equip":[{"path":"/custom/weapon/blade/wind_slasher_blade","use":"wield"},{"path":"/custom/armor/finger/beast_ring","use":"wear"},{"path":"/custom/armor/feet/bull_boots","use":"wear"},{"path":"/custom/armor/cloth/tiger_coat","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/xing_long":{"id":"/custom/legacy_npc/xing_long","file":"source/upstream/mudlib/custom/legacy_npc/xing_long.c","name":"刑龍","ids":["xing long","xing","long"],"long":"一道熾熱的目光掃的你全身不自在了起來，如果不是剛摸了摸身上的衣袍，\n你真的以為自己忘了穿上衣服了....，轉身順著目光望了過去，一個身材\n瘦弱的男子，他的臉色蒼白，好像是身染重病一樣。男子揹在身後哪把與\n其身材不成比例的長杖，詭譎的流線、古怪的造型，正散發著一陣又一陣\n的淫靡之氣，刺激的你下身火熱.....","weight":null,"value":null,"unit":null,"flags":[],"race":"headless","class":"fighter","level":35,"gender":"male","title":"催情杖","equip":[{"path":"/custom/armor/feet/cloud_boots","use":"wear"},{"path":"/custom/armor/waist/water_dragon_girdle","use":"wear"},{"path":"/custom/weapon/staff/staff_of_eroticism","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/xu_xiao_e":{"id":"/custom/legacy_npc/xu_xiao_e","file":"source/upstream/mudlib/custom/legacy_npc/xu_xiao_e.c","name":"徐小惡","ids":["xu xiao e","xu"],"long":"她正是江湖上最令人髮指的惡盜「太湖雙惡」中的「風騷徐娘」徐小惡。\n據江湖傳聞, 三十年前她與丈夫白常惡在太湖邊打劫犯案, 殺人越貨, 著\n實闖下不小的名號! 後來與當時黃家鏢局的總鏢頭黃彥發生衝突, 搶走黃\n彥保下的一支大鏢, 黃彥一怒之下於是下戰書約定太湖生死相鬥! 白徐夫\n婦與黃彥相鬥一天一夜, 雙方疲狽不堪, 勝負難分, 但最後黃彥竟出人意\n料的太皇弓起, 鳳頭箭搭, 一箭帶走白常惡一命,","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":25,"gender":"female","title":null,"equip":[{"path":"/custom/weapon/blade/black_kris","use":"wield"},{"path":"/custom/armor/waist/water_dragon_girdle","use":"wear"},{"path":"/d/lee/obj/tight_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/xun_yuan_jian_yue":{"id":"/custom/legacy_npc/xun_yuan_jian_yue","file":"source/upstream/mudlib/custom/legacy_npc/xun_yuan_jian_yue.c","name":"軒轅劍月","ids":["xun-yuan jian yue","xun-yuan","yue"],"long":"此人長的英俊瀟灑，氣度雍容華貴，渾身上下透著一種讓人無法抗拒的魅\n力。與他的七位結義兄弟不同的是，軒轅劍月很少殺人。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":40,"gender":"male","title":null,"equip":[{"path":"/obj/area/obj/shortsword","use":"wield"},{"path":"/obj/area/obj/longsword","use":""},{"path":"/custom/armor/finger/dragon_ring","use":"wear"},{"path":"/custom/armor/feet/flying_boots","use":"wear"},{"path":"/custom/armor/cloth/blood_stained_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yaksa":{"id":"/custom/legacy_npc/yaksa","file":"source/upstream/mudlib/custom/legacy_npc/yaksa.c","name":"夜羅剎","ids":["yaksa"],"long":"妖艷的女性惡魔戰士﹐雖然看起來十分溫柔﹐可是她們驚人的戰鬥力\n以及獨特的戰鬥技巧是十分恐怖的。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":30,"gender":"female","title":null,"equip":[{"path":"/custom/armor/feet/embroidery_boots","use":"wear"},{"path":"/custom/armor/waist/girl_girth","use":"wear"},{"path":"/custom/armor/cloth/green_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yaksa_king":{"id":"/custom/legacy_npc/yaksa_king","file":"source/upstream/mudlib/custom/legacy_npc/yaksa_king.c","name":"羅剎王","ids":["yaksa king","yaksa","king"],"long":"羅剎王雙目如烈火般散發著讓人窒息的紅光﹐週身上下結實的肌肉更\n釋放出無窮的殺氣。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":35,"gender":"male","title":null,"equip":[{"path":"/d/wutang/obj/blue_cloth","use":"wear"},{"path":"/custom/armor/feet/forgod_boots","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yan_kuang_phon":{"id":"/custom/legacy_npc/yan_kuang_phon","file":"source/upstream/mudlib/custom/legacy_npc/yan_kuang_phon.c","name":"閰狂風","ids":["yan kuang phon","yan","phon"],"long":"閰狂風乃是黑風寨的四頭目, 早年拜於封山門下, 但不滿其於\n封山派之內不受到重視與重用, 故而積怨心中, 也因此他的封山\n劍招夾帶著一股邪惡之氣, 在幾十年前的一場封山派所舉行的武\n功比試大會中, 由於出手毫不留情, 殺死其同門師兄, 而因此被\n逐出師門, 但因為其天資聰穎早已習得封山武功精髓, 加上長年\n自行修練, 已經到了爐火純青的地步。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":40,"gender":"male","title":"黑風寨四頭目","equip":[{"path":"/custom/weapon/sword/smashing_sword","use":"wield"},{"path":"/custom/armor/armor/armor_of_violet_rohan","use":"wear"},{"path":"/custom/armor/cloth/sky_earth_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yan_she":{"id":"/custom/legacy_npc/yan_she","file":"source/upstream/mudlib/custom/legacy_npc/yan_she.c","name":"言歙","ids":["yan she","yan","she"],"long":"言歙乃是當今朝中紅人，不到不惑之年已官拜御史大夫，這次似乎是為\n了漕幫之事而來，漕幫行事向來低調，朝廷忽然對之展開調查想來必有\n原因。其為人貪杯好酒，但是辦起事來卻又十分穩當，武功平平不過逃\n命功夫一流。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"commoner","level":20,"gender":"male","title":"御史大夫","equip":[{"path":"/custom/armor/head/jade_hat","use":"wear"},{"path":"/custom/armor/cloth/dragon_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yen_hong":{"id":"/custom/legacy_npc/yen_hong","file":"source/upstream/mudlib/custom/legacy_npc/yen_hong.c","name":"晏訌","ids":["yen hong","yen","hong"],"long":"晏訌是老劍山徑莊主晏勢苔的獨生子, 和山徑執法上官笑夢之女\n上官小翠從小就是青梅竹馬..晏訌生性耿直, 木訥寡言, 但一身\n橫練鐵打功夫, 和單手能劈巨石的狂大膂力, 再加上晏勢苔親傳\n老劍山徑的漫雨刀法, 使得他在武林的名號已是響亮異常!。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"male","title":"老劍山徑第十二代弟子","equip":[{"path":"/custom/armor/armor/shoulder_armor","use":"wear"},{"path":"/custom/armor/feet/flycloud_boots","use":"wear"},{"path":"/custom/armor/cloth/broken_iron_cloth","use":"wear"},{"path":"/custom/weapon/blade/ghosts_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yin_euyen":{"id":"/custom/legacy_npc/yin_euyen","file":"source/upstream/mudlib/custom/legacy_npc/yin_euyen.c","name":"陰雨巖","ids":["yin euyen","yin","euyen"],"long":"陰雨巖是個相貌溫和的中年儒生，曾經中過舉人，但是做官不到半年就因為\n得罪長官而辭官回鄉，他後來棄文從武，在喬陰縣一帶的武林算得上是個人\n物。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"male","title":null,"equip":[{"path":"/obj/cloth","use":"wear"},{"path":"/obj/area/obj/leather_whip","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin/inn2",1]]},"/custom/legacy_npc/ying_xiao_tian":{"id":"/custom/legacy_npc/ying_xiao_tian","file":"source/upstream/mudlib/custom/legacy_npc/ying_xiao_tian.c","name":"應曉天","ids":["ying xiao tian","ying","tian"],"long":"一名長相俊逸的青年，這人一襲白衣，手上拿把描金折扇，瞧來甚是瀟灑\n不凡。但仔細一看，臉色蒼白、腳步浮虛，一副被酒色淘空了身子的模樣，\n兩顆眼睛逕盯著來往的女人，還掛滿了一臉的淫笑，腰上繫著一把雪白的\n長劍。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":40,"gender":"male","title":"落花劍","equip":[{"path":"/custom/weapon/sword/sword_of_holy_frost","use":"wield"},{"path":"/custom/armor/cloth/white_scholar_dress","use":"wear"},{"path":"/custom/armor/leg/red_dust_legs","use":"wear"},{"path":"/custom/armor/armor/shoulder_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yu_lan_jian_yi":{"id":"/custom/legacy_npc/yu_lan_jian_yi","file":"source/upstream/mudlib/custom/legacy_npc/yu_lan_jian_yi.c","name":"於蘭兼毅","ids":["yu lan jian yi","yu","yi"],"long":"於蘭兼毅是當今的武林盟主﹐也是天邪國公獨生子﹐如果你以為他是\n靠著貴族的身分而獲得武林盟主的地位﹐你可是會大吃一驚的﹐天邪\n國一向是於蘭宗室掌管武術之秘的一支﹐宗室中的人物在武林之中向\n來依照武林規矩﹐於蘭兼毅在武林中成名已超過三十年﹐除了執掌天\n邪派門戶之外﹐也和武林中另外五位奇人合稱「六賢」。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":70,"gender":"male","title":"天邪派掌門","equip":[{"path":"/custom/armor/head/brass_hat","use":"wear"},{"path":"/custom/armor/feet/spider_boots","use":"wear"},{"path":"/custom/armor/armor/dragon_armor","use":"wear"},{"path":"/custom/armor/hand/skin_gloves","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yu_pingyin":{"id":"/custom/legacy_npc/yu_pingyin","file":"source/upstream/mudlib/custom/legacy_npc/yu_pingyin.c","name":"魚平胤","ids":["yu pingyin","yu","pingyin"],"long":"魚平胤是雪吟山莊的少莊主﹐雖然生在雪吟山莊這樣的武林世家﹐但\n是他卻對學武不感興趣﹐因此在武學上的造詣遠不如魚鐵山的大弟子\n褚商魂﹐但是魚平胤天資極高﹐讀書時過目不忘﹐練武也是一點就通\n﹐許多武林中的高人都十分羨慕魚鐵山有這樣一個兒子。\n魚平胤對學武不感興趣﹐對道家長生之術卻十分著迷﹐若不是因為身\n為魚家唯一的獨子﹐可能早就入山尋仙去了。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"male","title":null,"equip":[{"path":"/custom/armor/armor/purple_cloud_mail","use":"wear"},{"path":"/custom/weapon/sword/ironsword","use":"wield"},{"path":"/obj/area/obj/leather_boot","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yu_shao_me":{"id":"/custom/legacy_npc/yu_shao_me","file":"source/upstream/mudlib/custom/legacy_npc/yu_shao_me.c","name":"語小梅","ids":["yu shao me","yu","me"],"long":"她擦了擦從額頭上流下的汗水, 一臉焦急地望著草原的彼端... 一張鵝蛋瓜子\n臉, 透著些許的緋紅, 兩顆可愛的小虎牙咬著下唇, 你見到她苦惱的模樣, 不\n禁有些心疼...。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":25,"gender":"female","title":null,"equip":[{"path":"/d/snow/npc/obj/white_dress","use":"wear"},{"path":"/custom/weapon/dagger/black_iron_dagger","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yu_tieshan":{"id":"/custom/legacy_npc/yu_tieshan","file":"source/upstream/mudlib/custom/legacy_npc/yu_tieshan.c","name":"魚鐵山","ids":["yu tieshan","yu","tieshan"],"long":"魚鐵山是雪吟莊的莊主，也是當今武林號稱「六賢」之一的武林高手，魚鐵山\n成名已近四十年，和當今武林盟主於蘭兼毅是總角之交，曾一起在天邪派前掌\n門於蘭焱門下學藝，不過由於於蘭兼毅是天邪國公世子，因此於蘭焱收於蘭兼\n毅為師弟，而魚鐵山反而要稱這位小他三歲的老友師叔了。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":65,"gender":"male","title":"雪吟莊莊主","equip":[{"path":"/custom/armor/head/brass_hat","use":"wear"},{"path":"/custom/armor/waist/water_dragon_girdle","use":"wear"},{"path":"/custom/armor/feet/spider_boots","use":"wear"},{"path":"/custom/armor/cloth/golden_robe","use":"wear"},{"path":"/custom/armor/finger/ring_of_mighty_dragon","use":"wear"},{"path":"/custom/weapon/blade/golden_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/yu_wen":{"id":"/custom/legacy_npc/yu_wen","file":"source/upstream/mudlib/custom/legacy_npc/yu_wen.c","name":"宇文嵐胥","ids":["yu wen","yu","wen"],"long":"一個身材高瘦的中年畫師, 他的臉孔清瞿, 眉間隱隱有憂色, 不時發出\n幾聲低沉的嘆氣聲 ...。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":20,"gender":"male","title":null,"equip":[{"path":"/custom/armor/cloth/black_mandarin_jacket","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zhang_jun_ren":{"id":"/custom/legacy_npc/zhang_jun_ren","file":"source/upstream/mudlib/custom/legacy_npc/zhang_jun_ren.c","name":"張俊仁","ids":["zhang jun ren","zhang","ren"],"long":"張俊仁是封山劍派掌門人柳東蘆的得意門生，雖然有些大器晚成，但是\n近年來行走江湖之中嚴守封山劍派門規，也算得上是一位大俠了。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":40,"gender":"male","title":"封山派弟子","equip":[{"path":"/custom/armor/leg/red_dust_legs","use":"wear"},{"path":"/d/wutang/obj/blue_cloth","use":"wear"},{"path":"/custom/armor/armor/steel_chain_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zhang_xiao_qian":{"id":"/custom/legacy_npc/zhang_xiao_qian","file":"source/upstream/mudlib/custom/legacy_npc/zhang_xiao_qian.c","name":"張小簽","ids":["zhang xiao qian","zhang","qian"],"long":"你面前這個雲遊四海的江湖藝人叫張小簽，他最擅長的就是變戲法，有時能把\n東西變沒，有時又能再變一個出來。你要是不相信的話，不妨給他點甚麼讓他\n變變看。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":"江湖藝人","equip":[{"path":"/d/lee/obj/leather_boots","use":"wear"},{"path":"/custom/armor/cloth/white_scholar_dress","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zhang_yun":{"id":"/custom/legacy_npc/zhang_yun","file":"source/upstream/mudlib/custom/legacy_npc/zhang_yun.c","name":"張雲","ids":["zhang yun","zhang","yun"],"long":"張雲十幾年前便拜在虎刀門耆宿「高慎」門下習武，後來到總壇參加比武\n大會，苦鬥近百合險勝「屠龍虎」駱雲飛，不料卻在十合之內敗給虎刀掌\n門僅十三歲的義女「孫漪」。此後他便留在總壇勤奮練功，五年不曾下山。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":35,"gender":"male","title":"虎刀門護衛","equip":[{"path":"/custom/armor/armor/hell_dragon_armor","use":"wear"},{"path":"/custom/armor/cloth/tiger_coat","use":"wear"},{"path":"/custom/armor/head/war_hat","use":"wear"},{"path":"/custom/weapon/blade/colosus_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zhao_hong_chun":{"id":"/custom/legacy_npc/zhao_hong_chun","file":"source/upstream/mudlib/custom/legacy_npc/zhao_hong_chun.c","name":"趙弘春","ids":["zhao hong chun","zhao","chun"],"long":"趙弘春是酉縣的縣令, 不過謠傳說他的官位是花銀子買來的, 再加上\n他平時總是常常結交一些達官貴人, 因此在仕途上也是一帆風順, 不\n過紫煙鎮的居民卻普遍對這位縣令沒有好感, 據說雲鶴山的盜匪就是\n因為和他作對, 而被官府通緝, 被迫躲進雲鶴山據地為王, 也因此趙\n弘春處心積慮的想要消滅那群盜匪, 以除其心腹大患.","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":"male","title":"縣令","equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zhao_xiao_jiu":{"id":"/custom/legacy_npc/zhao_xiao_jiu","file":"source/upstream/mudlib/custom/legacy_npc/zhao_xiao_jiu.c","name":"趙曉九","ids":["zhao xiao jiu","zhao","jiu"],"long":"趙曉九自由喜愛神秘的東西，所以才會當了道士，一天到晚玩弄著\n別人看不懂的把戲，畫著讓人莫名奇妙的道符。他最大的嗜好就是\n收集古籍，從中找尋失傳的法術。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"taoist","level":20,"gender":"male","title":"隱風觀道士","equip":[{"path":"/custom/weapon/sword/peachwood_sword","use":"wield"},{"path":"/custom/armor/feet/black_cloth_boots","use":"wear"},{"path":"/custom/armor/head/copper_hat","use":"wear"},{"path":"/custom/armor/cloth/gray_taoist_robe","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zhong_chu":{"id":"/custom/legacy_npc/zhong_chu","file":"source/upstream/mudlib/custom/legacy_npc/zhong_chu.c","name":"鍾貙","ids":["zhong chu","zhong","chu"],"long":"鍾貙是目前神武軍營最高指揮官，神武軍營鎮守志縣，牽制泰武定國，是天\n朝東南隅最重要防線，泰武定國雖然已歸順天朝十餘年，但其內部還是時有\n反天朝人士活動，所以神武軍營的重要性就更顯重要了，鍾貙是軒轅軍中的\n重要將領，天生神力，善使大槌，與其交鋒敗在其手下的對手常常總是慘死\n的血肉模糊難以辯別的，所以有的人會稱呼他為 \"活閻羅\" ，而這個名號也\n確確實實令許多對手聞風喪膽。","weight":null,"value":null,"unit":null,"flags":[],"race":"blackteeth","class":"soldier","level":40,"gender":"male","title":"神武軍營提督","equip":[{"path":"/custom/zhenwu/obj/steel_boots","use":"wear"},{"path":"/custom/armor/armor/dragon_plate_of_knights","use":"wear"},{"path":"/custom/armor/hand/steel_bracers","use":"wear"},{"path":"/custom/weapon/blunt/crasher_maul","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zhong_hao":{"id":"/custom/legacy_npc/zhong_hao","file":"source/upstream/mudlib/custom/legacy_npc/zhong_hao.c","name":"鍾豪","ids":["zhong hao","zhong","hao"],"long":"碧幽部落的族長，他不久前到森林裡去一趟回來就得了一場大病，不但到現在\n都還沒好，還越來越嚴重，他已經派人去找醫生來看病，也吃過多種草藥，都\n還是沒有好轉的跡象。","weight":null,"value":null,"unit":null,"flags":[],"race":"dingling","class":"fighter","level":10,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zombie_warrior":{"id":"/custom/legacy_npc/zombie_warrior","file":"source/upstream/mudlib/custom/legacy_npc/zombie_warrior.c","name":"戰屍","ids":["zombie warrior","zombie","warrior"],"long":"曾經擁有榮譽的戰士﹐死後的屍體仍留有活著時的戰意。正是這股戰鬥\n意念維持著他腐爛的身軀。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":30,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/zuo_guo_yi":{"id":"/custom/legacy_npc/zuo_guo_yi","file":"source/upstream/mudlib/custom/legacy_npc/zuo_guo_yi.c","name":"左國益","ids":["zuo guo yi","zuo","yi"],"long":"左國益是地氣塔塔頂的守衛主將﹐他身長九尺﹐站在你面前有如鐵塔\n一般﹐讓人望而生畏﹐即使是已經死了的人也不敢輕易惹他。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":30,"gender":"male","title":"地氣塔守衛","equip":[{"path":"/custom/armor/cloth/blood_stained_cloth","use":"wear"},{"path":"/custom/armor/armor/iron_torso","use":"wear"},{"path":"/custom/weapon/axe/grandaxe","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/taoism/npc/fire_taoist":{"id":"/custom/taoism/npc/fire_taoist","file":"source/upstream/mudlib/custom/taoism/npc/fire_taoist.c","name":"朱衣派弟子","ids":["red-taoist","red taoist","red","taoist","朱衣派弟子"],"long":"這名朱衣派弟子精通天師道法【火術】，手持長劍，身穿布衣。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"taoist","level":30,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/cloth","use":"wear"},{"path":"/obj/area/obj/longsword","use":"wield"}],"skills":[["天師道法【火術】",160,"taoism-fire"]],"wander":false,"ghost":false,"rooms":[["/d/snow/river1",1]]},"/custom/taoism/npc/freeze_taoist":{"id":"/custom/taoism/npc/freeze_taoist","file":"source/upstream/mudlib/custom/taoism/npc/freeze_taoist.c","name":"素衣派弟子","ids":["white-taoist","white taoist","white","taoist","素衣派弟子"],"long":"這名素衣派弟子精通天師道法【冰咒】，手持長劍，身穿布衣。","weight":null,"value":null,"unit":null,"flags":[],"race":"woochan","class":"taoist","level":30,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/cloth","use":"wear"},{"path":"/obj/area/obj/longsword","use":"wield"}],"skills":[["天師道法【冰咒】",160,"taoism-freeze"]],"wander":false,"ghost":false,"rooms":[["/d/snow/river1",1]]},"/custom/taoism/npc/maoshan_dog":{"id":"/custom/taoism/npc/maoshan_dog","file":"source/upstream/mudlib/custom/taoism/npc/maoshan_dog.c","name":"黃狗","ids":["summoned dog","dog"],"long":"一條由符紙化成的犬隻﹐一雙眼睛緊盯著主人的敵人。","weight":null,"value":null,"unit":"條","flags":[],"race":"beast","class":"commoner","level":1,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/taoism/npc/storm_taoist":{"id":"/custom/taoism/npc/storm_taoist","file":"source/upstream/mudlib/custom/taoism/npc/storm_taoist.c","name":"玄衣派弟子","ids":["black-taoist","black taoist","black","taoist","玄衣派弟子"],"long":"這名玄衣派弟子精通天師道法【風符】，手持長劍，身穿布衣。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"taoist","level":30,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/cloth","use":"wear"},{"path":"/obj/area/obj/longsword","use":"wield"}],"skills":[["天師道法【風符】",160,"taoism-storm"]],"wander":false,"ghost":false,"rooms":[["/d/snow/river1",1]]},"/custom/taoism/npc/thunder_taoist":{"id":"/custom/taoism/npc/thunder_taoist","file":"source/upstream/mudlib/custom/taoism/npc/thunder_taoist.c","name":"紫衣派弟子","ids":["purple-taoist","purple taoist","purple","taoist","紫衣派弟子"],"long":"這名紫衣派弟子精通天師道法【雷法】，手持長劍，身穿布衣。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"taoist","level":30,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/cloth","use":"wear"},{"path":"/obj/area/obj/longsword","use":"wield"}],"skills":[["天師道法【雷法】",160,"taoism-thunder"]],"wander":false,"ghost":false,"rooms":[["/d/snow/river1",1]]},"/custom/zhenwu/npc/lu_xinien":{"id":"/custom/zhenwu/npc/lu_xinien","file":"source/upstream/mudlib/custom/zhenwu/npc/lu_xinien.c","name":"魯熙年","ids":["lu xinien","lu","xinien","魯熙年"],"long":"魯熙年是一個身材微胖的中年武官﹐兩眼瞇成一條線﹐臉上總是露出似笑非笑的古怪表情。魯熙年同時也是振武營負責招募新兵的募兵官，如果你想從軍，請向他，辦理入伍(enlist)手續。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":25,"gender":"male","title":"徵兵官","equip":[{"path":"/custom/weapon/blade/steelblade","use":"wield"},{"path":"/custom/armor/head/iron_helmet","use":"wear"},{"path":"/custom/armor/waist/iron_girth","use":"wear"},{"path":"/custom/armor/armor/ring_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/yard10",1]]},"/custom/zhenwu/npc/mee_pei":{"id":"/custom/zhenwu/npc/mee_pei","file":"source/upstream/mudlib/custom/zhenwu/npc/mee_pei.c","name":"米沛","ids":["mee-pei","mee pei","mee","pei","米沛"],"long":"米沛是振武軍最高指揮官，身披戰甲，神情沉穩威嚴。他在軍中多年，以實戰與軍功一步步升任主將，看來約五十多歲。軍中傳聞具備相當實力的軍人可向他申請更進一步的職務，但相關條件目前仍待可靠資料補齊。","weight":null,"value":null,"unit":null,"flags":["限軍人"],"race":"human","class":"soldier","level":40,"gender":"male","title":null,"equip":[{"path":"/custom/zhenwu/obj/steel_boots","use":"wear"},{"path":"/custom/zhenwu/obj/fire_gauntlets","use":"wear"},{"path":"/custom/zhenwu/obj/steel_armor","use":"wear"},{"path":"/custom/zhenwu/obj/great_axe_of_mighty","use":"wield"},{"path":"/obj/books/book_of_assault","use":""}],"skills":[["重擊術",180,"powerblow"]],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/big_tent",1]]},"/custom/zhenwu/npc/soldier":{"id":"/custom/zhenwu/npc/soldier","file":"source/upstream/mudlib/custom/zhenwu/npc/soldier.c","name":"小兵","ids":["soldier","小兵"],"long":"軍營裡的新兵，通常負責簡單的體力工作。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":5,"gender":null,"title":null,"equip":[{"path":"/d/snow/npc/obj/clothboot","use":"wear"},{"path":"/d/snow/npc/obj/helmet","use":"wear"},{"path":"/d/snow/npc/obj/leather_armor","use":"wear"},{"path":"/custom/zhenwu/obj/short_pike","use":"wield"}],"skills":[["雙手槍法",20,"twohanded pike"],["縱躍閃躲之法",10,"dodge"],["拆招卸力之法",10,"parry"]],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/gate",2]]},"/custom/zhenwu/npc/target_stake":{"id":"/custom/zhenwu/npc/target_stake","file":"source/upstream/mudlib/custom/zhenwu/npc/target_stake.c","name":"假人","ids":["target stake","stake","假人"],"long":"這是一具軍營內供新兵練武的粗麻木樁，樁身佈滿刀痕與箭孔。它被牢牢固定在地面，不會還手，也不會因操練而損壞，正適合反覆磨練基本招式。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":20,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/yard02",5],["/custom/zhenwu/room/yard03",5],["/custom/zhenwu/room/yard13",5],["/custom/zhenwu/room/yard14",5]]},"/custom/zhenwu/npc/zhenwu_soldier":{"id":"/custom/zhenwu/npc/zhenwu_soldier","file":"source/upstream/mudlib/custom/zhenwu/npc/zhenwu_soldier.c","name":"振武軍營士兵","ids":["soldier","振武軍營士兵"],"long":"振武軍營士兵是天朝帝國邊防最基層的步兵。他身穿粗糙皮甲，手執沉重長槍，雖沒有江湖大俠般的絕頂輕功，卻有一身扎實的軍旅外家拳腳，每日都在營邊巡邏警戒。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":15,"gender":null,"title":null,"equip":[{"path":"/d/snow/npc/obj/clothboot","use":"wear"},{"path":"/d/snow/npc/obj/helmet","use":"wear"},{"path":"/d/snow/npc/obj/leather_armor","use":"wear"},{"path":"/obj/area/obj/pike","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/custom/zhenwu/room/yard04",5]]}},"rooms":{"/d/baihua/alley":{"id":"/d/baihua/alley","file":"source/upstream/mudlib/d/baihua/alley.c","short":"小巷","long":"你順著小路走, 這兒尋常人雖不多, 路旁的商家倒還挺會作生意的, 不斷向你招呼著. 一陣香肉味, 隱隱傳進你鼻子裡, 你不禁想起有好一陣子沒有吃香喝辣的了, 這就犒賞犒賞自己南北奔波, 終日殺戮的身子吧 !","exits":{"west":"/d/baihua/road1"},"objects":{"/d/baihua/npc/san":1,"/d/baihua/npc/girl":1},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[4,2,0]},"/d/baihua/cliff":{"id":"/d/baihua/cliff","file":"source/upstream/mudlib/d/baihua/cliff.c","short":"百花崖","long":"走到這裏時你嚇了一跳, 原來瓦屋之後竟有這般寬闊的景色, 在你腳邊的是深不見底的懸崖. 你心中暗叫僥倖! 差一點就摔下去了. 原來這裏是百花村的風景名勝之一『百花崖』, 你往下看去, 各式各樣的花沿著峭壁生長, 或者這就是百花村的由來吧!","exits":{"east":"/d/baihua/tile_house"},"objects":{"/d/baihua/npc/dou_foo":1},"special":[{"cmd":"climb 峭壁","to":"/d/baihua/platform"}],"area":"百花村","layer":null,"areaKey":"百花村","pos":[1,0,0]},"/d/baihua/cliff_edge":{"id":"/d/baihua/cliff_edge","file":"source/upstream/mudlib/d/baihua/cliff_edge.c","short":"峭壁邊","long":"峭壁的邊緣，一陣山風迎面吹來，吹得人衣袂翻飛。往下望去，雲霧在山腰間緩緩流動，底下的林木小得像一片青苔，遠方的山巒層層疊疊，直到天邊才與雲色融成一片。","exits":{"west":"/d/baihua/stone_road1"},"objects":{},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[4,0,0]},"/d/baihua/hillside":{"id":"/d/baihua/hillside","file":"source/upstream/mudlib/d/baihua/hillside.c","short":"山腰上","long":"這裡的坡度漸漸變得平緩，可是兩旁的雜草生得極其茂密，高度比人還高，不知不覺你發現自己已經找不到路徑了！遠處傳來陣陣的狼嚎聲，你不禁開始緊張了起來。在這種地方迷了路，那可不是件好玩的事，趕緊找出路吧。","exits":{"northwest":"/d/oldpine/grass2"},"objects":{"/d/oldpine/npc/goat":3},"special":[{"cmd":"search 草叢","to":"/d/baihua/trail"}],"area":"百花村","layer":null,"areaKey":"百花村","pos":[0,0,0]},"/d/baihua/inn":{"id":"/d/baihua/inn","file":"source/upstream/mudlib/d/baihua/inn.c","short":"紅燈客棧","long":"『簷前燈紅滿街照, 門後心酸何足道』. 一個深黑見方的木匾, 兩行金色狂草龍飛鳳舞的題於匾上, 氣勢狂野, 令人眼眩. 偌大一個大廳空空曠曠, 只有幾張板凳孤零零的四散著, 往二樓的樓梯被屏風擋著, 似乎已不宿客了.","exits":{"west":"/d/baihua/road2"},"objects":{"/custom/legacy_npc/gong_sun_zhi":1,"/d/baihua/npc/innkeeper":1,"/d/baihua/npc/traveller":1},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[4,3,0]},"/d/baihua/platform":{"id":"/d/baihua/platform","file":"source/upstream/mudlib/d/baihua/platform.c","short":"懸崖平台","long":"呼..呼....陣陣的山風颳在你身上，你遠望著三邊無際的景色，幾片雲絲飄浮在眼前，似乎伸手可及。這個平台相當隱密，有如仙界一般幽雅，令人心曠神怡，峭壁上的花朵，似乎有人在細心照料，開得十分繁盛。","exits":{"eastup":"/d/baihua/cliff"},"objects":{"/d/baihua/npc/kao_yeu":1},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[1,-1,0]},"/d/baihua/road1":{"id":"/d/baihua/road1","file":"source/upstream/mudlib/d/baihua/road1.c","short":"常春道","long":"百花村的主要通道，路面鋪著平整的石板，兩旁的屋舍排列得整整齊齊。路上往來的人並不多，卻處處打掃得一塵不染，門前的花盆也照料得十分細心，看得出村民都很愛惜這個地方。","exits":{"north":"/d/baihua/stone_road2","west":"/d/baihua/trail","east":"/d/baihua/alley","south":"/d/baihua/road2"},"objects":{},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[3,2,0]},"/d/baihua/road2":{"id":"/d/baihua/road2","file":"source/upstream/mudlib/d/baihua/road2.c","short":"常春道","long":"你走在一條小石子滿地的路上, 兩旁的花草樹木十分整齊的排列著, 右邊紅色燈籠整齊的掛在屋簷下, 看起來應該是個客棧. 遠眺南方草木叢生, 似乎人煙罕至, 隱隱的有幾聲狼嗥傳來, 坡度向東南而下.","exits":{"north":"/d/baihua/road1","east":"/d/baihua/inn","southwest":"/d/baihua/temple"},"objects":{"/d/baihua/npc/nan_kong_hen":1,"/obj/area/man":1},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[3,3,0]},"/d/baihua/school":{"id":"/d/baihua/school","file":"source/upstream/mudlib/d/baihua/school.c","short":"學堂","long":"一間簡樸的學堂，屋裡擺著幾張矮桌，牆上掛著一幅寫著「勤學」的字。幾個小學童坐在桌前搖頭晃腦地念著書，眼睛卻不時偷偷瞄向窗外，似乎一心只想著出去玩耍。","exits":{"east":"/d/baihua/stone_road2"},"objects":{"/d/baihua/npc/student":3},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[2,1,0]},"/d/baihua/stone_road1":{"id":"/d/baihua/stone_road1","file":"source/upstream/mudlib/d/baihua/stone_road1.c","short":"石子路","long":"一條鋪滿碎石子的小路，石子被往來的腳步磨得圓潤光滑，走起來沙沙作響。路旁種著一排排花草，紅的、黃的、紫的開成一片，花香隨風飄散，難怪這裡被稱作百花村。","exits":{"west":"/d/baihua/tile_house","east":"/d/baihua/cliff_edge","south":"/d/baihua/stone_road2"},"objects":{},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[3,0,0]},"/d/baihua/stone_road2":{"id":"/d/baihua/stone_road2","file":"source/upstream/mudlib/d/baihua/stone_road2.c","short":"石子路","long":"百花村裡的石子路，路面打掃得乾乾淨淨，看不到一片落葉。路邊的竹籬笆上攀滿了牽牛花，幾隻蝴蝶在花叢間翩翩飛舞，偶爾有村民挑著花籃經過，朝你和善地笑一笑。","exits":{"north":"/d/baihua/stone_road1","west":"/d/baihua/school","east":"/d/baihua/wang_home","south":"/d/baihua/road1"},"objects":{},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[3,1,0]},"/d/baihua/temple":{"id":"/d/baihua/temple","file":"source/upstream/mudlib/d/baihua/temple.c","short":"破舊小廟","long":"一座破舊的小廟，屋瓦殘缺不全，梁柱上的紅漆早已斑駁剝落。神案上的香爐積滿了灰，看來已經許久沒有人來上香了。廟門口蹲著一尊石獅子，雖然飽經風霜，神態依然威武。","exits":{"northeast":"/d/baihua/road2"},"objects":{"/d/baihua/npc/stone_lion":1},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[2,4,0]},"/d/baihua/tile_house":{"id":"/d/baihua/tile_house","file":"source/upstream/mudlib/d/baihua/tile_house.c","short":"瓦屋","long":"外觀破舊的瓦屋, 裡面卻相當清淨. 有股濃郁的藥材味撲鼻而來, 地上有多種材木, 味道顯然是由那些花花草草而來.","exits":{"west":"/d/baihua/cliff","east":"/d/baihua/stone_road1"},"objects":{"/d/baihua/npc/wang_yean":1},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[2,0,0]},"/d/baihua/trail":{"id":"/d/baihua/trail","file":"source/upstream/mudlib/d/baihua/trail.c","short":"荒野小徑","long":"終於隱隱約約發現有條小徑呈現著東南, 西北的走向, 遠望過去似乎有個村落在東邊, 還好沒迷了路。","exits":{"northwest":"/d/baihua/hillside","east":"/d/baihua/road1"},"objects":{},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[2,2,0]},"/d/baihua/wang_home":{"id":"/d/baihua/wang_home","file":"source/upstream/mudlib/d/baihua/wang_home.c","short":"老王的家","long":"老王是這個小村裡最德高望重的人了, 從有這個村開始, 老王就在這住下了. 他正坐在家門口向你搖著手, 示意你過去聊聊天, 和藹的笑容令你不自覺的想走了過去.","exits":{"west":"/d/baihua/stone_road2"},"objects":{"/d/baihua/npc/old_wang":1,"/d/baihua/npc/shepherd":1},"special":[],"area":"百花村","layer":null,"areaKey":"百花村","pos":[4,1,0]},"/d/kangping/forest_exit":{"id":"/d/kangping/forest_exit","file":"source/upstream/mudlib/d/kangping/forest_exit.c","short":"樹林口","long":"林木在這裡漸漸稀疏，陽光穿過枝葉灑落一地，腳下的落葉也少了許多。遠處山坳間升起幾縷炊煙，隱約可見一座小村落依偎在三煙谷口，看來總算要走出這片樹林了。","exits":{"west":"/d/oldpine/grass1","east":"/d/kangping/village_gate"},"objects":{},"special":[],"area":"康平村","layer":null,"areaKey":"康平村","pos":[-2,1,0]},"/d/kangping/hut":{"id":"/d/kangping/hut","file":"source/upstream/mudlib/d/kangping/hut.c","short":"草廬","long":"你現在來到一間草廬之中，廬中的桌椅傢俱都相當粗陋，有些還是帶著樹皮的木頭做的，一邊的牆上掛著幾件簑衣，門邊放著一個小火爐，從窗戶望出去可以看到草廬後有個小池塘。","exits":{"west":"/d/kangping/square"},"objects":{"/custom/legacy_npc/old_taoist":1},"special":[],"area":"康平村","layer":null,"areaKey":"康平村","pos":[1,1,0]},"/d/kangping/inn":{"id":"/d/kangping/inn","file":"source/upstream/mudlib/d/kangping/inn.c","short":"小客店","long":"你現在來到一家小客店，這家客店很小，連招牌也沒有，牆壁都是木板，風吹過就一陣吱吱嘎嘎響，客店門口一條小路往西。","exits":{"west":"/d/kangping/valley_mouth"},"objects":{"/custom/legacy_npc/ou_yan_wu_ji_2":1,"/custom/legacy_npc/liuh_chuen_fon":1,"/d/kangping/npc/innkeeper":1},"special":[],"area":"康平村","layer":null,"areaKey":"康平村","pos":[1,0,0]},"/d/kangping/square":{"id":"/d/kangping/square","file":"source/upstream/mudlib/d/kangping/square.c","short":"廣場","long":"村子中央的一片空地，正中有一口古井，井邊的青石被打水的人磨得發亮。村民們常在這裡洗衣、打水、閒話家常，孩子們繞著井邊追逐嬉鬧，是全村上下最熱鬧的地方。","exits":{"north":"/d/kangping/valley_mouth","east":"/d/kangping/hut"},"objects":{"/d/kangping/npc/kid":1},"special":[],"area":"康平村","layer":null,"areaKey":"康平村","pos":[0,1,0]},"/d/kangping/valley_mouth":{"id":"/d/kangping/valley_mouth","file":"source/upstream/mudlib/d/kangping/valley_mouth.c","short":"谷口","long":"康平村的北口，再往北走便是三煙谷，谷中終年飄著三道淡淡的煙霧，因而得名。近來谷裡常有野狼出沒，夜裡狼嚎聲此起彼落，村民在路口立了一道木柵，天黑之後便不讓人進谷了。","exits":{"west":"/d/kangping/village","east":"/d/kangping/inn","south":"/d/kangping/square"},"objects":{},"special":[],"area":"康平村","layer":null,"areaKey":"康平村","pos":[0,0,0]},"/d/kangping/village":{"id":"/d/kangping/village","file":"source/upstream/mudlib/d/kangping/village.c","short":"康平村","long":"康平村裡的一條土路，兩旁是幾戶低矮的農家，屋前曬著穀子與草藥，籬笆上爬滿了瓜藤。村民大多靠著上山採藥、打獵維生，見到生人也只是點點頭，又低頭忙著自己的活兒。","exits":{"south":"/d/kangping/village_gate","east":"/d/kangping/valley_mouth"},"objects":{},"special":[],"area":"康平村","layer":null,"areaKey":"康平村","pos":[-1,0,0]},"/d/kangping/village_gate":{"id":"/d/kangping/village_gate","file":"source/upstream/mudlib/d/kangping/village_gate.c","short":"康平村","long":"康平村的村口，一塊飽經風吹日曬的木牌插在路旁，上頭刻著「康平」兩個大字。這個小村落夾在樹林與三煙谷之間，平日少有外人往來，幾隻土雞在路邊悠閒地啄食，四下顯得格外安靜。","exits":{"west":"/d/kangping/forest_exit","north":"/d/kangping/village"},"objects":{},"special":[],"area":"康平村","layer":null,"areaKey":"康平村","pos":[-1,1,0]},"/d/lee/creek":{"id":"/d/lee/creek","file":"source/upstream/mudlib/d/lee/creek.c","short":"小溪","long":"清淺溪水貼著李家村東側緩緩流過，岸邊散著大小不一的石塊。西面靠近瓜田，北面則可沿溪邊小路返回村東門。溪水清澈見底，偶爾能看見幾尾小魚悠游其中，石塊上還留著村婦浣衣時留下的濕痕。","exits":{"north":"/d/lee/riverside_s","west":"/d/lee/watermelon_n3"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[0,1,0]},"/d/lee/entrance_s":{"id":"/d/lee/entrance_s","file":"source/upstream/mudlib/d/lee/entrance_s.c","short":"村口","long":"這裡是李家村南面的村口，北方木製大門後便是村內街道。往西南沿著小路離村，便可回到雪亭一帶兩條河流交會的河邊。路邊立著一塊半人高的青石界碑年久失修，「李家村」三個字已被歲月磨得淺淡，碑角還纏著幾圈舊布條，像是往來旅客隨手繫上的平安結。幾名風塵僕僕的旅客或坐或倚在碑石邊，一邊揉著痠痛的腿腳，一邊互相打聽前方村鎮的近況。","exits":{"north":"/d/lee/gate_s","southwest":"/d/snow/egate"},"objects":{"/d/lee/npc/traveller":3},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,5,0]},"/d/lee/eroad1":{"id":"/d/lee/eroad1","file":"source/upstream/mudlib/d/lee/eroad1.c","short":"石子路","long":"廣場東面的石子路筆直延伸，兩側逐漸由房舍轉為田地。往東仍可看見另一段道路與村口方向。路旁的屋舍漸漸稀疏，取而代之的是連片的田埂，偶有農人挑著擔子由此經過，留下一串深淺不一的腳印。","exits":{"west":"/d/lee/square_e","east":"/d/lee/eroad2"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-3,0,0]},"/d/lee/eroad2":{"id":"/d/lee/eroad2","file":"source/upstream/mudlib/d/lee/eroad2.c","short":"石子路","long":"這段石子路鄰近村東，風中已帶著田野與溪水的氣味。向西可回廣場，向東則通往村口大門。路面兩側種著幾株矮樹，枝葉隨風輕輕搖晃，遠遠便能聽見溪水流動的聲響，替這段路添了幾分清涼。","exits":{"west":"/d/lee/eroad1","east":"/d/lee/gate_e"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-2,0,0]},"/d/lee/farm_w1":{"id":"/d/lee/farm_w1","file":"source/upstream/mudlib/d/lee/farm_w1.c","short":"農家","long":"低矮農舍圍著小院，院裡擺著竹籃、農具與曬乾的作物。屋主人多半白日下田，只留下家人照看家務。院牆邊晾著幾件洗過的衣物，隨風輕輕擺動，屋簷下掛著一串串曬乾的辣椒與玉米，透出濃濃的農家氣息。院裡的婦人手裡忙著縫補衣物，見有人經過，總會抬頭善意地點個頭。","exits":{"north":"/d/lee/wroad2","east":"/d/lee/farm_w2"},"objects":{"/d/lee/npc/woman":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-8,1,0]},"/d/lee/farm_w2":{"id":"/d/lee/farm_w2","file":"source/upstream/mudlib/d/lee/farm_w2.c","short":"農家","long":"另一戶農家的院牆由土磚砌成，門口靠著犁與鋤頭。雞鳴與人聲不時從院內傳出，顯得十分尋常。牆角堆著幾捆乾草，牆頭上還曬著幾張剛洗過的粗布，看得出這戶人家過得雖不寬裕，倒也打理得井井有條。","exits":{"north":"/d/lee/wroad3","west":"/d/lee/farm_w1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-7,1,0]},"/d/lee/gate_e":{"id":"/d/lee/gate_e","file":"source/upstream/mudlib/d/lee/gate_e.c","short":"村口大門","long":"李家村東面的村口大門立在道路盡頭，門外很快便接近溪畔。木門兩旁有簡單的守望位置，方便村民巡看。厚重的木門終年開著，門板下緣已經磨出一道淺淺的弧痕，是無數車輪與腳步經年累月踩踏出來的。守衛倚在門邊的木樁上，一邊留意著往來行人，一邊靜靜聽著不遠處溪水潺潺的聲音，偶爾有村民挑著擔子經過，總會停下來寒暄兩句。","exits":{"west":"/d/lee/eroad2","east":"/d/lee/riverside_s"},"objects":{"/d/lee/npc/guard":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-1,0,0]},"/d/lee/gate_n":{"id":"/d/lee/gate_n","file":"source/upstream/mudlib/d/lee/gate_n.c","short":"村口大門","long":"李家村北面的村口大門由厚實木料搭成，門柱上留著長年風吹雨打的痕跡。門內石子路向南伸入村中，兩旁低矮屋舍與田地相間，來往村民大多在此放慢腳步。兩名守衛並肩站在門洞下，腰間各佩著趁手的兵器，見到生面孔進村，總會多看上兩眼。門楣上掛著一塊褪色的木匾，隱約可辨「李家村」三個字，是村里請人重新描過漆的。","exits":{"south":"/d/lee/nroad1"},"objects":{"/d/lee/npc/guard":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,-4,0]},"/d/lee/gate_s":{"id":"/d/lee/gate_s","file":"source/upstream/mudlib/d/lee/gate_s.c","short":"村口大門","long":"李家村南面的村口大門守著主要進村道路。從這裡往北就是村內街道，往南則通向村口與外面的道路。這是村里人來人往最頻繁的一道門，門洞兩側的石牆被經年的手掌磨得光滑，牆角還堆著幾捆備用的柴薪。兩名守衛神情警覺，不時交換幾句低語，遇上面生的旅人便會多打量幾眼，確認沒有可疑之處才放行。","exits":{"north":"/d/lee/street2","south":"/d/lee/entrance_s"},"objects":{"/d/lee/npc/guard":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,4,0]},"/d/lee/gate_w":{"id":"/d/lee/gate_w","file":"source/upstream/mudlib/d/lee/gate_w.c","short":"村口大門","long":"李家村西面的木製大門橫跨道路，門外道路通向村外，門內則接上筆直石子路。守衛偶爾在門旁巡看來往行人。門邊立著一根老舊的拴馬樁，樁身被繩索磨出深深的溝痕，看得出往來的行商經常在此歇腳餵馬。兩名守衛肩靠著門柱閒聊村里近日的瑣事，見有人靠近才收起話頭，恢復巡看的神色。","exits":{"east":"/d/lee/wroad1"},"objects":{"/d/lee/npc/guard":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-10,0,0]},"/d/lee/grocery":{"id":"/d/lee/grocery","file":"source/upstream/mudlib/d/lee/grocery.c","short":"雜貨鋪","long":"小小的雜貨鋪裡擺著油鹽、繩索、陶器與各式家常用品，貨架高低不一。這裡主要做附近村民的生意，東門通往石子路。櫃臺上擺著一把用得十分發亮的舊算盤，旁邊還堆疊著幾本記帳的簿冊，牆角還立著幾捆備用的麻繩與陶罐，看得出這裡的貨色雖不起眼，卻樣樣齊全。","exits":{"east":"/d/lee/nroad2"},"objects":{"/d/lee/npc/lee_zhong":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-6,-2,0]},"/d/lee/herb_shop":{"id":"/d/lee/herb_shop","file":"source/upstream/mudlib/d/lee/herb_shop.c","short":"藥鋪","long":"這是一間不大的藥鋪，木櫃裡分門別類收著藥材與丹藥，空氣中混著草根與藥香。掌櫃李岩守著櫃臺，店門朝東開向石子路。牆上掛著幾串曬乾的藥草，屋樑上懸著一副舊招牌，字跡已經有些斑駁老舊。鋪子裡賣的丹藥多是聶晟閒暇時煉的，價格公道，村民生病時多半先來這裡瞧瞧。","exits":{"east":"/d/lee/nroad1"},"objects":{"/d/lee/npc/lee_yen":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-6,-3,0]},"/d/lee/hunter":{"id":"/d/lee/hunter","file":"source/upstream/mudlib/d/lee/hunter.c","short":"木屋","long":"屋內陳設雖然簡單，卻處處留著長年狩獵生活的痕跡。幾件簡單的家具散落其中。牆邊掛著幾件獵具，地上還堆著幾張尚未處理的獸皮。屋子中央擺著一張木桌。桌上除了幾件零散的獵具外，還放著一塊沾滿污漬的破布，似乎已經使用了很長一段時間。","exits":{"south":"/d/lee/wroad2"},"objects":{"/d/lee/npc/lee_yong":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-8,-1,0]},"/d/lee/inn":{"id":"/d/lee/inn","file":"source/upstream/mudlib/d/lee/inn.c","short":"小旅店","long":"這是一間規模很小的旅店，屋裡只有幾張老舊桌椅。店小二忙著招呼客人，說書先生李半仙偶爾在此停留，東門通往街道。牆角一張矮桌上擺著粗陶茶壺與幾個缺了口的碗，看得出這裡的客人多是圖個實在，不講究排場。牆上掛著一塊掉漆的木牌，歪歪斜斜地寫著幾樣簡單的吃食。","exits":{"east":"/d/lee/street2"},"objects":{"/d/lee/npc/waiter":1,"/d/lee/npc/li_ban_xian":1,"/custom/legacy_npc/du_feng_ling":"1     // 幻霧觀觀主（使用者指示，2026-10-25）"},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,3,0]},"/d/lee/nie_backroom":{"id":"/d/lee/nie_backroom","file":"source/upstream/mudlib/d/lee/nie_backroom.c","short":"丹房","long":"這裡是醫館後方的一間小室，靠牆放著一座青銅丹爐與丹鼎，爐火尚有些許餘溫，看起來不久前才煉過藥。\n牆角一張矮榻鋪著薄被，榻邊小几上擺著一壺涼透的茶與幾卷翻開的醫書，這裡是聶晟煉丹與歇息的\n地方，平時鮮少有外人進來走動探訪打擾。","exits":{"out":"/d/lee/shrine"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-7,-2,0]},"/d/lee/nroad1":{"id":"/d/lee/nroad1","file":"source/upstream/mudlib/d/lee/nroad1.c","short":"石子路","long":"平整石子鋪成的小路穿過村北，雨後石縫仍留著些水氣。西側是一間藥鋪，門前藥香隨風散出；南北兩端都是通往村中與村口的道路。路邊立著一根老石燈籠，每逢夜色降臨，便會有人點上燈火，替晚歸的村民照亮腳下的路。","exits":{"north":"/d/lee/gate_n","south":"/d/lee/nroad2","west":"/d/lee/herb_shop"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,-3,0]},"/d/lee/nroad2":{"id":"/d/lee/nroad2","file":"source/upstream/mudlib/d/lee/nroad2.c","short":"石子路","long":"這段石子路兩旁房舍漸密，西側雜貨鋪門口堆著日用雜物。路面被車輪與腳步磨得發亮，向南可以繼續前往村中的廣場。路旁幾隻雞悠閒地啄著地上散落的穀粒，對來往的行人視若無睹，替這段熱鬧的路添了幾分生活氣息。","exits":{"north":"/d/lee/nroad1","south":"/d/lee/nroad3","west":"/d/lee/grocery"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,-2,0]},"/d/lee/nroad3":{"id":"/d/lee/nroad3","file":"source/upstream/mudlib/d/lee/nroad3.c","short":"石子路","long":"石子路到了村中心附近變得熱鬧，西側可見私塾的木門與窗紙。孩童讀書聲偶爾越牆而出，南面就是村內往來最頻繁的廣場。路邊有棵老槐樹，樹蔭下擺著一張石凳，常有村民坐著乘涼，順道聽一聽牆內傳來的讀書聲。","exits":{"north":"/d/lee/nroad2","south":"/d/lee/square_w","west":"/d/lee/school"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,-1,0]},"/d/lee/pawnshop":{"id":"/d/lee/pawnshop","file":"source/upstream/mudlib/d/lee/pawnshop.c","short":"李記當鋪","long":"李員外在村裡的主要生意之一，掌櫃李嘯天替李家打理此處產業。附近的旅客、店鋪都會到這典當周轉，\n櫃臺後堆著各式不同標記的木箱，看來頗為貴重。牆上掛著一幅字畫，寫著「童叟無欺」四個大字，算是給\n上門的客人先吃顆定心丸。櫃臺邊還擺著一把算盤與幾疊當票，透著幾分精打細算的生意氣息。","exits":{"east":"/d/lee/street1"},"objects":{"/d/lee/npc/lee_xiao_tian":1,"/obj/food/mooncake":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,2,0]},"/d/lee/riverside_n1":{"id":"/d/lee/riverside_n1","file":"source/upstream/mudlib/d/lee/riverside_n1.c","short":"溪邊小路","long":"沿溪小路夾在村舍與水岸之間，北面還能隱約望見拱橋方向。南北兩端都順著溪流延伸。一名村婦蹲在溪邊，手裡捧著木盆，正仔細地搓洗衣物，木盆碰撞石塊發出輕微的聲響，與潺潺水聲交織在一起。","exits":{"north":"/d/lee/riverside_n2","south":"/d/lee/riverside_s"},"objects":{"/d/lee/npc/woman":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[0,-1,0]},"/d/lee/riv
