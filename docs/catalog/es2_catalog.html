a":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-2,2,0]},"/d/wutang/yan_gate":{"id":"/d/wutang/yan_gate","file":"source/upstream/mudlib/d/wutang/yan_gate.c","short":"前門","long":"顏家大宅的前門，四周一片死寂，杳無人煙。門板與石階上留著斑斑血跡，牆上還有好幾道深深的刀痕，看得出這裡不久前經過一場惡鬥。往北可以進入大宅，往東則能回到廟口小路。","exits":{"north":"/d/wutang/yan_mansion","east":"/d/wutang/temple_road_n"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[4,0,0]},"/d/wutang/yan_hall":{"id":"/d/wutang/yan_hall","file":"source/upstream/mudlib/d/wutang/yan_hall.c","short":"大廳","long":"顏家大宅的正廳，原本氣派的桌椅翻倒在地，名貴的瓷器碎了一地。幾具家僕與丫鬟的屍體橫陳在血泊之中，看來都是被一刀斃命。主人的座位空空蕩蕩，似乎在出事之前就已經逃走了。","exits":{"out":"/d/wutang/yan_mansion"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[4,-2,0]},"/d/wutang/yan_mansion":{"id":"/d/wutang/yan_mansion","file":"source/upstream/mudlib/d/wutang/yan_mansion.c","short":"顏家大宅","long":"大宅的門戶敞開著，雕樑畫棟、朱漆門柱都看得出顏家當年的輝煌，如今卻蒙上了一層灰，庭院裡的花草也已經枯萎。院中靜得出奇，只有幾隻烏鴉停在屋簷上。往裡走是正廳，往南則是大宅的前門。","exits":{"in":"/d/wutang/yan_hall","south":"/d/wutang/yan_gate"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[4,-1,0]},"/custom/zhenwu/room/big_tent":{"id":"/custom/zhenwu/room/big_tent","file":"source/upstream/mudlib/custom/zhenwu/room/big_tent.c","short":"大帳","long":"一座厚重軍帳立在校場北端，帳布經風吹日曬已略顯褪色，帳前卻收拾得一塵不亂。兩側兵器架與軍旗排列整齊，往來士卒經過此處都不自覺放輕聲音，顯示這裡是軍中主將處理軍務的地方。","exits":{"out":"/custom/zhenwu/room/yard04"},"objects":{"/custom/zhenwu/npc/mee_pei":1},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-1,-1,0]},"/custom/zhenwu/room/camp":{"id":"/custom/zhenwu/room/camp","file":"source/upstream/mudlib/custom/zhenwu/room/camp.c","short":"軍營","long":"這裡是振武軍營西側的營區入口，木柵與營帳沿路排列，來往軍士神色匆忙。東邊棚場後便是大片校場，遠處號令聲此起彼落；往東一路穿過營地，可回到雪亭鎮南方草棚附近。","exits":{"east":"/custom/zhenwu/room/shed"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-3,2,0]},"/custom/zhenwu/room/gate":{"id":"/custom/zhenwu/room/gate","file":"source/upstream/mudlib/custom/zhenwu/room/gate.c","short":"振武軍營大門","long":"兩扇厚重木門構成振武軍營的主要門戶，門板外包鐵條，兩側木柵高聳。守門士兵持槍立在門旁，目光不時掃過往來人群；門內便是操練校場，軍旗與號令聲從營中不斷傳來。往東就到雪亭鎮。","exits":{"west":"/custom/zhenwu/room/yard06","east":"/d/snow/sgate","south":"/d/wutang/entrance"},"objects":{"/custom/zhenwu/npc/soldier":2},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[2,0,0]},"/custom/zhenwu/room/shed":{"id":"/custom/zhenwu/room/shed","file":"source/upstream/mudlib/custom/zhenwu/room/shed.c","short":"棚場","long":"一排簡陋木棚沿著軍營西側搭建，棚下堆著草束、木料與日常操演所需的雜物。地面有車輪與軍靴留下的痕跡，向東便是校場，向西則可通往軍營外側。","exits":{"east":"/custom/zhenwu/room/yard10","west":"/custom/zhenwu/room/camp"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-2,2,0]},"/custom/zhenwu/room/yard02":{"id":"/custom/zhenwu/room/yard02","file":"source/upstream/mudlib/custom/zhenwu/room/yard02.c","short":"校場","long":"這片校場靠近大帳，黃土地被長年操演磨得平整堅實。幾根粗木立在場邊，木身遍布刀痕與撞擊留下的缺口，北風穿過營旗時發出獵獵聲響，使整座軍營顯得肅整而緊張。","exits":{"east":"/custom/zhenwu/room/yard03","south":"/custom/zhenwu/room/yard05"},"objects":{"/custom/zhenwu/npc/target_stake":5},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[0,-1,0]},"/custom/zhenwu/room/yard03":{"id":"/custom/zhenwu/room/yard03","file":"source/upstream/mudlib/custom/zhenwu/room/yard03.c","short":"校場","long":"校場東北角視野開闊，往來軍士多從這裡穿過。地上用石灰與木樁分出操練的位置，遠處可見振武軍營大門，守門軍士的身影在門樓下來回巡視，營內一切井然有序。","exits":{"west":"/custom/zhenwu/room/yard02","south":"/custom/zhenwu/room/yard06"},"objects":{"/custom/zhenwu/npc/target_stake":5},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[1,-1,0]},"/custom/zhenwu/room/yard04":{"id":"/custom/zhenwu/room/yard04","file":"source/upstream/mudlib/custom/zhenwu/room/yard04.c","short":"校場","long":"這裡是校場西側，土地上散著被踏碎的草梗與細石。附近常有士卒列隊練習步伐，沉重腳步把地面踩出一道道淺痕；向北可望見大帳，向東則是軍營較寬闊的操演區。","exits":{"in":"/custom/zhenwu/room/big_tent","south":"/custom/zhenwu/room/yard07","east":"/custom/zhenwu/room/yard05"},"objects":{"/custom/zhenwu/npc/zhenwu_soldier":5},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-1,0,0]},"/custom/zhenwu/room/yard05":{"id":"/custom/zhenwu/room/yard05","file":"source/upstream/mudlib/custom/zhenwu/room/yard05.c","short":"校場","long":"校場中央人聲與兵器碰撞聲最為集中，四周黃土被反覆踩踏得幾乎不生寸草。場邊插著幾面振武軍旗，風一吹便整齊展開，讓人一踏進來便感受到軍伍特有的森嚴氣息。","exits":{"north":"/custom/zhenwu/room/yard02","south":"/custom/zhenwu/room/yard08","west":"/custom/zhenwu/room/yard04","east":"/custom/zhenwu/room/yard06"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[0,0,0]},"/custom/zhenwu/room/yard06":{"id":"/custom/zhenwu/room/yard06","file":"source/upstream/mudlib/custom/zhenwu/room/yard06.c","short":"校場","long":"這片校場緊鄰軍營大門，來往軍士不時從東邊經過。木製拒馬與練兵器具靠著場邊擺放，地面仍留有整隊操練形成的平直足跡，遠近都能聽見教官短促有力的號令。","exits":{"north":"/custom/zhenwu/room/yard03","south":"/custom/zhenwu/room/yard09","west":"/custom/zhenwu/room/yard05","east":"/custom/zhenwu/room/gate"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[1,0,0]},"/custom/zhenwu/room/yard07":{"id":"/custom/zhenwu/room/yard07","file":"source/upstream/mudlib/custom/zhenwu/room/yard07.c","short":"校場","long":"校場西邊較為安靜，幾座兵器架在風中微微作響。地上散落著操練後留下的木屑，長槍與刀具劃過木樁的痕跡清晰可見，顯然每日都有不少新兵在此反覆磨練基本功。","exits":{"north":"/custom/zhenwu/room/yard04","south":"/custom/zhenwu/room/yard10","east":"/custom/zhenwu/room/yard08"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[-1,1,0]},"/custom/zhenwu/room/yard08":{"id":"/custom/zhenwu/room/yard08","file":"source/upstream/mudlib/custom/zhenwu/room/yard08.c","short":"校場","long":"這裡位於軍營腹地，四周校場彼此相連，腳下黃土因長年操練而堅硬如石。軍士奔走時揚起薄薄塵霧，營旗、木樁與兵器架錯落在視野中，整片區域充滿規律而沉重的軍旅節奏。","exits":{"north":"/custom/zhenwu/room/yard05","south":"/custom/zhenwu/room/yard11","west":"/custom/zhenwu/room/yard07","east":"/custom/zhenwu/room/yard09"},"objects":{},"special":[],"area":"振武軍營","layer":null,"areaKey":"振武軍營","pos":[0,1,0]},"/custom/zhenwu/room/yard09":{"id":"/custom/zhenwu/room/yard09","file":"source/upstream/mudlib/custom/zhenwu/room/yard09.c","short":"校場","long":"東側校場靠近營牆，風從牆頭吹落，捲起細碎塵沙。幾處木樁上密布槍刺與刀劈的痕跡，場邊還留著拖動重物形成 <script>
(function () {
  const D = JSON.parse(document.getElementById('catalog-data').textContent);
  const $ = (s, el) => (el || document).querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const plain = s => String(s || '').replace(/\x1b\[[0-9;]*m/g, '');

  // 把遊戲的 ANSI 色碼轉成 span
  function ansi(s) {
    s = String(s || '');
    let out = '', open = false;
    const re = /\x1b\[([0-9;]*)m/g;
    let last = 0, m;
    while ((m = re.exec(s))) {
      out += esc(s.slice(last, m.index));
      last = re.lastIndex;
      const codes = m[1].split(';').filter(Boolean).map(Number);
      if (open) { out += '</span>'; open = false; }
      const cls = codes.filter(c => c === 1 || (c >= 30 && c <= 37)).map(c => 'a' + c);
      if (cls.length && !(codes.length === 1 && codes[0] === 0)) { out += '<span class="' + cls.join(' ') + '">'; open = true; }
    }
    out += esc(s.slice(last));
    if (open) out += '</span>';
    return out;
  }

  // 索引：誰帶著這件裝備、放在哪些房間
  const holders = {};
  Object.values(D.npcs).forEach(n => (n.equip || []).forEach(e => { (holders[e.path] = holders[e.path] || []).push(n.id); }));
  const byId = {};
  D.weapons.forEach(w => byId[w.id] = { tab: 'weapons', it: w });
  D.armors.forEach(a => byId[a.id] = { tab: 'armors', it: a });
  D.items.forEach(i => byId[i.id] = { tab: 'items', it: i });
  const areaOfRoom = {};
  D.areas.forEach(a => a.rooms.forEach(r => areaOfRoom[r] = a.key));

  const TABS = [
    { key: 'skills', label: '技能', n: D.skills.length },
    { key: 'rules', label: '共同規則', n: D.rules.length },
    { key: 'weapons', label: '武器', n: D.weapons.length },
    { key: 'armors', label: '防具', n: D.armors.length },
    { key: 'items', label: '物品', n: D.items.length },
    { key: 'npcs', label: 'NPC', n: Object.keys(D.npcs).length },
    { key: 'areas', label: '區域', n: D.areas.length },
  ];
  const state = { tab: 'weapons', q: '', sub: {}, open: null, area: D.areas[0] && D.areas[0].key, room: null, hl: null };
  try { const t = localStorage.getItem('es2cat-tab'); if (t && TABS.some(x => x.key === t)) state.tab = t; } catch (e) {}
  const hash = location.hash.replace('#', '');
  if (TABS.some(x => x.key === hash)) state.tab = hash;

  const c = D.counts;
  $('#tally').textContent = `技能 ${c.skills}・武器 ${c.weapons}・防具 ${c.armors}・物品 ${c.items}・NPC ${c.npcs}・房間 ${c.rooms}`;

  function drawTabs() {
    $('#tabs').innerHTML = TABS.map(t => `<button role="tab" data-tab="${t.key}" aria-selected="${t.key === state.tab}">${t.label}</button>`).join('');
  }
  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    go(b.dataset.tab);
  });
  function go(tab, opts) {
    state.tab = tab; state.open = null; state.q = '';
    Object.assign(state, opts || {});
    try { localStorage.setItem('es2cat-tab', tab); } catch (e) {}
    drawTabs(); render();
    if (state.open) {
      const el = document.querySelector(`[data-row="${CSS.escape(state.open)}"]`);
      if (el) el.scrollIntoView({ block: 'center' });
    } else window.scrollTo(0, 0);
  }

  // ---------------------------------------------------------------- 共用
  function flagsHtml(flags) {
    return (flags || []).map(f => `<span class="tag ${f === '唯一' || f === '劇毒' || f === '特攻' ? 'seal' : f.startsWith('限') ? 'gold' : ''}">${esc(f)}</span>`).join('');
  }
  function traitText(list) { return (list || []).map(([k, v]) => `${k} ${v > 0 ? '+' : ''}${v}`).join('、'); }
  function fileLine(file) {
    return file ? `<span class="file">${esc(file)}</span><button class="copy" data-copy="${esc(file)}">複製</button>` : '';
  }
  function whereHtml(id) {
    const hs = holders[id] || [];
    const rs = D.itemRooms[id] || [];
    const parts = [];
    if (hs.length) parts.push('持有者：' + hs.map(n => `<button class="linkish" data-npc="${esc(n)}">${ansi(D.npcs[n].name)}</button>`).join('、'));
    if (rs.length) parts.push('放置：' + rs.map(([r, n]) => roomLink(r) + (n > 1 ? ` ×${n}` : '')).join('、'));
    return parts.join('<br>') || '<span class="hint">目前沒有 NPC 攜帶或房間放置</span>';
  }
  function roomLink(r) {
    const room = D.rooms[r];
    return room ? `<button class="linkish" data-room="${esc(r)}">${esc(room.short)}</button><span class="hint">（${esc(areaOfRoom[r] || '')}）</span>` : esc(r);
  }
  function subChips(key, groups) {
    const cur = state.sub[key] || 'all';
    return `<div class="chips" role="group" aria-label="分類">` + groups.map(([k, label, n]) =>
      `<button class="chip" data-sub="${esc(k)}" aria-pressed="${cur === k}">${esc(label)}<span class="n">${n}</span></button>`).join('') + '</div>';
  }
  function matches(it, extra) {
    if (!state.q) return true;
    const q = state.q.toLowerCase();
    return (plain(it.name) + ' ' + (it.ids || []).join(' ') + ' ' + (it.file || it.id || '') + ' ' + (extra || '')).toLowerCase().includes(q);
  }
  function listShell(tools, rows, hint) {
    return `<div class="tools"><input class="search" id="q" type="search" placeholder="搜尋名稱、英文代碼、特性或檔案" value="${esc(state.q)}" aria-label="搜尋">${tools || ''}</div>` +
      (hint ? `<p class="hint">${hint}</p>` : '') +
      `<div class="list">${rows.length ? rows.join('') : '<p class="empty">沒有符合的項目。換個關鍵字或分類試試。</p>'}</div>`;
  }
  function row(id, head, body) {
    const open = state.open === id;
    return `<div class="row${open ? ' open' : ''}" data-row="${esc(id)}"><button class="row-head" aria-expanded="${open}">${head}</button>${open ? `<div class="detail">${body()}</div>` : ''}</div>`;
  }

  // ---------------------------------------------------------------- 技能
  const SKILL_STATUS = {
    live: ['實裝', 'ok', '實裝在遊戲中：有 NPC、書籍或裝備用到，玩家拿得到。'],
    written: ['寫完未實裝', 'gold', '技能程式已寫完，但目前沒有 NPC、書籍或裝備把它交給玩家。'],
    name: ['僅有名字', '', '只登記了代碼與名稱，沒有技能程式。'],
  };
  function renderSkills() {
    const cnt = k => D.skills.filter(s => s.status === k).length;
    const groups = [['all', '全部', D.skills.length], ['live', '實裝', cnt('live')], ['written', '寫完未實裝', cnt('written')], ['name', '僅有名字', cnt('name')]];
    const cur = state.sub.skills || 'all';
    const rows = D.skills.filter(s => (cur === 'all' || cur === s.status) && matches({ name: s.name, ids: [s.code], file: s.file }, s.cat))
      .map(s => row(s.code,
        `<span class="nm">${esc(s.name)}<span class="en">${esc(s.code)}</span></span><span class="sum">${esc(s.cat || '')}${s.status !== 'name' ? '・精氣神：' + esc((s.gp || '無').slice(0, 24)) : ''}</span><span class="num"><span class="tag ${SKILL_STATUS[s.status][1]}">${SKILL_STATUS[s.status][0]}</span></span>`,
        () => `<dl class="kv"><dt>英文代碼</dt><dd><code>${esc(s.code)}</code></dd>` +
          `<dt>狀態</dt><dd>${esc(SKILL_STATUS[s.status][0])}：${esc(SKILL_STATUS[s.status][2])}</dd>` +
          (s.users && s.users.length ? `<dt>用到的檔案</dt><dd>${s.users.map(u => `<code>${esc(u)}</code>`).join('、')}${s.users.length >= 6 ? ' 等' : ''}</dd>` : '') +
          (s.cat ? `<dt>分類</dt><dd>${esc(s.cat)}</dd>` : '') +
          (s.desc ? `<dt>說明</dt><dd>${esc(s.desc)}</dd>` : '') +
          (s.status !== 'name' ? `<dt>精氣神</dt><dd>${esc(s.gp || '無')}</dd><dt>屬性</dt><dd>${esc(s.ga || '無')}</dd>` : '') +
          (s.file ? `<dt>檔案</dt><dd>${fileLine(s.file)}</dd>` : '') + `</dl>` +
          (s.detail ? `<div><h4 class="hint" style="margin:0 0 4px">技能細節</h4><pre class="code">${esc(s.detail)}</pre></div>` : '') +
          (s.formula ? `<div><h4 class="hint" style="margin:8px 0 4px">改了共同規則的地方與引擎參數</h4><pre class="code">${esc(s.formula)}</pre></div>` : '') +
          (!s.detail && !s.formula && s.status !== 'name' ? `<p class="hint" style="margin:0">沒有另外調整共同規則，升級見「共同規則」分頁；這項技能的細節尚未整理。</p>` : '') +
          (s.notes.length ? `<div><h4 class="hint" style="margin:8px 0 4px">程式註解（尚未整理）</h4><pre class="code">${esc(s.notes.join('\n\n'))}</pre></div>` : '')));
    return listShell(subChips('skills', groups), rows, '「實裝」是遊戲裡有 NPC、書籍或裝備用到的技能；「寫完未實裝」已有技能程式但還沒交給玩家；「僅有名字」只登記了代碼與名稱。每項技能只列自己的細節與改了共同規則的地方；每項技能都套用的升級、經驗值與戰鬥規則在「共同規則」分頁。');
  }

  // ---------------------------------------------------------------- 共同規則
  function renderRules() {
    const rows = D.rules.filter(r => matches({ name: r.title, ids: [], file: '' }, r.body))
      .map(r => row('rule:' + r.title, `<span class="nm">${esc(r.title)}</span>`, () => `<pre class="code">${esc(r.body)}</pre>`));
    return listShell('', rows, '每項技能都會套用的規則；各技能只在改了這些規則時才另外列出。內容來自 docs/catalog/巫師圖鑑_共同規則.md。');
  }

  // ---------------------------------------------------------------- 武器
  function renderWeapons() {
    const kinds = Object.keys(D.weaponKinds).filter(k => D.weapons.some(w => w.kind === k));
    const groups = [['all', '全部', D.weapons.length]].concat(kinds.map(k => [k, D.weaponKinds[k], D.weapons.filter(w => w.kind === k).length]));
    const cur = state.sub.weapons || 'all';
    const rows = D.weapons.filter(w => (cur === 'all' || w.kind === cur) && matches(w, Object.values(w.traits).flat().map(t => t[0]).join(' ') + ' ' + w.flags.join(' ')))
      .map(w => {
        const u = w.usages[0] || {};
        const sum = w.usages.map(x => `${x.skill} ${x.dmg || ''}`).join('・');
        return row(w.id,
          `<span class="nm">${ansi(w.name)}<span class="en">${esc(w.ids[0] || '')}</span>${flagsHtml(w.flags)}</span><span class="sum">${esc(sum)}${Object.keys(w.traits).length ? '・' + esc(traitText(Object.values(w.traits)[0])) : ''}</span><span class="num">${esc(w.value || '')}</span>`,
          () => weaponDetail(w));
      });
    return listShell(subChips('weapons', groups), rows);
  }
  function weaponDetail(w) {
    const tr = Object.entries(w.traits);
    return (w.long ? `<p class="long">${ansi(w.long)}</p>` : '') +
      `<div class="tbl-wrap"><table><thead><tr><th>可用技能</th><th>傷害</th><th>力量修正</th><th>乘數等級</th></tr></thead><tbody>` +
      w.usages.map(u => `<tr><td>${esc(u.skill)} <code>${esc(u.code)}</code></td><td class="v">${esc(u.dmg || '—')}</td><td class="v">${esc(u.bonus || '—')}</td><td class="v">${esc(u.mult || '—')}</td></tr>`).join('') +
      `</tbody></table></div>` +
      (tr.length ? `<div class="traits">${tr.map(([sk, l]) => `<div class="trait-group"><h4>武器特性・${esc(sk)}</h4><div class="tbl-wrap"><table><tbody>${l.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="v">${v > 0 ? '+' : ''}${v}</td></tr>`).join('')}</tbody></table></div></div>`).join('')}</div>` : '') +
      commonKv(w);
  }
  function commonKv(it) {
    return `<dl class="kv"><dt>英文名稱</dt><dd>${esc((it.ids || []).join('、') || '—')}</dd><dt>重量</dt><dd>${it.weight != null ? it.weight : '—'}</dd><dt>價值</dt><dd>${esc(it.value || '—')}</dd>` +
      (it.poison ? `<dt>劇毒</dt><dd><code>daemon/condition/${esc(it.poison)}.c</code></dd>` : '') +
      (it.verbs ? `<dt>指令</dt><dd>${it.verbs.map(v => `<code>${esc(v)}</code>`).join('、')}</dd>` : '') +
      (it.effects ? `<dt>效果</dt><dd>${esc(it.effects.join('、'))}</dd>` : '') +
      (it.study ? `<dt>研讀</dt><dd>${esc(it.study.map(([k, v]) => `${k} 最高 ${v}`).join('、'))}</dd>` : '') +
      `<dt>出處</dt><dd>${whereHtml(it.id)}</dd><dt>檔案</dt><dd>${fileLine(it.file)}</dd></dl>`;
  }

  // ---------------------------------------------------------------- 防具
  function renderArmors() {
    const slots = Object.keys(D.slots).filter(k => D.armors.some(a => a.slot === k));
    const groups = [['all', '全部', D.armors.length]].concat(slots.map(k => [k, D.slots[k], D.armors.filter(a => a.slot === k).length]));
    const cur = state.sub.armors || 'all';
    const rows = D.armors.filter(a => (cur === 'all' || a.slot === cur) && matches(a, Object.values(a.traits).flat().map(t => t[0]).join(' ') + ' ' + a.flags.join(' ')))
      .map(a => row(a.id,
        `<span class="nm">${ansi(a.name)}<span class="en">${esc(a.ids[0] || '')}</span>${flagsHtml(a.flags)}</span><span class="sum">${esc(D.slots[a.slot] || a.slot)}・${esc(traitText(Object.values(a.traits)[0]) || '沒有特性')}</span><span class="num">${esc(a.value || '')}</span>`,
        () => (a.long ? `<p class="long">${ansi(a.long)}</p>` : '') +
          `<div class="traits">${Object.entries(a.traits).map(([sl, l]) => `<div class="trait-group"><h4>護具特性・${esc(sl)}</h4><div class="tbl-wrap"><table><tbody>${l.map(([k, v]) => `<tr><td>${esc(k)}</td><td class="v">${v > 0 ? '+' : ''}${v}</td></tr>`).join('')}</tbody></table></div></div>`).join('') || '<span class="hint">沒有護具特性</span>'}</div>` +
          commonKv(a)));
    return listShell(subChips('armors', groups), rows);
  }

  // ---------------------------------------------------------------- 物品
  function renderItems() {
    const cats = [...new Set(D.items.map(i => i.cat))];
    const groups = [['all', '全部', D.items.length]].concat(cats.map(k => [k, k, D.items.filter(i => i.cat === k).length]));
    const cur = state.sub.items || 'all';
    const rows = D.items.filter(i => (cur === 'all' || i.cat === cur) && matches(i, (i.effects || []).join(' ')))
      .map(i => row(i.id,
        `<span class="nm">${ansi(i.name)}<span class="en">${esc(i.ids[0] || '')}</span>${flagsHtml(i.flags)}</span><span class="sum">${esc(i.cat)}${i.effects ? '・' + esc(i.effects.join('、')) : ''}</span><span class="num">${esc(i.value || '')}</span>`,
        () => (i.long ? `<p class="long">${ansi(i.long)}</p>` : '') + commonKv(i)));
    return listShell(subChips('items', groups), rows);
  }

  // ---------------------------------------------------------------- NPC
  function npcAreas(n) { return [...new Set(n.rooms.map(([r]) => areaOfRoom[r]).filter(Boolean))]; }
  function renderNpcs() {
    const all = Object.values(D.npcs).sort((a, b) => (npcAreas(a)[0] || '\uffff').localeCompare(npcAreas(b)[0] || '\uffff') || (a.level || 0) - (b.level || 0));
    const keys = D.areas.map(a => a.key).filter(k => all.some(n => npcAreas(n).includes(k)));
    const none = all.filter(n => !npcAreas(n).length).length;
    const groups = [['all', '全部', all.length]].concat(keys.map(k => [k, k, all.filter(n => npcAreas(n).includes(k)).length]), none ? [['none', '未放置', none]] : []);
    const cur = state.sub.npcs || 'all';
    const rows = all.filter(n => (cur === 'all' || (cur === 'none' ? !npcAreas(n).length : npcAreas(n).includes(cur))) &&
        matches(n, [plain(n.title || ''), n.race, n.class, n.skills.map(s => s[0]).join(' ')].join(' ')))
      .map(n => row(n.id,
        `<span class="nm">${n.title ? `<span class="en" style="margin:0 6px 0 0">${ansi(n.title)}</span>` : ''}${ansi(n.name)}<span class="en">${esc((n.ids || [])[0] || '')}</span>${n.wander ? '<span class="tag">走動</span>' : ''}${n.ghost ? '<span class="tag">鬼魂</span>' : ''}</span>` +
        `<span class="sum">${esc(npcAreas(n).join('、') || '未放置')}${n.race || n.class ? '・' + esc([n.race, n.class].filter(Boolean).join('／')) : ''}${n.equip && n.equip.length ? '・裝備 ' + n.equip.length + ' 件' : ''}</span><span class="num">${n.level != null ? 'Lv ' + n.level : ''}</span>`,
        () => npcBody(n)));
    return listShell(subChips('npcs', groups), rows);
  }

  // ---------------------------------------------------------------- 區域
  const CW = 108, CH = 38, GX = 26, GY = 26;
  function renderAreas() {
    const area = D.areas.find(a => a.key === state.area) || D.areas[0];
    if (!area) return '<p class="empty">沒有區域資料。</p>';
    const chips = `<div class="chips" role="group" aria-label="區域">` + D.areas.map(a =>
      `<button class="chip" data-area="${esc(a.key)}" aria-pressed="${a.key === area.key}">${esc(a.name)}<span class="n">${a.rooms.length}</span></button>`).join('') + '</div>';
    const rooms = area.rooms.map(r => D.rooms[r]);
    // 依 z（上下樓層）分層繪製
    const layers = {};
    rooms.forEach(r => { const z = r.pos ? r.pos[2] : 0; (layers[z] = layers[z] || []).push(r); });
    const zs = Object.keys(layers).map(Number).sort((a, b) => b - a);
    const maps = zs.map(z => {
      const rs = layers[z];
      const names = [...new Set(rs.map(r => r.layer).filter(Boolean))];
      const xs = rs.map(r => r.pos[0]), ys = rs.map(r => r.pos[1]);
      const minx = Math.min(...xs), miny = Math.min(...ys);
      const W = (Math.max(...xs) - minx + 1) * (CW + GX) + GX, H = (Math.max(...ys) - miny + 1) * (CH + GY) + GY;
      const px = r => GX + (r.pos[0] - minx) * (CW + GX), py = r => GY + (r.pos[1] - miny) * (CH + GY);
      const inLayer = {};
      rs.forEach(r => inLayer[r.id] = r);
      let lines = '';
      const seen = new Set();
      // 用指令進出的路線畫虛線（例如 climb 圍牆）；只要一個方向要用指令就算
      rs.forEach(r => (r.special || []).forEach(m => {
        const o = inLayer[m.to];
        if (!o) return;
        const k = [r.id, m.to].sort().join('|');
        if (seen.has(k)) return;
        seen.add(k);
        const x1 = px(r) + CW / 2, y1 = py(r) + CH / 2, x2 = px(o) + CW / 2, y2 = py(o) + CH / 2;
        const tip = `<title>${esc(r.short)}：${esc(m.cmd)}</title>`;
        // 直線會穿過中間其他房間時改畫成弧線繞開，免得看起來像連到那一格
        const dxg = o.pos[0] - r.pos[0], dyg = o.pos[1] - r.pos[1], steps = Math.max(Math.abs(dxg), Math.abs(dyg));
        let blocked = false;
        if (steps > 1 && (dxg === 0 || dyg === 0 || Math.abs(dxg) === Math.abs(dyg)))
          for (let i = 1; i < steps; i++) {
            const gx = r.pos[0] + dxg / steps * i, gy = r.pos[1] + dyg / steps * i;
            if (rs.some(q => q.pos[0] === gx && q.pos[1] === gy)) blocked = true;
          }
        if (blocked) {
          const len = Math.hypot(x2 - x1, y2 - y1), off = CW * 1.3;
          const cx = (x1 + x2) / 2 + (-(y2 - y1) / len) * off, cy = (y1 + y2) / 2 + ((x2 - x1) / len) * off;
          lines += `<path class="cmd" d="M${x1} ${y1} Q${cx} ${cy} ${x2} ${y2}">${tip}</path>`;
        } else
          lines += `<line class="cmd" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}">${tip}</line>`;
      }));
      rs.forEach(r => Object.entries(r.exits).forEach(([d, t]) => {
        const o = inLayer[t];
        if (!o) return;
        const k = [r.id, t].sort().join('|');
        if (seen.has(k)) return;
        seen.add(k);
        lines += `<line x1="${px(r) + CW / 2}" y1="${py(r) + CH / 2}" x2="${px(o) + CW / 2}" y2="${py(o) + CH / 2}"/>`;
      }));
      const npcRoom = new Set();
      rs.forEach(r => Object.keys(r.objects).forEach(p => { if (D.npcs[p]) npcRoom.add(r.id); }));
      const cells = rs.map(r => {
        const ud = (r.exits.up ? '↑' : '') + (r.exits.down ? '↓' : '');
        const out = Object.values(r.exits).some(t => areaOfRoom[t] && areaOfRoom[t] !== area.key);
        const label = r.short.length > 7 ? r.short.slice(0, 7) + '…' : r.short;
        const cls = ['room', npcRoom.has(r.id) ? 'has-npc' : '', state.room === r.id ? 'sel' : '', state.hl && state.hl.includes(r.id) ? 'hl' : ''].join(' ');
        return `<g class="${cls}" data-room="${esc(r.id)}" tabindex="0" role="button" aria-label="${esc(r.short)}"><title>${esc(r.short)}</title><rect x="${px(r)}" y="${py(r)}" width="${CW}" height="${CH}"/>` +
          `<text x="${px(r) + CW / 2}" y="${py(r) + CH / 2 + 4}" text-anchor="middle">${esc(label)}</text>` +
          (npcRoom.has(r.id) ? `<circle class="dot" cx="${px(r) + 8}" cy="${py(r) + 8}" r="3"/>` : '') +
          (ud || out ? `<text class="ud" x="${px(r) + CW - 6}" y="${py(r) + 12}" text-anchor="end">${ud}${out ? '⇢' : ''}</text>` : '') + '</g>';
      }).join('');
      const title = zs.length > 1 || names.length ? `<div class="layer-title">${names.length ? esc(names.join('／')) : ''}${zs.length > 1 ? `（樓層 ${z >= 0 ? '+' : ''}${z}）` : ''}</div>` : '';
      return `${title}<div class="map-scroll"><svg class="map" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(area.name)} 地圖">${lines}${cells}</svg></div>`;
    }).join('');
    const legend = `<div class="map-legend"><span>● 有 NPC</span><span>↑↓ 上下樓</span><span>┅ 用指令進出（例如 climb 圍牆）</span><span>⇢ 通往其他區域</span><span>點房間看內容</span></div>`;
    const room = state.room && D.rooms[state.room] && areaOfRoom[state.room] === area.key ? D.rooms[state.room] : null;
    const roomPanel = room ? `<div class="panel"><h3>${esc(room.short)}</h3>` +
      (room.long ? `<p class="long" style="font-size:0.92rem">${ansi(room.long)}</p>` : '') +
      `<dl class="kv"><dt>出口</dt><dd>${Object.entries(room.exits).map(([d, t]) => `${esc(d)}：${roomLink(t)}`).join('<br>') || '—'}</dd>` +
      ((room.special || []).length ? `<dt>指令進出</dt><dd>${room.special.map(m => `<code>${esc(m.cmd)}</code>：${roomLink(m.to)}`).join('<br>')}</dd>` : '') +
      `<dt>NPC</dt><dd>${Object.entries(room.objects).filter(([p]) => D.npcs[p]).map(([p, n]) => `<button class="linkish" data-npc="${esc(p)}">${ansi(D.npcs[p].name)}</button>${n > 1 ? ' ×' + n : ''}`).join('、') || '—'}</dd>` +
      `<dt>物品</dt><dd>${Object.entries(room.objects).filter(([p]) => !D.npcs[p]).map(([p, n]) => (byId[p] ? `<button class="linkish" data-item="${esc(p)}">${ansi(byId[p].it.name)}</button>` : `<code>${esc(p)}</code>`) + (n > 1 ? ' ×' + n : '')).join('、') || '—'}</dd>` +
      `<dt>檔案</dt><dd>${fileLine(room.file)}</dd></dl></div>`
      : `<div class="panel"><h3>房間</h3><p class="hint" style="margin:0">點地圖上的房間，這裡會顯示敘述、出口、NPC 與物品。</p></div>`;
    const npcs = area.npcs.map(p => D.npcs[p]);
    const npcPanel = `<div class="panel"><h3>NPC</h3>${npcs.length ? `<div class="npc-list">${npcs.map(n => `<button class="chip" data-npc="${esc(n.id)}">${ansi(n.name)}</button>`).join('')}</div>` : '<p class="hint" style="margin:0">這個區域的房間沒有固定放置 NPC。</p>'}</div>`;
    const stats = `<div class="stats"><span>房間 ${area.rooms.length} 格</span><span>NPC ${area.npcs.length} 種</span><span>NPC 以出生房間標示；會走動的 NPC 標有「走動」</span></div>`;
    return `<div class="tools">${chips}</div>${stats}<div class="area-grid" style="margin-top:12px"><div class="map-box">${maps}${legend}</div><div class="side">${roomPanel}${npcPanel}</div></div>`;
  }

  // ---------------------------------------------------------------- NPC 視窗
  function openNpc(id) {
    const n = D.npcs[id];
    if (!n) return;
    const tags = [n.wander ? '走動' : '', n.ghost ? '鬼魂' : ''].filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('');
    const o = $('#overlay');
    o.innerHTML = `<div class="dialog" role="dialog" aria-modal="true" aria-label="${esc(plain(n.name))}">` +
      `<div class="dlg-head"><h2>${ansi(n.name)}${tags}</h2><button class="copy close" data-close>關閉</button></div><span class="hint">${esc((n.ids || []).join('、'))}</span>` +
      npcBody(n) + `</div>`;
    o.hidden = false;
    const b = o.querySelector('[data-close]');
    if (b) b.focus();
  }
  function npcBody(n) {
    const eq = (n.equip || []).map(e => {
      const x = byId[e.path];
      return `<tr><td>${x ? `<button class="linkish" data-item="${esc(e.path)}">${ansi(x.it.name)}</button>` : `<code>${esc(e.path)}</code>`}</td><td>${e.use === 'wield' ? '裝備武器' : e.use === 'wear' ? '穿戴' : '攜帶'}</td></tr>`;
    }).join('');
    const rooms = n.rooms.length ? n.rooms.map(([r, c]) => roomLink(r) + (c > 1 ? ` ×${c}` : '')).join('、') : '<span class="hint">沒有房間固定放置（由劇情或其他程式產生）</span>';
    return (n.long ? `<p class="long">${ansi(n.long)}</p>` : '') +
      `<dl class="kv">${n.title ? `<dt>稱號</dt><dd>${ansi(n.title)}</dd>` : ''}<dt>種族／職業</dt><dd>${esc([n.race, n.class].filter(Boolean).join('／') || '—')}</dd><dt>等級</dt><dd>${n.level != null ? n.level : '—'}</dd><dt>所在格子</dt><dd>${rooms}</dd><dt>檔案</dt><dd>${fileLine(n.file)}</dd></dl>` +
      `<div><h4 class="hint" style="margin:0 0 4px">裝備</h4>${eq ? `<div class="tbl-wrap"><table><tbody>${eq}</tbody></table></div>` : '<span class="hint">沒有裝備</span>'}</div>` +
      (n.skills.length ? `<div><h4 class="hint" style="margin:0 0 4px">技能</h4><div class="tbl-wrap"><table><tbody>${n.skills.map(([k, v, c]) => `<tr><td>${esc(k)} <code>${esc(c)}</code></td><td class="v">${v}</td></tr>`).join('')}</tbody></table></div></div>` : '');
  }
  function closeNpc() { $('#overlay').hidden = true; $('#overlay').innerHTML = ''; }
  $('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay' || e.target.closest('[data-close]')) closeNpc(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#overlay').hidden) closeNpc(); });

  // ---------------------------------------------------------------- 事件
  function render() {
    const f = { skills: renderSkills, rules: renderRules, weapons: renderWeapons, armors: renderArmors, items: renderItems, npcs: renderNpcs, areas: renderAreas }[state.tab];
    const hadFocus = document.activeElement && document.activeElement.id === 'q';
    const pos = hadFocus ? document.activeElement.selectionStart : 0;
    $('#main').innerHTML = f();
    if (hadFocus && $('#q')) { $('#q').focus(); $('#q').setSelectionRange(pos, pos); }
  }
  // 注音等輸入法組字時不重繪，否則組字中的注音符號會被當成已輸入的字；組字完成再搜尋。
  function onSearch(e) { if (e.target.id !== 'q' || e.isComposing) return; state.q = e.target.value; state.open = null; render(); }
  document.addEventListener('input', onSearch);
  document.addEventListener('compositionend', onSearch);
  document.addEventListener('click', e => {
    const t = e.target;
    const copy = t.closest('[data-copy]');
    if (copy) {
      const txt = copy.dataset.copy;
      const done = () => { copy.textContent = '已複製'; setTimeout(() => copy.textContent = '複製', 1200); };
      try { navigator.clipboard.writeText(txt).then(done, () => {}); } catch (err) {}
      return;
    }
    const npc = t.closest('[data-npc]');
    if (npc) { openNpc(npc.dataset.npc); return; }
    const item = t.closest('[data-item]');
    if (item && byId[item.dataset.item]) {
      closeNpc();
      const x = byId[item.dataset.item];
      const sub = x.tab === 'weapons' ? { weapons: 'all' } : x.tab === 'armors' ? { armors: 'all' } : { items: 'all' };
      go(x.tab, { open: x.it.id, sub: Object.assign(state.sub, sub) });
      return;
    }
    const room = t.closest('[data-room]');
    if (room) {
      const rid = room.dataset.room;
      closeNpc();
      if (areaOfRoom[rid]) {
        state.area = areaOfRoom[rid]; state.room = rid; state.hl = null;
        if (state.tab !== 'areas') go('areas', { area: state.area, room: rid }); else render();
      }
      return;
    }
    const sub = t.closest('[data-sub]');
    if (sub) { state.sub[state.tab] = sub.dataset.sub; state.open = null; render(); return; }
    const area = t.closest('[data-area]');
    if (area) { state.area = area.dataset.area; state.room = null; state.hl = null; render(); return; }
    const head = t.closest('.row-head');
    if (head) {
      const id = head.parentElement.dataset.row;
      state.open = state.open === id ? null : id;
      render();
      const el = document.querySelector(`[data-row="${CSS.escape(id)}"] .row-head`);
      if (el) el.focus({ preventScroll: true });
    }
  });
  document.addEventListener('keydown', e => {
    const g = e.target.closest && e.target.closest('g[data-room]');
    if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); g.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });

  // 搜尋列固定在頁首下方：依頁首實際高度設定位置
  const hdr = document.querySelector('header.top');
  const setHdr = () => document.documentElement.style.setProperty('--hdr', hdr.offsetHeight + 'px');
  setHdr();
  if (window.ResizeObserver) new ResizeObserver(setHdr).observe(hdr); else window.addEventListener('resize', setHdr);

  drawTabs();
  render();
})();
</script>
