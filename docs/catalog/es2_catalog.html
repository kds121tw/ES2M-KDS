<style>
/* 版面：頂部名稱與分頁固定，下方為可搜尋的清單；區域分頁左為地圖、右為房間與 NPC。
   色彩取自青瓷與朱砂印泥：青瓷綠為主色，朱砂只用在唯一、劇毒這類警示標記。 */
:root {
  --bg: #edf1ee;
  --panel: #f8faf8;
  --sunk: #e3e9e5;
  --fg: #1b2420;
  --muted: #5b6a63;
  --line: #cdd7d1;
  --accent: #2c6a58;
  --accent-soft: #d5e6de;
  --seal: #a3372a;
  --seal-soft: #f3dcd7;
  --gold: #7d6310;
  --room: #ffffff;
  --room-line: #9fb3a9;
  --c-black: #6b7470; --c-red: #b3261e; --c-green: #1f7a3d; --c-yellow: #8a6a00;
  --c-blue: #1f4fb3; --c-magenta: #8e2f8e; --c-cyan: #0b7385; --c-white: #4f5b66;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111614; --panel: #171e1b; --sunk: #0d1210; --fg: #e1e8e4; --muted: #92a39a; --line: #2a3530;
    --accent: #72c2a6; --accent-soft: #1d3530; --seal: #e57866; --seal-soft: #3a1f1b; --gold: #d8b64f;
    --room: #1d2622; --room-line: #3d4f47;
    --c-black: #8d9894; --c-red: #ff7b72; --c-green: #6fd08c; --c-yellow: #e8c547;
    --c-blue: #7aa7ff; --c-magenta: #e08ae0; --c-cyan: #5fd3e0; --c-white: #f2f5f4;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111614; --panel: #171e1b; --sunk: #0d1210; --fg: #e1e8e4; --muted: #92a39a; --line: #2a3530;
  --accent: #72c2a6; --accent-soft: #1d3530; --seal: #e57866; --seal-soft: #3a1f1b; --gold: #d8b64f;
  --room: #1d2622; --room-line: #3d4f47;
  --c-black: #8d9894; --c-red: #ff7b72; --c-green: #6fd08c; --c-yellow: #e8c547;
  --c-blue: #7aa7ff; --c-magenta: #e08ae0; --c-cyan: #5fd3e0; --c-white: #f2f5f4;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 0 48px; }
header.top .wrap { padding-block: 0; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding-block: 14px 8px; }
.brand h1 { margin: 0; font-family: var(--serif); font-size: 1.55rem; letter-spacing: 0.08em; }
.brand .tally { color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { flex: 0 0 auto; border: 0; background: none; color: var(--muted); font: 500 0.98rem var(--sans); padding: 8px 14px; border-bottom: 2px solid transparent; cursor: pointer; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
nav.tabs button:focus-visible, .chip:focus-visible, .row-head:focus-visible, .linkish:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding-block: 16px 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr, 100px)); z-index: 15; background: var(--bg); border-bottom: 1px solid var(--line); }
.search { flex: 1 1 260px; min-width: 0; font: 0.95rem var(--sans); padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); }
.search:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 999px; padding: 3px 12px; font: 0.88rem var(--sans); cursor: pointer; }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 4px; font-size: 0.8rem; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.chip[aria-pressed="true"] .n { color: var(--panel); opacity: 0.8; }
.hint { color: var(--muted); font-size: 0.85rem; }
.list { }
.row { border-bottom: 1px solid var(--line); }
.row-head { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.6fr) 7.5em; gap: 4px 16px; align-items: baseline; padding: 9px 4px; cursor: pointer; width: 100%; text-align: left; border: 0; background: none; color: inherit; font: inherit; }
.row-head:hover { background: var(--sunk); }
.row.open > .row-head { background: var(--accent-soft); }
.nm { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.nm .en { font-weight: 400; color: var(--muted); font-size: 0.82rem; margin-left: 6px; }
.sum { color: var(--muted); font-size: 0.88rem; min-width: 0; overflow-wrap: anywhere; }
.num { text-align: right; font-variant-numeric: tabular-nums; font-size: 0.88rem; color: var(--muted); }
.tag { display: inline-block; font-size: 0.72rem; letter-spacing: 0.04em; padding: 0 6px; border-radius: 3px; margin-left: 6px; vertical-align: 2px; border: 1px solid var(--line); color: var(--muted); font-weight: 500; }
.tag.seal { border-color: var(--seal); color: var(--seal); background: var(--seal-soft); }
.tag.gold { border-color: var(--gold); color: var(--gold); }
.tag.ok { border-color: var(--accent); color: var(--accent); }
.detail { padding: 4px 4px 18px; display: grid; gap: 14px; }
.detail .long { white-space: pre-wrap; font-family: var(--serif); line-height: 1.8; max-width: 44em; margin: 0; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; font-size: 0.9rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; font-size: 0.88rem; min-width: 18em; }
th, td { text-align: left; padding: 4px 14px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; }
td.v { font-variant-numeric: tabular-nums; text-align: right; padding-right: 20px; }
.traits { display: flex; flex-wrap: wrap; gap: 6px 18px; }
.trait-group h4 { margin: 0 0 4px; font: 500 0.82rem var(--sans); color: var(--muted); letter-spacing: 0.05em; }
code, .file { font-family: var(--mono); font-size: 0.82rem; }
.file { color: var(--muted); overflow-wrap: anywhere; }
pre.code { font-family: var(--mono); font-size: 0.8rem; background: var(--sunk); padding: 10px 12px; border-radius: 6px; overflow-x: auto; margin: 0; white-space: pre; }
.linkish { color: var(--accent); background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.copy { font: 0.75rem var(--sans); border: 1px solid var(--line); background: var(--panel); color: var(--muted); border-radius: 4px; padding: 0 6px; margin-left: 8px; cursor: pointer; }
.empty { color: var(--muted); padding: 24px 4px; }
/* 區域 */
.area-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.map-box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; min-width: 0; }
.map-scroll { overflow: auto; max-height: 70vh; }
.map-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--muted); font-size: 0.8rem; padding: 6px 2px 0; }
.layer-title { font: 600 0.9rem var(--serif); color: var(--muted); margin: 6px 2px 2px; }
svg.map text { font-family: var(--sans); font-size: 12px; fill: var(--fg); pointer-events: none; }
svg.map .room rect { fill: var(--room); stroke: var(--room-line); stroke-width: 1; rx: 5; }
svg.map .room.has-npc rect { stroke: var(--accent); stroke-width: 1.6; }
svg.map .room.sel rect { fill: var(--accent); stroke: var(--accent); }
svg.map .room.sel text { fill: var(--panel); }
svg.map .room.hl rect { stroke: var(--seal); stroke-width: 2.4; }
svg.map .room { cursor: pointer; }
svg.map .room:focus-visible rect { stroke: var(--seal); stroke-width: 2.4; }
svg.map line { stroke: var(--room-line); stroke-width: 2; }
svg.map .cmd { stroke: var(--accent); stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
svg.map .dot { fill: var(--accent); }
svg.map .ud { font-size: 10px; fill: var(--muted); }
.side { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; min-width: 0; }
.panel h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 1.1rem; }
.npc-list { display: flex; flex-wrap: wrap; gap: 6px; }
.npc-list .chip { font-size: 0.85rem; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 18px; color: var(--muted); font-size: 0.88rem; font-variant-numeric: tabular-nums; }
/* NPC 視窗 */
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 13, 0.45); z-index: 50; display: grid; place-items: center; padding: 16px; }
.dialog { background: var(--panel); color: var(--fg); border-radius: 10px; border: 1px solid var(--line); width: min(640px, 100%); max-height: 88vh; overflow: auto; padding: 18px 20px 20px; display: grid; gap: 12px; }
.dialog h2 { margin: 0; font-family: var(--serif); font-size: 1.35rem; }
.dlg-head { display: flex; align-items: flex-start; gap: 12px; }
.dlg-head h2 { flex: 1 1 auto; min-width: 0; }
.dialog .close { flex: none; margin: 0; min-width: 4.5em; min-height: 32px; padding: 4px 12px; font-size: 0.85rem; line-height: 1.2; }
/* 遊戲裡的 ANSI 顏色 */
.a1 { font-weight: 700; }
.a30 { color: var(--c-black); } .a31 { color: var(--c-red); } .a32 { color: var(--c-green); } .a33 { color: var(--c-yellow); }
.a34 { color: var(--c-blue); } .a35 { color: var(--c-magenta); } .a36 { color: var(--c-cyan); } .a37 { color: var(--c-white); }
@media (max-width: 760px) {
  .area-grid { grid-template-columns: minmax(0, 1fr); }
  .row-head { grid-template-columns: minmax(0, 1fr) auto; }
  .row-head .sum { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: no-preference) { .row-head { transition: background 0.12s; } }
</style>

 force／recover／remedy／windarmor。\n學習條件：玄衣派弟子、人物等級 20。累積門檻學成 25 級。\n升級獎勵（練成後每升一級）：精、氣、神上限 +1／+1／+3；130 級：慧根 +2，精、氣、神上限各 +30～45（各自擲骰，只給一次）。\n修習：每回合消耗精 2、氣 2、神 3（受傷減少上限 精 1、氣 1、神 2）；明道心法得 智力公式 + random(慧根) 點，另得基本內功打坐點數。\nrecover（30 級起）：疲勞達 80 就不能用；疲勞 +3；精、氣、神受損的上限各回復 等級 ÷ 6 ～ 等級 ÷ 2（各自擲骰）；停頓 2 回合。\nremedy（60 級起）：消耗飲水 50（不足時扣到 0，照樣有效）；精、氣、神目前值各回復 等級 ÷ 3 ～ 等級 ÷ 2（各自擲骰）；停頓 1 回合。\nwindarmor（明道心法 90 級且風符 90 級）：消耗神 等級 ÷ 2；效果中不能再施展，戰鬥中可用。\n  守勢等級 + 等級 ÷ 2、護甲 + 等級 ÷ 3、慧根 + (等級 ÷ 50 + 1)、冰火雷風傷害防禦力各 + 等級；持續 等級 個 tick（一回合兩秒）。"},{"code":"dragon force","name":"龍圖心經","impl":true,"status":"live","users":["d/snow/npc/alchemist.c"],"cat":"","desc":"龍圖心經（dragon force）。龍圖丹派的內功，安裝在 force （enable force with dragon force）。exert dragon force 打坐修練； 練成後可用錢莊存款轉化丹藥（exert lavage／relax／refresh／mana／heal／ minor heal／major heal）。","formula":"【調整共同規則】\n  學成等級：70 級（0 級累積到門檻後直接學成到 70 級）\n  學成所需累積點數：612,500（70² × 125 基數）\n【升級獎勵】武術造詣 level * 10；武學之道 (level - 29) * 10","gp":"練成後每升一級：神 +1、氣 +1；120 級起每級再加氣 +4、精 +5。","ga":"練成時慧根 +1；練到 100 級時膂力 +2、慧根 +1。","growth":["氣 +1","氣 +4","神 +1","精 +5"],"notes":[],"file":"source/upstream/mudlib/d/snow/skill/dragon_force.c","detail":"龍圖心經（龍圖丹派內功）。enable 在內功上，指令 exert dragon force 打坐；練成後可用錢莊存款轉化丹藥。\n1～69 級不存在，累積到門檻後直接練成 70 級（門檻不打折）；練成時慧根 +1（只給一次）。\n升級獎勵：每升一級神 +1、氣 +1；120 級起每級再加氣 +4、精 +5；100 級：膂力 +2、慧根 +1（只給一次）。\n修習：龍圖心經得 智力公式 + random(靈性) 點，另得基本內功打坐點數。\n轉化丹藥（花費倍數十分之一，從錢莊存款扣）：每次扣目前的精／氣／神 5 或疲勞 +3；160 級起可轉化大還丹。丹藥所需神農之術等級讀丹藥檔的 requirement。"},{"code":"eight_steps","name":"火雲奇門步法","impl":true,"status":"live","users":["d/wutang/npc/guo_boo.c"],"cat":"","desc":"火雲奇門步法。朱衣派閃躲步法，八式對應奇門八門，身法如火雲飄捲；閃避機率照 ES2 原本公式，沒有特技。 設計見 docs/martial_arts/道士_清河映星劍與奇門步法.md。","formula":"【調整共同規則】\n  學成等級：10 級（0 級累積到門檻後直接學成到 10 級）\n  學成所需累積點數：10,000（10² × 100 基數）\n【升級獎勵】武術造詣 lv * 10；武學之道 (lv - 40) * 10","gp":"無","ga":"無","growth":[],"notes":[],"file":"source/upstream/mudlib/daemon/skill/eight_steps.c","detail":"火雲奇門步法（朱衣派閃躲身法，八式對應奇門八門）。學習條件：朱衣派弟子。累積門檻學成 10 級。\n每級獎勵（學成那一級起）：武術造詣 等級 × 10；41 級起武學之道 (等級 − kness）。幻霧觀專長咒術，enable 在咒術（spells）上，以 cast 施展； 每次施展消耗一張少陰符，不另外消耗精、氣、神。 ghost_fire 鬼火術、smoke 鬼煙術、hell_fire 幽冥之火。 設計見 docs/martial_arts/幻霧觀_茅山奇術與奇門術.md。","formula":"【調整共同規則】\n  學成等級：20 級（0 級累積到門檻後直接學成到 20 級）\n  學成所需累積點數：30,000（技能檔指定）\n【升級獎勵】戰鬥 gain；法術 (wis >= 6 ? random(wis / 6) : 0) + 1","gp":"無","ga":"無","growth":[],"notes":[],"file":"source/upstream/mudlib/daemon/skill/taoism_of_darkness.c","detail":"茅山奇術（幻霧觀）。enable 在咒術上，指令 cast <咒文>。\n學習條件：幻霧觀弟子（只收阿修羅、巫首、雨師妾、無腸、夜叉）。累積 30,000 點學成 20 級。\n每次施展消耗一張少陰符，不另外消耗精、氣、神。\n命中：50 + 咒文技巧 × 2 %，限 5～95%；沒有陰火抗性，不看對方抗性，也不吃裝備的元素加成。\n咒文強度借用天師的公式（見共同規則）。\n\n咒文：\n  1 鬼火術　　習得 0 級　停頓 1　重數 1　傷害 = D × 33%（打氣）\n  2 鬼煙術　　習得 30 級　停頓 1　重數 2　脫離戰鬥並隱藏；隱藏值 = 1 + random((潛行 + 茅山奇術) ÷ 2 × 2)；\n                                         對手警覺性高於隱藏值就看得穿，看得穿的只停手一次；沒在交手時不能施展\n  3 幽冥之火　習得 50 級　停頓 1　重數 3　傷害 = D + (random(慧根) + 1) × 2（打氣）\n技能點數用咒術共用規則（基本咒術、茅山奇術各一次）。"},{"code":"taoism of nature","name":"茅山幻術","impl":true,"status":"live","users":["custom/legacy_npc/ou_yan_wu_ji_2.c","custom/armor/cloth/cloudy_silk_cloth.c","custom/armor/waist/red_belt.c","custom/weapon/sword/red_of_sword.c"],"cat":"咒術","desc":"茅山幻術（taoism of nature）。隱風觀專長咒術，enable 在咒術（spells）上，以 cast 施展； 每次施展消耗一張先天符。dog 喚犬、monkey 喚猿、hydra 喚蟒、rain 祈天。 設計見 docs/martial_arts/隱風觀_茅山幻術與遁甲書.md。","formula":"【調整共同規則】\n  學成等級：20 級（0 級累積到門檻後直接學成到 20 級）\n  學成所需累積點數：40,000（20² × 100 基數）\n【升級獎勵】法術 (wis >= 6 ? random(wis / 6) : 0) + 1","gp":"無","ga":"無","growth":[],"notes":[],"file":"source/upstream/mudlib/daemon/skill/taoism_of_nature.c","detail":"茅山幻術（隱風觀）。enable 在咒術上，指令 cast <咒文>。\n學習條件：隱風觀弟子。練成 20 級。每次施展消耗先天符與神。\n\n咒文（耗神；停頓；重數）：\n  dog 喚犬之術　　習得 0 級　耗神 10　停頓 2　重數 1　召喚犬隻；強度 = 等級 ÷ 30 + 1（最高 10）、數量 = 等級 ÷ 90 + 1；重複召喚是收回舊的換新的\n  monkey 喚猿之術　習得 35 級　耗神 20　停頓 1　重數 2　75% 機率讓對手停頓 2 回合（只有敘述，不召喚 NPC）\n  hydra 喚蟒之術　習得 55 級　耗神 50　停頓 3　重數 3　只能對正在跟自己戰鬥的 NPC；random(等級 ÷ 3) > 對手等級 就吞下；\n                              random(等級 ÷ 10) > 10 時吐出被吞者身上的一件物品\n  rain 祈天之術　　習得 90 級　耗神 60　停頓 1　重數 4　同房間其他玩家（不含自己與 NPC）的精、氣、神目前值與受損上限， ","users":[],"gp":"","ga":"","cat":"咒術","desc":"","formula":"尚未實作（目前只有代碼與名稱）。","growth":[],"notes":[],"file":"","detail":""},{"code":"mao-shan steps","name":"茅山步法","impl":false,"status":"name","users":[],"gp":"","ga":"","cat":"步法","desc":"","formula":"尚未實作（目前只有代碼與名稱）。","growth":[],"notes":[],"file":"","detail":""},{"code":"chivi sutra","name":"天師道法【紫薇心經】","impl":false,"status":"name","users":[],"gp":"","ga":"","cat":"法術","desc":"","formula":"尚未實作（目前只有代碼與名稱）。","growth":[],"notes":[],"file":"","detail":""},{"code":"mao-shan lightning","name":"茅山【五雷術】","impl":false,"status":"name","users":[],"gp":"","ga":"","cat":"法術","desc":"","formula":"尚未實作（目前只有代碼與名稱）。","growth":[],"notes":[],"file":"","detail":""},{"code":"taoism of conviction","name":"天師道法【桃山密籙】","impl":false,"status":"name","users":[],"gp":"","ga":"","cat":"法術","desc":"","formula":"尚未實作（目前只有代碼與名稱）。","growth":[],"notes":[],"file":"","detail":""},{"code":"taoism-cloud","name":"天師道法【素雲書】","impl":false,"status":"name","users":[],"gp":"","ga":"","cat":"法術","desc":"","formula":"尚未實作（目前只有代碼與名稱）。","growth":[],"notes":[],"file":"","detail":""}],"rules":[{"title":"升級規則（所有技能）","body":"● 拿到的點數先累積，下 gain 時才判定升級，一次最多升一級。\n● 升到某一級所需累積點數 = 等級² × 基數\n● 基數：\n1–60 級 100\n61–90 級 125\n91–120 級 150\n121–160 級 175\n161–180 級 200\n181-200 級 250\n\n程式：`feature/char/skill.c` 的 `restored_skill_threshold()`。"},{"title":"點數與等級（所有技能）","body":"● 取得點數：每次得到的點數 × (1 + random(人物等級 ÷ 8))。\n● 玩家要下 gain 才升級；NPC 不會下 gain，拿到點數就照同一套門檻升級。\n● 還沒學成（0 級）的技能累積到「學成等級」的門檻時，gain 後直接學成到那一級；沒指定的學成等級是 1。\n● 等級上限 200。每個玩家的每項技能還有「個人上限」：得到技能的當下，從 140、145、……、200 擇一（機率平均），\n  之後不再改變；舊角色已經練過頭的技能，上限設成目前等級。NPC 上限 200。\n● 技能檔可以改共同規則的四個地方（各技能細節只列有改的）：\n  學成等級（query_entry_level）、學成所需累積點數（query_entry_threshold）、\n  門檻打折的百分比（query_threshold_percent）、等級上限（query_skill_cap，與個人上限取較低的）。\n● 放棄（abandon）的技能不再累積點數。\n● 有效等級：沒有對應其他技能時就是技能等級；對應（enable）了其他技能時是（原技能 + 對應技能）÷ 2；\n  再加臨時加成（裝備等 apply/技能），最高 200。"},{"title":"升級時自動給的獎勵（只對玩家）","body":"● 基本兵器技能升級給武術造詣：徒手、閃躲、招架、刀、劍、斧、槍、杖、錘、匕首、針、鞭，\n  含雙手、副手各版本。每升到第 sk 級給 sk × 10 點武術造詣；一次升多級時每一級都給。\n● 法術道行：能 enable 在法術（magic）上的技能，每升到第 n 級給 n × 10 點法術道行（基本法術本身不算）。\n● 咒術道行：基本咒術（spells）與能 enable 在咒術上的技能（天師道法四系、茅山奇術、茅山幻術等），\n  每升到第 sk 級給 sk × 30 點咒術道行；一次升多級時每一級都給。\n● 新版武功引擎（std/martial_art.c）的武功：每升一級給武術造詣 lv × ma_coef；\n  lv ≥ mm_start 時另給武學之道 (lv − mm_minus) × mm_coef。學成等級大於 1 的武功，\n  學成那一級本身不給（art_entry_reward = 1 才給），之後每級給。各武功的 ma_coef、mm_start 等數字列在各技能裡。"},{"title":"屬性成長（對應表內的技能）","body":"對應表（`feature/char/skill.c` 的 ATTR_GROWTH）：\n徒手→膂力、內功→根骨、閃躲→機敏、招架→定力、潛行→機敏、咒術→靈性、法術→靈性、\n偷襲暗算→膽識、殺手本能→膽識、讀書識字→悟性、古文造詣→悟性、善想禪要→慧根。\n\n● 技能等級每到 5 的倍數擲一次，成功則該屬性（裸值，不含裝備）+1，上限 50。\n● 機率 = 基礎機率 × (100 + 技能等級) ÷ 200 × 1.2\n● 基礎機率（看屬性目前的裸值）：\n1–10 100%\n11–15 90%\n16–20 80%\n21–25 60%\n26–30 40%\n31–40 30%\n41–45 15%\n46–49 10%\n● 每個門檻一生只擲一次（記在 attr_growth/<技能>），已經練過的等級不補擲。善想禪要 100 級改為固定慧根 +3。"},{"title":"經驗值（點數）的來源通則","body":"預設公式（沒有另外設定的技能都用這條）：\n  智力公式 = (random(智力) + 1) × (random(智力) + 1) + random(智力)\n  程式：`COMBAT_D->int_formula_exp()`。\n\n攻擊命中時（`adm/daemons/combatd.c` 的 restored_hit_gain）：\n● 基本兵器技能：自己的智力公式一次。\n● 新版武功：基本技能與武功本身各擲一次智力公式；瘋虎刀法本身另加 random(膽識)。\n● 徒手且沒有用武功：(random(膂力)+1) × (random(膂力)+1) + random(膂力)。\n● 空手打中、且內功設定成特殊內功：基本內功另得 (random(膂力) × random(定力) + random(膂力)) × max(1, 智力 ÷ 7)。\n● 非基本攻擊技能（用 enable 的武功）造成傷害，每次 1 點武術造詣。\n\n防守成功時：\n● d = 對手等級 − 自己等級，限制在 2～10。\n● 閃躲：基本閃躲與身法各擲一次 (random(機敏)+1) × (random(d)+1) × max(1, 智力 ÷ 7)。\n● 招架（格擋成功，含保底、完全擋下）：基本招架 (random(定力)+1) × (random(d)+1) × max(1, 智力 ÷ 7)；\n  學過強力格擋再得該點數的 (定力 × 1.5 ～ 100)%，定力 67 以上固定 100%。\n  enable 在招架上的武功不從格擋拿點數，武功檔有 parry_gains_exp() 傳回 1 才給。\n● 招架不及：點數取 1/4（至少 1）、不給實戰經驗。\n● 閃躲或格擋成功時另得實戰經驗：對手是玩家 random(2)；對手等級不高於自己 1 點；高 n 級（n 最多 10）1 + random(n)。\n\n內功打坐每次心跳（`restored_force_tick_exp`）：基本內功得 random(根骨) + random(定力) × max(1, 智力 ÷ 7)；\n內功本身再加各自的公式（見各內功）。"},{"title":"戰鬥公式（基本）","body":"完整說明見 `docs/martial_arts/戰鬥流程說明.md`，下列是摘要：\n\n● 攻勢等級 = 膽識 × 膂力 ÷ 10 + 目前的氣 ÷ 32 + 裝備加成；守勢等級 = 定力 × 慧根 ÷ 10 + 目前的氣 ÷ 16 + 裝備加成。\n  多個敵人時出手機率 = 50 + (我的攻勢 − 對方守勢) × 2，限制在 20%～80%。\n● 技巧（決定能不能打中）= 攻擊能力 + 攻擊技能有效等級 + 招式命中值 − random(對方對同一技能的等級) − 對方上一招的防守值；\n  攻擊能力 = 機敏 × 膽識 ÷ 10 + 目前的精 ÷ 32 + 裝備加成。\n● 力道（決定威力）= 膂力 × 膽識 × 150 + 目前的氣 × 30 + 內功加成；\n  內功加成 = 內功等級 × 目前的氣 × (出手功力 + 招式內力值) ÷ 25。\n● 閃躲值 = 防禦能力 + 閃躲技能有效等級；防禦能力 = 機敏 × 定力 ÷ 10 + 目前的精 ÷ 32 + 裝備加成。\n  命中率 = 50 + (攻擊技巧 − 閃躲值) × 2，限制在 5%～95%。\n● 招架：格擋力道上限 = (膂力 × 定力 × 150 + 目前的氣 × 30 + 自己的內功加成) × (100 + 招架等級)%；\n  學過強力格擋，對方有內功 ×5、沒有 ×2。力道不足時仍有 5% + 招架等級 ÷ 4 %（最多 50%）的保底格擋。\n● 傷害：空手 = 1 + 力道 ÷ 10,000 + random(力道 ÷ 10,000) + 裝備傷害加成；\n  拿武器 = 武器倍數 × (1 + random(武器範圍)) + 武器固定值 + 力道加成 + 裝備傷害加成；\n  再套招式傷害加成與招架減傷，最後扣防具（空手整個扣、武器扣 random(防具值)）。\n● 重擊術發動機率 = 10% + 重擊術等級 ÷ 5。"},{"title":"咒術共用規則（天師道法四系；茅山奇術借用強度與命中）","body":"程式：`daemon/skill/taoism-spells.c`，火術、冰咒、風符、雷法四系都繼承它；各系的咒文表在各技能裡。\n\n● 咒文強度 D = (慧根² ÷ 10 + 施咒當時的神 ÷ 32 + random(慧根)) × 咒術倍數\n  咒術倍數：基本咒術（spells）未滿 100 級為 100%，100 級起為 (50 + 咒術等級)%。\n● 咒文技巧 = 咒術有效等級 + 咒文能力\n● 命中率 = 50 + (咒文技巧 − 對方抗性) × 2，限制在 5%～95%（四系相同）。\n  無視抗性的咒文，命中不扣抗性。\n● 傷害 = 咒文強度 × 該咒文百分比 + 裝備的元素傷害力（apply/damage_vs_元素） − 對方抗性（apply/armor_vs_元素）；最低 1。\n  火、冰、雷每 1 點抗性減 1 點傷害；風每 2 點才減 1 點。\n● 每次施咒：消耗神、得法術修為 random(慧根 ÷ 6) + 1（慧根 6 以上才有 random 部分，否則固定 1）。\n● 打中時得實戰經驗 1 + 傷害 ÷ 40，最多 20。\n● 增幅（overload）狀態：咒文強度 ×1.5，施展後解除（六卦熒雷不消耗）。\n● 技能點數（每次施咒各自擲一次；沒命中只給 1/4、至少 1 點；咒文重數就是第幾道咒文）：\n  基本咒術：((random(慧根)+1) × (random(慧根)+1) + random(慧根)) × (random(重數) + 1)\n  該系咒術：(random(悟性) × random(慧根) + random(慧根)) × (random(重數) + 1)\n● 求教後還沒 gain 的 0 級，也能施展需求 0 級的第一道咒文。"},{"title":"法術（茅山派）共用規則","body":"適用茅山法術、茅山奇術（咒術）、茅山幻術、遁甲書、奇門術、丹道兩門。\n\n● 法術點數（施法成功各自擲一次）：\n  基本法術：((random(靈性)+1) × (random(靈性)+1) + random(靈性)) × (random(層級) + 1)\n  茅山法術類技能：((random(悟性)+1) × (random(靈性)+1) + random(靈性)) × (random(層級) + 1)\n  層級是各法術自己定的（見各技能）。\n● 咒術系（茅山奇術、茅山幻術）改用咒術共用規則的技能點數公式（慧根、悟性）。"}],"weapons":[{"id":"/custom/weapon/blade/black_kris","file":"source/upstream/mudlib/custom/weapon/blade/black_kris.c","name":"黑風刀","ids":["black kris","blade"],"long":"一把黑漆漆的短刀, 刀面上隱隱散發出一陣陣的黑氣!","weight":8500,"value":"850 兩","unit":"把","flags":[],"kind":"blade","usages":[{"skill":"刀法","code":"blade","dmg":"2 - 26","bonus":"80%","mult":2},{"skill":"左手刀法","code":"secondhand blade","dmg":"2 - 12","bonus":"80%","mult":2}],"traits":{"刀法":[["拆招卸力之法",10,"parry"],["膂力",1,"str"]],"左手刀法":[["拆招卸力之法",10,"parry"],["膂力",1,"str"]]}},{"id":"/custom/weapon/blade/blade_of_dragon","file":"source/upstream/mudlib/custom/weapon/blade/blade_of_dragon.c","name":"\u001b[0;33m軒轅\u001b[1;37m龍骨\u001b[0;33m刀\u001b[m","ids":["blade of dragon","blade"],"long":"軒轅龍骨刀刀身長而寬刀刃寒光四射。此刀雖為千古名刀，但是卻因其刀\n身奇重，所以很少有人可以將其威力儘數發揮。","weight":19400,"value":"700 兩","unit":"把","flags":[],"kind":"blade","usages":[{"skill":"雙握刀法","code":"twohanded blade","dmg":"8 - 72","bonus":"172%","mult":4}],"traits":{"雙握刀法":[["攻擊能力值",30,"attack"]]}},{"id":"/custom/weapon/blade/blade_of_dragon_awakened","file":"source/upstream/mudlib/custom/weapon/blade/blade_of_dragon_awakened.c","name":"\u001b[1;33m軒轅\u001b[1;37m龍骨\u001b[1;33m刀\u001b[m","ids":["blade of dragon","blade"],"long":"\u001b[1;33m軒轅\u001b[1;37m龍骨\u001b[1;33m刀\u001b[m刀身長而寬刀刃寒光四射，豪光萬丈。此刀雖為千古名刀，但\n卻因其刀身奇重，所以很少有人可以將其深藏其中的天龍之力儘數發揮。","weight":19400,"value":"400 兩","unit":"把","flags":[],"kind":"blade","usages":[{"skill":"雙握刀法","code":"twohanded blade","dmg":"8 - 72","bonus":"172%","mult":4}],"traits":{"雙握刀法":[["攻擊能力值",50,"attack"],["守勢等級",50,"wittiness"]]}},{"id":"/custom/weapon/blade/blade_of_fire_spirit","file":"source/upstream/mudlib/custom/weapon/blade/blade_of_fire_spirit.c","name":"\u001b[1;31m邪刀•焱靈\u001b[m","ids":["blade of fire spirit","blade"],"long":"刀身透著邪異的火紅,又似鮮血欲滴,甫一接觸刀柄令你感到如雷亟般痛楚,\n心中產生莫名殺意....","weight":25500,"value":"150 兩","unit":"把","flags":[],"kind":"blade","usages":[{"skill":"雙握刀法","code":"twohanded blade","dmg":"9 - 102","bonus":"90%","mult":3}],"traits":{"雙握刀法":[["傷害力",25,"damage"],["雙握刀法",10,"twohanded blade"],["火焰傷害防禦力",100,"armor_vs_fire"]]}},{"id":"/custom/weapon/blade/blade_of_hydra_bone","file":"source/upstream/mudlib/custom/weapon/blade/blade_of_hydra_bone.c","name":"蛟骨刀","ids tom/weapon/sword/au_han_sword.c","name":"\u001b[0;35m古劍醒塵\u001b[m","ids":["au-han sword","sword"],"long":"此劍乃上古時代所煉鑄之神兵利器。玄陽真人雲遊諸神之地, 忽見到一寒池中\n隱閃紫光, 於是潛入探查, 竟發現一塊渾然天成的劍形紫晶, 便將之帶回居所\n, 苦尋神劍煉法, 耗盡三十年精力與心血, 最後亦以自身鮮血, 賦予此劍純正\n靈氣, 並將此劍插於清虛峰頂七七四十九天, 吸取日陽月華的至陰至陽。玄陽\n鑄此劍時立下大願, 要以此劍醒濁塵，故此劍名曰「醒塵」。","weight":9400,"value":"650 兩","unit":"把","flags":["唯一"],"kind":"sword","usages":[{"skill":"劍術","code":"sword","dmg":"8 - 65","bonus":"150%","mult":3}],"traits":{"劍術":[["膽識",2,"cor"],["定力",2,"cps"],["攻擊能力值",30,"attack"]]}},{"id":"/custom/weapon/sword/black_shortsword","file":"source/upstream/mudlib/custom/weapon/sword/black_shortsword.c","name":"黑色短劍","ids":["black shortsword","sword"],"long":"一把由玄鐵打造而成的短劍, 劍身還刻了幾個小字.","weight":3200,"value":"450 兩","unit":"把","flags":[],"kind":"sword","usages":[{"skill":"劍術","code":"sword","dmg":"2 - 20","bonus":"50%","mult":2},{"skill":"左手劍術","code":"secondhand sword","dmg":"2 - 10","bonus":"50%","mult":2}],"traits":{"劍術":[["靈性",1,"spi"],["攻擊能力值",12,"attack"]],"左手劍術":[["靈性",1,"spi"],["攻擊能力值",12,"attack"]]}},{"id":"/custom/weapon/sword/black_sword","file":"source/upstream/mudlib/custom/weapon/sword/black_sword.c","name":"黑劍","ids":["black sword","sword"],"long":"一把細劍, 長度較一般長劍略短, 劍身呈墨黑, 份量相當的輕。","weight":7200,"value":"100 兩","unit":"把","flags":[],"kind":"sword","usages":[{"skill":"劍術","code":"sword","dmg":"7 - 49","bonus":"100%","mult":3},{"skill":"左手劍術","code":"secondhand sword","dmg":"7 - 25","bonus":"100%","mult":3}],"traits":{"劍術":[["攻擊能力值",15,"attack"],["機敏",2,"dex"]],"左手劍術":[["機敏",1,"dex"]]}},{"id":"/custom/weapon/sword/blackthorn","file":"source/upstream/mudlib/custom/weapon/sword/blackthorn.c","name":"\u001b[1;30m玄蘇劍\u001b[m","ids":["blackthorn","sword"],"long":"這是一把劍身黝黑，劍刃生滿細刺的古劍，向來是封山劍派掌門人\n所使用的配劍，據說這把劍不會染血，而且經常散發出一股可怕的\n殺氣。","weight":23900,"value":"300 兩","unit":"把","flags":[],"kind":"sword","usages":[{"skill":"雙握劍術","code":"twohanded sword","dmg":"7 - 94","bonus":"157%","mult":3}],"traits":{"雙握劍術":[["雙握劍術",10,"twohanded sword"],["攻勢等級",50 rmor/double_cloudy_plate.c","name":"\u001b[1;37m兩儀雲龍甲\u001b[m","ids":["double cloudy plate","plate"],"long":"這是一件用白銀打造的鎧甲，鎧甲的正面鑲有一條白金的雲龍，雲\n龍的四周還精心的雕有許多白雲。這件鎧甲的價值想來不低，但是\n防禦能力似乎不是很好。","weight":12000,"value":"200 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",15,"armor"],["風擊傷害防禦力",75,"armor_vs_wind"],["攻勢等級",50,"intimidate"]]}},{"id":"/custom/armor/armor/dragon_armor","file":"source/upstream/mudlib/custom/armor/armor/dragon_armor.c","name":"\u001b[1;31m怒龍錦冑\u001b[m","ids":["dragon armor","armor"],"long":"這是一件武林中的至寶﹐據說是由練火大山的幻黑龍皮所製成\n的寶甲﹐不但尋常刀槍難以透入﹐也能防火燄冰霜的侵害﹐最\n重要的是質地輕軟﹐絲毫不妨礙行動。","weight":5000,"value":"1000 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",45,"armor"],["火焰傷害防禦力",40,"armor_vs_fire"],["冰寒傷害防禦力",40,"armor_vs_ice"]]}},{"id":"/custom/armor/armor/dragon_jade_robe","file":"source/upstream/mudlib/custom/armor/armor/dragon_jade_robe.c","name":"\u001b[1;36m龍鱗璧玉袍\u001b[m","ids":["dragon armor","armor"],"long":"一套看來相當華麗的巨大鎧甲﹐外圍相傳是用龍鱗和綠玉合製而成的﹐內部則是以相\n當輕飄的鳳凰羽編製﹐是不可多得的傳奇神器。","weight":5000,"value":"200 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["茅山奇術【遁甲書】",10,"taoism of dunja"],["火焰傷害防禦力",20,"armor_vs_fire"],["防禦力",20,"armor"],["慧根",1,"wis"]]}},{"id":"/custom/armor/armor/dragon_plate_of_knights","file":"source/upstream/mudlib/custom/armor/armor/dragon_plate_of_knights.c","name":"\u001b[1;33m龍騎戰甲\u001b[m","ids":["dragon plate of knights","plate"],"long":"一件厚重的鎧甲, 為軒轅心塵特地請匠師打造給領兵出爭的將軍們穿著的戰甲, 戰\n甲極為厚實, 非體格魁偉之人是無法穿戴的, 此外也因只有高階將領才會配發此甲\n所以穿著了這件龍騎甲, 在軒轅軍中也象徵了階級與地位。","weight":12000,"value":"300 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["根骨",2,"con"],["防禦力",30,"armor"],["機敏",-1,"dex"]]}},{"id":"/custom/armor/armor/full_plate_of_fire_hawk","file":"source/upstream/mudlib/custom/armor/armor/full_plate_of_fire_hawk.c","name":"\u001b[1;31m火鷹戰鎧\u001b[m","ids":["full plate of fire hawk","plate"],"long":"一件火紅色鎧甲, 胸前雕著一隻展翅的大鷹, 鷹勾褐黃, 羽毛赤紅, 似以精鋼加火\n熔岩練成，厚重堅實，為不可多得之寶甲, 只是稍嫌笨重, 非魁武者難適應。","weight":12000,"value":"1000 兩","unit":"件","flags":["唯一"],"slot":"armor","traits":{"護甲":[["攻勢等級",20,"intimidate"],["防禦力",35,"armor"],["膽識",2,"cor"],["火焰傷害防禦力",50,"armor_vs_fire"]]}},{"id":"/custom/armor/armor/ghost_hell_plate","file":"source/upstream/mudlib/custom/armor/armor/ghost_hell_plate.c","name":"\u001b[1;37m冥魂戰鎧\u001b[m","ids":["ghost-hell plate","plate"],"long":"一件散發著陰氣的戰甲﹐上面細細的雕滿了一百又八個不同樣式的冤魂\n野鬼。據說﹐這種雕花是一種來自陰間的詛咒﹐在提昇某種能力的同時\n會大幅度的降低其他的能力﹐所以﹐天朝的工匠們稱這類裝備為詛咒系\n裝備。","weight":12000,"value":"300 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",20,"armor"],["傷害力",10,"damage"],["膽識",1,"cor"]]}},{"id":"/custom/armor/armor/heart_armor","file":"source/upstream/mudlib/custom/armor/armor/heart_armor.c","name":"掩心甲","ids":["heart armor","armor"],"long":"一件輕便的皮甲，在心口處強化防禦，讓裝備者行動自如的同時還兼顧要害的防禦。","weight":10000,"value":"20 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",8,"armor"],["定力",1,"cps"]]}},{"id":"/custom/armor/armor/hell_dragon_armor","file":"source/upstream/mudlib/custom/armor/armor/hell_dragon_armor.c","name":"冥龍甲","ids":["hell dragon armor","armor"],"long":"一件看起來十分沉重的盔甲。由于整件盔甲是用生鐵製成的﹐\n所以有著良好的防禦能力﹐不過多少會帶來一些行動上的不便。","weight":12000,"value":"300 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["縱躍閃躲之法",-5,"dodge"],["守勢等級",20,"wittiness"],["防禦力",30,"armor"]]}},{"id":"/custom/armor/armor/holy_dragon_armor","file":"source/upstream/mudlib/custom/armor/armor/holy_dragon_armor.c","name":"聖龍甲","ids":["dragon armor","armor"],"long":"一件金鏤內襯，外披精鋼鐵環的鍊子甲，乃是專為沙場戰將所打造\n的上品戰甲，有著強大的防護力。","weight":8000,"value":"1200 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["膂力",2,"str"],["膽識",2,"cor"],["防禦能力值",10,"defense"],["防禦力",40,"armor"]]}},{"id":"/custom/armor/armor/iron_armor","file":"source/upstream/mudlib/custom/armor/armor/iron_armor.c","name":"\u001b[1;33m鐵戰甲\u001b[m","ids":["iron armor","armor"],"long":"一件鐵甲, 是做來打仗的時候穿的,  可以提供相當嚴密的防護,\n但是相當笨重。","weight":12000,"value":"500 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",20,"armor"]]}},{"id":"/custom/armor/armor/iron_torso","file":"source/upstream/mudlib/custom/armor/armor/iron_torso.c","name":"鑌鐵胸鎧","ids":["iron torso","torso"],"long":"這件胸鎧上面綴了許多鑌鐵鎖片﹐從胸至腰。","weight":12000,"value":"150 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["火焰傷害防禦力",5,"armor_vs_fire"],["雷電傷害防禦力",5,"armor_vs_lightning"],["防禦力",12,"armor"]]}},{"id":"/custom/armor/armor/light_plate","file":"source/upstream/mudlib/custom/armor/armor/light_plate.c","name":"\u001b[1;37m光鎧\u001b[m","ids":["light plate","plate"],"long":"一件有著柔柔白光的鎧甲。材質不明，是凌承軒的一位故人所贈的\n異世寶物。因為輕巧，凌月蘅都隨身穿著它。","weight":12000,"value":"33 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["風擊傷害防禦力",25,"armor_vs_wind"],["雷電傷害防禦力",100,"armor_vs_lightning"],["防禦力",5,"armor"],["縱躍閃躲之法",10,"dodge"]]}},{"id":"/custom/armor/armor/magic_armor","file":"source/upstream/mudlib/custom/armor/armor/magic_armor.c","name":"法胄","ids":["magic armor","armor"],"long":"這是一件畫著闢邪符咒的甲冑，硬皮護肩連著保護胸口後心要害的銅鎖片。","weight":3000,"value":"250 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",10,"armor"],["法術",10,"magic"],["天師道法【桃山密籙】",10,"taoism of conviction"]]}},{"id":"/custom/armor/armor/monkey_armor","file":"source/upstream/mudlib/custom/armor/armor/monkey_armor.c","name":"猿仙絲冑","ids":["monkey armor","armor"],"long":"相傳乃陷空島島主路經幻仙池遇一八尺雪猿, 與之酣鬥七天七\n夜終將雪猿斬殺, 見雪猿皮厚異常乃神物也, 於是割其皮, 食\n其肉, 突感功力大增。再將猿皮製成寶甲, 穿上後風寒不侵刀\n劍難傷! 終於獨步武林, 成為一代大俠。","weight":3000,"value":"800 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["冰寒傷害防禦力",20,"armor_vs_ice"],["風擊傷害防禦力",20,"armor_vs_wind"],["茅山法術",10,"mao-shan magic"],["防禦力",20,"armor"]]}},{"id":"/custom/armor/armor/padded_armor","file":"source/upstream/mudlib/custom/armor/armor/padded_armor.c","name":"軟櫬甲","ids":["padded armor","armor"],"long":"這是一種輕型的甲冑，在棉花中夾縫著一片片的鐵片，防護力中等，也\n不會妨礙行動，不過大熱天穿起來非常悶熱。","weight":3000,"value":"95 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["冰寒傷害防禦力",20,"armor_vs_ice"],["防禦力",14,"armor"]]}},{"id":"/custom/armor/armor/purple_cloud_mail","file":"source/upstream/mudlib/custom/armor/armor/purple_cloud_mail.c","name":"\u001b[1;36m紫雲戰甲\u001b[m","ids":["purple-cloud mail","mail"],"long":"一副看來非常神氣的鎧甲, 在整副鎧甲上都雕滿著紫色的祥雲, 令人\n感到非常的祥和, 簡直一點都不像是副作戰用的鎧甲.","weight":12000,"value":"100 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",20,"armor"],["定力",2,"cps"]]}},{"id":"/custom/armor/armor/raw_iron_armor","file":"source/upstream/mudlib/custom/armor/armor/raw_iron_armor.c","name":"生鐵戰甲","ids":["iron armor","armor"],"long":"一件十分輕便的盔甲不過看起來防禦力不錯。","weight":12000,"value":"450 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",25,"armor"]]}},{"id":"/custom/armor/armor/red_scale_plate","file":"source/upstream/mudlib/custom/armor/armor/red_scale_plate.c","name":"火鱗胸鎧","ids":["red_scale plate","plate"],"long":"一件滿飾火紅色鱗片的鎧甲，鱗片上微微透出暗紅色的光暈。相傳柳東蘆早年\n遊經祈國與練火大山邊境時，曾仗著手中玄蘇劍，用計斬殺了一隻頭生雙角、\n口吐火燄的巨蟒，之後以巨蟒皮製成幾套防具，看來這就是其中一件了。","weight":5000,"value":"500 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",35,"armor"],["雙握劍術",10,"twohanded sword"],["火焰傷害防禦力",50,"armor_vs_fire"],["雷電傷害防禦力",100,"armor_vs_lightning"]]}},{"id":"/custom/armor/armor/ring_armor","file":"source/upstream/mudlib/custom/armor/armor/ring_armor.c","name":"連身鎖子甲","ids":["ring armor","armor"],"long":"一件連身鎖子甲﹐由鐵鍊接合許多鐵片﹐構成保護全身的一件戰甲﹐因\n為嵌上鐵片﹐所以比一般的鎖子鎧有更好的防禦效果﹐但是重量也重得\n多。","weight":8000,"value":"50 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["縱躍閃躲之法",-5,"dodge"],["防禦力",9,"armor"]]}},{"id":"/custom/armor/armor/ring_mail","file":"source/upstream/mudlib/custom/armor/armor/ring_mail.c","name":"鎖子鎧","ids":["ring mail","mail"],"long":"一件用上千個鐵環嵌結而成的鎖子鎧﹐雖然防禦力比不上戰場上\n常用的重型戰鎧﹐但是輕便堅固﹐不會妨礙行動則是戰鎧所沒有\n的優點。","weight":8000,"value":"80 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["防禦力",5,"armor"]]}},{"id":"/custom/armor/armor/ringmail","file":"source/upstream/mudlib/custom/armor/armor/ringmail.c","name":"鎖子甲","ids":["ringmail"],"long":"一件由金屬環, 環環相扣所造成的鎖子甲, 防護力略差, 但由於輕便, 為實戰上極為常見的護甲。","weight":8000,"value":"80 兩","unit":"件","flags":[],"slot":"armor","traits":{"護甲":[["膽 it":"座","verbs":["setup","dispose"],"flags":[],"cat":"丹藥"},{"id":"/obj/alchemist/heat_reactor","file":"source/upstream/mudlib/obj/alchemist/heat_reactor.c","name":"青銅丹鼎","ids":["bronze reactor","reactor"],"long":"一座用來盛放配方的青銅丹鼎。","weight":1500,"value":"2 兩 50 文","unit":"座","flags":[],"cat":"丹藥"},{"id":"/obj/alchemist/lavage_pill","file":"source/upstream/mudlib/obj/alchemist/lavage_pill.c","name":"清腹丹","ids":["lavage pill","pill"],"long":"清腹丹是一種藥性峻烈的方家丹藥，由大黃、芒硝、枳實及厚朴等數種藥材煉製而成，具有通腑導滯、蕩除積穢之效。其藥力猛烈，服用後往往腹中翻攪、腸鳴不止，令人便意難抑，若非必要，實不宜輕易服用。","weight":5,"value":"10 兩","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -10","食物 -30"]},{"id":"/obj/alchemist/major_heal_pill","file":"source/upstream/mudlib/obj/alchemist/major_heal_pill.c","name":"大還丹","ids":["major heal pill","major","pill"],"long":"大還丹是一種極神奇的仙丹, 具強大的療效可以讓服用者的\n內外傷在瞬間癒合, 不過煉製大還丹所需的藥材除了小還丹\n所需的幾樣藥材外, 還必需找尋雪蓮, 千年人蔘等數種罕見\n的珍貴藥材。因此, 大還丹除了燒煉困難外, 藥材之價格亦\n極昂貴。","weight":5,"value":"300 兩","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -18","食物 +7","氣 +70","氣 +100","形體 +10","形體 +25"]},{"id":"/obj/alchemist/mana_pill","file":"source/upstream/mudlib/obj/alchemist/mana_pill.c","name":"醒神丹","ids":["mana pill","pill"],"long":"醒神丹是一種提神醒腦、恢復神思的丹藥，由遠志、石菖蒲、茯神、人蔘及甘草等數種藥材煉\n製而成。此丹具有寧神益智之效，能使因過度耗神而疲憊的精神迅速恢復，為方士常用的丹藥\n之一。","weight":5,"value":"30 兩","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -10","食物 +5","神 +15","神 +30","神 -8","精實格 -1","精 -5"]},{"id":"/obj/alchemist/minor_heal_pill","file":"source/upstream/mudlib/obj/alchemist/minor_heal_pill.c","name":"小還丹","ids":["minor heal pill","minor","pill"],"long":"小還丹是一種相當神奇的仙丹，可以讓服用者的外傷在瞬間癒合，換句\n話說，相對於一般只能恢復精氣神的普通丹藥，小還丹還能夠恢復形體\n所受的損傷，不過煉製小還丹所需的藥材頗為昂貴，而且燒煉時必須用\n大量的汞護住丹爐，因此所費不貲，很少有藥舖會販賣這種丹藥。","weight":5,"value":"60 兩","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -15","食物 +5","精實格 -5","精 -5","氣 +35","氣 +60","形體 +20"]},{"id":"/obj/alchemist/mix_recipe","file":"source/upstream/mudlib/obj/alchemist/mix_recipe.c","name":"混合藥丹","ids":["mixed pill","mixed","pill"],"long":"這是一種正在測試中的藥丹, 藥性未知, 請勿誤食, fresh_pill","file":"source/upstream/mudlib/obj/alchemist/refresh_pill.c","name":"金鎖固精丸","ids":["refresh pill","pill"],"long":"金鎖固精丸為合芡實, 龍骨, 連鬚, 潼蒺藜及牡蠣數種藥材所鍊製\n而成是一種方家丹藥的總稱，具澀精之療效。","weight":5,"value":"10 兩","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -10","食物 +5","精 +25","精 +20","神 -8"]},{"id":"/obj/alchemist/relax_pill","file":"source/upstream/mudlib/obj/alchemist/relax_pill.c","name":"養心丹","ids":["relax pill","pill"],"long":"養心丹是一種藥性溫和的方家丹藥，以酸棗仁、柏子仁、遠志及茯神等數種寧心安神的藥材煉製而成，具有養心寧神、紓解勞倦之效。服用後周身疲乏漸消，然藥性偏於收斂，精、氣、神亦會因而略有耗損，不宜接連服用。","weight":5,"value":"10 兩","unit":"些","flags":[],"cat":"丹藥","effects":["精 -5","氣 -5","神 -5"]},{"id":"/obj/drug/boar_berry","file":"source/upstream/mudlib/obj/drug/boar_berry.c","name":"山豬果","ids":["boar berry","berry"],"long":"山豬果是一種生長在深山中﹐尤其是野豬的巢穴附近的一種暗紅色\n野莓﹐有些山豬果是有毒的﹐有些則是無毒的﹐無毒的山豬果可以\n用來當解毒劑的藥材﹐直接服用則可以提神﹐不過先警告你﹐味道\n不....太好。","weight":70,"value":"20 兩","unit":"些","flags":[],"cat":"丹藥","effects":["食物 +10","飲水 -20","神 +15","神 +10"]},{"id":"/obj/drug/dragon_saliva","file":"source/upstream/mudlib/obj/drug/dragon_saliva.c","name":"龍涎草","ids":["dragon-saliva herb","dragon-saliva","herb"],"long":"龍涎草是一種相當名貴的療傷藥﹐一般人是不太買得起這種藥材的﹐\n龍涎草經常被方士們用於煉製一些珍貴的丹藥﹐但是直接服食這種草\n藥也有些許的療傷效果﹐只不過有些浪費罷了。","weight":7,"value":"50 兩","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -10","食物 +10","神 -3","氣 +30"]},{"id":"/obj/drug/flower_pill","file":"source/upstream/mudlib/obj/drug/flower_pill.c","name":"紅花丸","ids":["flower pill","pill"],"long":"紅花丸是一種治療腹瀉的常見丹方，不過製造相當費時麻煩，多\n半要到大一點的市鎮才買得到。","weight":5,"value":"1 兩 50 文","unit":"些","flags":[],"cat":"丹藥","effects":["飲水 -30","食物 +5"]},{"id":"/obj/drug/gray_mushroom","file":"source/upstream/mudlib/obj/drug/gray_mushroom.c","name":"灰草菇","ids":["gray mushroom","mushroom"],"long":"灰草菇是一種生長在潮濕的湖邊沼地，可以用來治療刀傷的\n細小草菇，通常提煉以後用來製造外敷的膏藥，不過直接服\n用也有少許治療內傷的功效。","weight":30,"value":"90 文","unit":"些","flags":[],"cat":"丹藥","effects":["食物 +20","飲水 -20"]},{"id":"/obj/drug/wild_ginseng","file":"source/upstream/mudlib/obj/drug/wild_ginseng.c","name" ,"flags":[],"cat":"飲品"},{"id":"/obj/alchemist/heat_firewood","file":"source/upstream/mudlib/obj/alchemist/heat_firewood.c","name":"燃燒中的松柴","ids":["burning firewood","firewood","pine firewood"],"long":"一捆松木柴。","weight":120,"value":"5 文","unit":"捆","verbs":["ignite","extinguish"],"flags":[],"cat":"飲品"},{"id":"/obj/bottle","file":"source/upstream/mudlib/obj/bottle.c","name":"玻璃瓶","ids":["glass bottle","bottle"],"long":"一個透明的玻璃瓶。","weight":700,"value":"1 兩","unit":"個","flags":[],"cat":"飲品"},{"id":"/obj/example/es2_bottle","file":"source/upstream/mudlib/obj/example/es2_bottle.c","name":"精緻玻璃瓶","ids":["bottle"],"long":"一個透明又很華麗的精緻玻璃瓶，這是 workshop 的紀念品。","weight":null,"value":"0 文","unit":null,"flags":[],"cat":"飲品"}],"npcs":{"/d/baihua/npc/dou_foo":{"id":"/d/baihua/npc/dou_foo","file":"source/upstream/mudlib/d/baihua/npc/dou_foo.c","name":"杜福","ids":["dou foo","dou","foo"],"long":"杜福是近幾年才搬進百花村定居的村民，平日沉默寡言，總是拄著一根長杖在崖邊散步。村裡的人都知道他棍法了得，曾經一個人打退過上山搶劫的盜匪，但問起他的來歷，他總是笑而不答。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"male","title":null,"equip":[{"path":"/custom/weapon/staff/sinia_staff","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/cliff",1]]},"/d/baihua/npc/girl":{"id":"/d/baihua/npc/girl","file":"source/upstream/mudlib/d/baihua/npc/girl.c","name":"小姑娘","ids":["girl"],"long":"一個模樣清秀的小姑娘，烏黑的頭髮梳成兩條辮子，笑起來臉頰上有兩個淺淺的酒窩。她心地善良，常常煮了熱騰騰的羹湯送給村裡的老人家，說起阿三哥的時候，眼神總是特別溫柔。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"female","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/alley",1]]},"/d/baihua/npc/innkeeper":{"id":"/d/baihua/npc/innkeeper","file":"source/upstream/mudlib/d/baihua/npc/innkeeper.c","name":"掌櫃","ids":["innkeeper"],"long":"紅燈客棧的掌櫃，一個瘦小的中年人，整天坐在櫃臺後面劈哩啪啦地打著算盤，嘴裡還念念有詞，客人上門也不太抬頭，算盤珠子倒是一刻也沒停過。","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/inn",1]]},"/d/baihua/npc/kao_yeu":{"id":"/d/baihua/npc/kao_yeu","file":"source/upstream/mudlib/d/baihua/npc/kao_yeu.c","name":"高玉","ids":["kao yeu","kao","yeu"],"long":"高玉是江湖上小有名氣的槍法好手，一桿長槍使得出神入化，人稱「穿雲槍」。此刻他倚著岩壁坐在平台一角，衣襟上血跡斑斑，臉色蒼白，胸口纏著的布條還隱隱滲出血來，顯然受了不輕的傷，只是一雙眼睛依舊銳利，始終緊握著手中的長槍。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":35,"gender":"male","title":null,"equip":[{"path":"/custom/weapon/pike/dragon_bone_pike","use":"wield"},{"path":"/custom/armor/head/golden_feather_helm","use":"wear"},{"path":"/custom/armor/armor/ringmail","use":"wear"},{"path":"/custom/armor/feet/forgod_boots","use":"wear"}],"skills":[["穹槍訣",105,"sky_pike"]],"wander":false,"ghost":false,"rooms":[["/d/baihua/platform",1]]},"/d/baihua/npc/nan_kong_hen":{"id":"/d/baihua/npc/nan_kong_hen","file":"source/upstream/mudlib/d/baihua/npc/nan_kong_hen.c","name":"南宮恨","ids":["nan kong hen","nan","hen"],"long":"南宮恨一臉秀氣, 身著白淨衣裳, 徐風吹來身形搖蕩, 似乎有些瘦弱. 平時不問人間俗事, 山林為屋, 草木為衣, 枕流漱石修身養性, 故以中年之齡在道術上已有相當領悟.","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"taoist","level":40,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/road2",1]]},"/d/baihua/npc/old_wang":{"id":"/d/baihua/npc/old_wang","file":"source/upstream/mudlib/d/baihua/npc/old_wang.c","name":"老王","ids":["old wang","wang"],"long":"百花村最德高望重的人，慈祥和藹的樣子背後藏著令人辛酸的往事。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/wang_home",1]]},"/d/baihua/npc/san":{"id":"/d/baihua/npc/san","file":"source/upstream/mudlib/d/baihua/npc/san.c","name":"阿三哥","ids":["san"],"long":"一個身材壯碩的青年，皮膚曬得黝黑，兩條臂膀結實有力，村裡搬重物、修屋頂的粗活多半少不了他。他為人憨厚，說起話來有些靦腆，一見到村裡的小姑娘，臉就紅到了耳根。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/alley",1]]},"/d/baihua/npc/shepherd":{"id":"/d/baihua/npc/shepherd","file":"source/upstream/mudlib/d/baihua/npc/shepherd.c","name":"牧童","ids":["boy","shepherd"],"long":"年輕的小童，每日照看牲畜很是悠哉。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":null,"equip":[{"path":"/custom/weapon/staff/shepherd_cane","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/wang_home",1]]},"/d/baihua/npc/stone_lion":{"id":"/d/baihua/npc/stone_lion","file":"source/upstream/mudlib/d/baihua/npc/stone_lion.c","name":"石獅子","ids":["stone lion","lion","石獅子"],"long":"一尊蹲坐在廟門口的石獅子，石身佈滿青苔與裂紋，鬃毛的雕紋卻依舊清晰。它張著大口、瞪著圓眼，神態威武，不時有路過的人朝它比劃幾下拳腳，它也只是默默地承受著。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":20,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/temple",1]]},"/d/baihua/npc/student":{"id":"/d/baihua/npc/student","file":"source/upstream/mudlib/d/baihua/npc/student.c","name":"小學童","ids":["student","students"],"long":"跟著先生念詩的小學童，心不在焉的想跑出去玩。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":3,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/school",3]]},"/d/baihua/npc/traveller":{"id":"/d/baihua/npc/traveller","file":"source/upstream/mudlib/d/baihua/npc/traveller.c","name":"過路客","ids":["traveller"],"long":"一位行色匆匆, 滿臉風霜的過路客, 一身勁裝, 似乎隨時又要上路去.","weight":null,"value":null,"unit":"位","flags":[],"race":"jiaojao","class":"thief","level":20,"gender":"female","title":null,"equip":[{"path":"/obj/area/obj/cloth","use":"wear"},{"path":"/obj/area/obj/shortsword","use":"wield"}],"skills":[["拆招卸力之法",50,"parry"],["縱躍閃躲之法",50,"dodge"],["刀法",60,"blade"]],"wander":false,"ghost":false,"rooms":[["/d/baihua/inn",1]]},"/d/baihua/npc/wang_yean":{"id":"/d/baihua/npc/wang_yean","file":"source/upstream/mudlib/d/baihua/npc/wang_yean.c","name":"王燕","ids":["wang yean","wang","yean"],"long":"一個滿身藥味, 神情專注的女子正在清理一些木材, 似乎沒有注意到你正在看她. 由她的裝束來看, 不像學武之人, 反倒像是到處尋藥之神醫. 她師兄陳度好管閒事, 反倒在藥材的研究上, 比不上默默鑽研的王燕. 尤其專注的神貌, 似乎正在調理重要的配方.","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"alchemist","level":20,"gender":"female","title":null,"equip":[{"path":"/custom/weapon/dagger/shennong_dagger","use":"wield"},{"path":"/custom/armor/cloth/green_cloth","use":"wear"},{"path":"/custom/armor/head/goat_hat","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/tile_house",1]]},"/d/kangping/npc/innkeeper":{"id":"/d/kangping/npc/innkeeper","file":"source/upstream/mudlib/d/kangping/npc/innkeeper.c","name":"客店主人","ids":["innkeeper"],"long":"小客店的主人，一個面容和善的中年漢子。店裡就他一個人，既是掌櫃也是店小二，一會兒在櫃臺後算帳，一會兒又端著飯菜在桌間穿梭，忙得滿頭大汗，卻始終笑臉迎人。","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/kangping/inn",1]]},"/d/kangping/npc/kid":{"id":"/d/kangping/npc/kid","file":"source/upstream/mudlib/d/kangping/npc/kid.c","name":"阿桂","ids":["kid","a-gui"],"long":"一個機靈的小男孩，臉蛋曬得紅通通的，見了外地人一點也不怕生，總是熱心地跑上前來，七嘴八舌地介紹村裡哪家的井水最甜、哪條路通到谷口，還不忘提醒你夜裡別往谷裡去。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":"male","title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/kangping/square",1]]},"/d/lee/npc/child":{"id":"/d/lee/npc/child","file":"source/upstream/mudlib/d/lee/npc/child.c","name":"小孩","ids":["child","lee child"],"long":"一個在村裡跑來跑去的小孩，衣角沾著灰土，像是剛從廣場玩回來。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":1,"gender":null,"title":null,"equip":[{"path":"/d/snow/npc/obj/tummy_cover","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/school",3],["/d/lee/square_c",3]]},"/d/lee/npc/farmer":{"id":"/d/lee/npc/farmer","file":"source/upstream/mudlib/d/lee/npc/farmer.c","name":"農夫","ids":["farmer","lee farmer"],"long":"一名常年在田裡工作的農夫，皮膚曬得黝黑，手掌粗糙，對田裡作物看得很緊。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/watermelon_n1",3],["/d/lee/watermelon_n2",3]]},"/d/lee/npc/guard":{"id":"/d/lee/npc/guard","file":"source/upstream/mudlib/d/lee/npc/guard.c","name":"守衛","ids":["guard","lee guard"],"long":"一名負責巡看李家村出入口的守衛，穿著便於行動的短裝，目光時常警覺地掃視著來往的行人。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":15,"gender":null,"title":null,"equip":[{"path":"/d/lee/obj/brow_staff","use":"wield"},{"path":"/d/lee/obj/hemp_cloth","use":"wear"},{"path":"/d/lee/obj/hemp_boots","use":"wear"}],"skills":[["杖法",50,"staff"],["拆招卸力之法",20,"parry"],["縱躍閃躲之法",20,"dodge"]],"wander":false,"ghost":false,"rooms":[["/d/lee/gate_e",1],["/d/lee/gate_n",2],["/d/lee/gate_s",2],["/d/lee/gate_w",2]]},"/d/lee/npc/hawthorn_seller":{"id":"/d/lee/npc/hawthorn_seller","file":"source/upstream/mudlib/d/lee/npc/hawthorn_seller.c","name":"冰糖葫蘆小販","ids":["seller","hawthorn seller"],"long":"一名挑著小擔的冰糖葫蘆小販，正在這裡叫賣。\n擔子上插滿了一串串裹著糖衣的山楂，村中的孩子們都喜歡來找他買冰糖葫蘆。","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/street2",1]]},"/d/lee/npc/herb_boy":{"id":"/d/lee/npc/herb_boy","file":"source/upstream/mudlib/d/lee/npc/herb_boy.c","name":"小藥童","ids":["boy","apprentice","herb boy"],"long":"一個在醫館裡跑進跑出的藥童，衣袖上沾著搗藥留下的藥漬，手裡還捧著幾株曬乾的藥草，看來是聶晟身邊打雜幫手的孩子。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":3,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/shrine",2]]},"/d/lee/npc/hunter":{"id":"/d/lee/npc/hunter","file":"source/upstream/mudlib/d/lee/npc/hunter.c","name":"獵戶","ids":["hunter","lee hunter"],"long":"村裡的獵戶，腰間掛著繩索與小刀，身上帶著山林和煙火混合的氣味。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":5,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/lee/npc/lee_hsu_hsien":{"id":"/d/lee/npc/lee_hsu_hsien","file":"source/upstream/mudlib/d/lee/npc/lee_hsu_hsien.c","name":"李勖賢","ids":["lee hsu hsien","hsu hsien","lee","hsu","hsien"],"long":"李勖賢是村裡的文士，有秀才的頭銜，矮小的身裁給人很瘦弱的感覺，現在正\n指導學童唸著書。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":10,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/school",1]]},"/d/lee/npc/lee_xiao_tian":{"id":"/d/lee/npc/lee_xiao_tian","file":"source/upstream/mudlib/d/lee/npc/lee_xiao_tian.c","name":"李嘯天","ids":["lee xiao tian","li xiao tian","manager lee","lee","li","xiao","tian"],"long":"李員外家的二總管為人精明，年少時好舞刀弄槍，被派任當鋪掌櫃之後，諸事都處理得緊緊有條。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":null,"title":null,"equip":[{"path":"/d/lee/obj/yellow_jade_ring","use":"wear"},{"path":"/d/lee/obj/willow_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/pawnshop",1]]},"/d/lee/npc/lee_yen":{"id":"/d/lee/npc/lee_yen","file":"source/upstream/mudlib/d/lee/npc/lee_yen.c","name":"李岩","ids":["lee yen","li yan","herbalist","lee","yen","li","yan"],"long":"李家村藥鋪的掌櫃，熟悉常用藥材與丹藥。你可以用 list 查看目前已恢復且功能可核對的商品。","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":4,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/herb_shop",1]]},"/d/lee/npc/lee_yong":{"id":"/d/lee/npc/lee_yong","file":"source/upstream/mudlib/d/lee/npc/lee_yong.c","name":"李勇","ids":["lee yong","li yong","lee","li","yong"],"long":"李勇是村子裡惟一的獵戶，雖然沒學過甚麼武功，天生的神力卻讓他足以打敗\n普通好手，從他家裡滿屋子的獸皮你就能了解他的實力。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":15,"gender":null,"title":null,"equip":[{"path":"/d/lee/obj/leather_boots","use":"wear"},{"path":"/d/lee/obj/tight_cloth","use":"wear"},{"path":"/d/lee/obj/hunter_pike","use":"wield"}],"skills":[["單手槍法",30,"pike"]],"wander":false,"ghost":false,"rooms":[["/d/lee/hunter",1]]},"/d/lee/npc/lee_zhong":{"id":"/d/lee/npc/lee_zhong","file":"source/upstream/mudlib/d/lee/npc/lee_zhong.c","name":"李忠","ids":["lee zhong","li zhong","zhong","lee","li"],"long":"李忠是賣雜貨小夥計，整天笑嘻嘻的，一臉老實樣。","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/grocery",1]]},"/d/lee/npc/li_ban_xian":{"id":"/d/lee/npc/li_ban_xian","file":"source/upstream/mudlib/d/lee/npc/li_ban_xian.c","name":"李半仙","ids":["li ban xian","ban xian","storyteller","li","ban","xian"],"long":"一位常在小旅店落腳的說書先生，鬍鬚微白，說起江湖舊聞時總是愛故意壓低聲音。目前階段只保留已經確認的角色與位置，完整的說書關鍵字和能力成長事件都待後續逐條復原。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/inn",1]]},"/d/lee/npc/nee_cheng":{"id":"/d/lee/npc/nee_cheng","file":"source/upstream/mudlib/d/lee/npc/nee_cheng.c","name":"聶晟","ids":["nee cheng","nee","cheng"],"long":"聶晟是李家村裡惟一不姓李的住民。十多年前，村裡許多的居民曾經得了一種怪病，聶晟\n恰巧路過，治好了村民，於是李員外請他留下，成為村裡的大夫。\n聶晟身形削瘦，做文人打扮，表情冷漠，似乎不太容易親近。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"alchemist","level":40,"gender":null,"title":null,"equip":[{"path":"/d/snow/npc/obj/white_dress","use":"wear"},{"path":"/d/lee/obj/crystal_ring","use":"wear"},{"path":"/obj/area/obj/leather_whip","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/shrine",1]]},"/d/lee/npc/teacher":{"id":"/d/lee/npc/teacher","file":"source/upstream/mudlib/d/lee/npc/teacher.c","name":"私塾先生","ids":["teacher","school teacher"],"long":"私塾裡的先生，衣著樸素，說話慢條斯理。原圖雖有私塾人物線索，但姓名與完整功能仍待核對，因此暫不用未證實的專名。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/d/lee/npc/traveller":{"id":"/d/lee/npc/traveller","file":"source/upstream/mudlib/d/lee/npc/traveller.c","name":"旅客","ids":["traveller"],"long":"路上來來往往的旅人，每天都能碰上十來個。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/cloth","use":"wear"},{"path":"/obj/area/obj/shortsword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/entrance_s",3]]},"/d/lee/npc/waiter":{"id":"/d/lee/npc/waiter","file":"source/upstream/mudlib/d/lee/npc/waiter.c","name":"店小二","ids":["waiter","lee waiter"],"long":"李家村小旅店的店小二，動作俐落，忙著替往來客人端茶送飯。你可以用 list 看菜單，再用 buy 購買。","weight":null,"value":null,"unit":null,"verbs":["list"],"flags":[],"race":"human","class":"commoner","level":2,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/inn",1]]},"/d/lee/npc/woman":{"id":"/d/lee/npc/woman","file":"source/upstream/mudlib/d/lee/npc/woman.c","name":"婦人","ids":["woman","lee woman"],"long":"一名住在李家村的婦人，手裡忙著家務，遇上熟人便停下來聊幾句村裡近況。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"commoner","level":5,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/farm_w1",1],["/d/lee/riverside_n1",1],["/d/lee/riverside_s",4]]},"/d/oldpine/npc/bandit":{"id":"/d/oldpine/npc/bandit","file":"source/upstream/mudlib/d/oldpine/npc/bandit.c","name":"土匪","ids":["bandit"],"long":"滿臉橫肉看起來一副凶神惡煞的樣子。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":10,"gender":null,"title":null,"equip":[{"path":"/obj/area/obj/blade" ":null,"unit":null,"flags":[],"race":null,"class":null,"level":null,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":true,"rooms":[["/d/snow/ngate",1]]},"/custom/ghost/npc/wandering_soul":{"id":"/custom/ghost/npc/wandering_soul","file":"source/upstream/mudlib/custom/ghost/npc/wandering_soul.c","name":"遊魂","ids":["wandering soul","soul","ghost"],"long":"一縷不屬於任何家族牌位的遊魂，無人祭祀、無處可歸，只能等待陽間的\n慈善廟宇進行集體收容與超度。","weight":null,"value":null,"unit":null,"flags":[],"race":null,"class":null,"level":null,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":true,"rooms":[["/d/snow/nstreet1",1],["/d/snow/ruin1",1]]},"/custom/ghost/npc/water_goblin":{"id":"/custom/ghost/npc/water_goblin","file":"source/upstream/mudlib/custom/ghost/npc/water_goblin.c","name":"魍魎","ids":["water goblin","goblin","ghost"],"long":"一隻皮膚紅黑、耳朵很長的魍魎，喜歡在夜間模仿人類的聲音來嚇人，\n或是引誘人走進水裡溺死。","weight":null,"value":null,"unit":null,"flags":[],"race":null,"class":null,"level":null,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":true,"rooms":[["/d/snow/river1",1]]},"/custom/ghost/npc/wronged_ghost":{"id":"/custom/ghost/npc/wronged_ghost","file":"source/upstream/mudlib/custom/ghost/npc/wronged_ghost.c","name":"枉死鬼","ids":["wronged ghost","ghost"],"long":"一個因意外而亡的枉死鬼，無法投胎轉世，只能在事發地點附近遊蕩，\n一遍又一遍地重複著死前的那一刻。","weight":null,"value":null,"unit":null,"flags":[],"race":null,"class":null,"level":null,"gender":null,"title":null,"equip":[],"skills":[],"wander":false,"ghost":true,"rooms":[["/d/snow/ebridge",1]]},"/custom/ghost/std_ghost":{"id":"/custom/ghost/std_ghost","file":"source/upstream/mudlib/custom/ghost/std_ghost.c","name":"std_ghost","ids":[],"long":"","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":null,"level":null,"gender":null,"title":null,"equip":[],"skills":[],"wander":true,"ghost":false,"rooms":[]},"/custom/legacy_npc/abbot_wu_nian":{"id":"/custom/legacy_npc/abbot_wu_nian","file":"source/upstream/mudlib/custom/legacy_npc/abbot_wu_nian.c","name":"無念大師","ids":["abbot wu-nian","abbot","wu-nian"],"long":"這位瘦小的老人就是天朝境內備受推崇的武學大師，白象寺的方丈\n無念大師。他自幼在白象寺內演習佛法修練武功，時至今日，其佛\n學修養和武學修為均以達登峰造極的境界，實在是讓人敬佩啊。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"monk","level":65,"gender":"male","title":"白象寺住持","equip":[{"path":"/custom/armor/feet/wonder_boots","use":"wear"},{"path":"/custom/armor/head/black_doli","use":"wear"},{"path":"/custom/armor/neck/psakaml","use":"wear"},{"path":"/custom/weapon/staff/flower_cane","use":"wield"},{"path":"/custom/armor/cloth/gold_robe","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ai_xiao_hu":{"id":"/custom/legacy_npc/ai_xiao_hu","file":"source/upstream/mudlib/custom/legacy_npc/ai_xiao_hu.c","name":"艾小虎","ids":["ai xiao-hu","ai","xiao-hu"],"long":"這位黑衣漢子正是黑道上號稱「六大殺手」之一的艾小虎，一手霸絕、狠絕的刀法\n曾讓追殺他的人死傷無數。","weight":null,"value":null,"unit":null,"flags":[],"race":"blackteeth","class":"fighter","level":45,"gender":"male","title":"殺手","equip":[{"path":"/custom/armor/armor/chain_shirt","use":"wear"},{"path":"/custom/armor/cloth/gray_robe","use":"wear"},{"path":"/custom/weapon/blade/poison_wind_blade","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/bai_jian_fei":{"id":"/custom/legacy_npc/bai_jian_fei","file":"source/upstream/mudlib/custom/legacy_npc/bai_jian_fei.c","name":"白劍飛","ids":["bai jian fei","bai","fei"],"long":"白劍飛是水路第一大幫 \"漕幫\" 的仁堂分舵主，也是漕幫總舵主蕭尹的長子，白\n劍飛自幼師從蕭尹的義兄 \"玉面劍儒  白靖堂\" 門下，由於白靖堂膝下無子，對\n白劍飛視如己出，並將其一生鑽研劍術之精華豪不藏私的教授於白劍飛，蕭尹感\n其恩情，並體念其義兄年歲已高，遂令白劍飛改從白姓。\n白劍飛一方面因血緣因素，另一方面也因其精湛的劍法及輕功成為漕幫 \"仁義禮\n智信\" 五個堂口中為首位的仁堂舵主。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":25,"gender":"male","title":"漕幫仁堂分舵主","equip":[{"path":"/custom/armor/feet/boots_of_cleanse","use":"wear"},{"path":"/custom/armor/waist/silver_girth","use":"wear"},{"path":"/custom/armor/armor/white_dragon_plate","use":"wear"},{"path":"/custom/weapon/sword/cherry_blossoms_sword","use":"wield"},{"path":"/custom/weapon/sword/white_dragon_fang","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/bai_yu":{"id":"/custom/legacy_npc/bai_yu","file":"source/upstream/mudlib/custom/legacy_npc/bai_yu.c","name":"白魚","ids":["bai yu","bai","yu"],"long":"白魚是大漠八魔的老大，但為人優柔寡斷，所以凡事都由老二來主持。","weight":null,"value":null,"unit":null,"flags":[],"race":"malik","class":"alchemist","level":40,"gender":"male","title":null,"equip":[{"path":"/custom/armor/head/copper_hat","use":"wear"},{"path":"/custom/armor/cloth/seven_star_robe","use":"wear"},{"path":"/custom/weapon/whip/angry_whip","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/barbarian_chief":{"id":"/custom/legacy_npc/barbarian_chief","file":"source/upstream/mudlib/custom/legacy_npc/barbarian_chief.c","name":"野人酋長","ids":["barbarian chief","barbarian","chief"],"long":"一個赤身露體的野人﹐正張大了嘴對著你疵牙裂嘴。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":5,"gender":"male","title":null,"equip":[{"path":"/custom/weapon/staff/bone_staff","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/black_hell_agent":{"id":"/custom/legacy_npc/black_hell_agent","file":"source/upstream/mudlib/custom/legacy_npc/black_hell_agent.c","name":"黑無常","ids":["black hell agent","black","agent"],"long":"勾魂使者黑無常是負責將因戰亂和意外而喪生的人的靈魂引去接受\n閻王的審判。一般來說，活人是見不到他的。而現在他就在你的面\n前，不過他似乎正在忙著找亂殺無辜之人。","weight":null,"value":null,"unit":null,"flags":[],"race":"malik","class":"taoist","level":50,"gender":"male","title":"勾魂使者","equip":[],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/blade_man":{"id":"/custom/legacy_npc/blade_man","file":"source/upstream/mudlib/custom/legacy_npc/blade_man.c","name":"葬心","ids":["blade man","blade","man"],"long":"一個正獨自在喝著酒的灰衣少年，看他帶點憂慮的神情，不知道他碰上了什麼困\n難，眼光一轉看到他手中把玩的奇特單刀，這種紅色透明的武器不知是用什麼所\n鑄造成的，如果說這把刀是兵器，不如把它當成藝品還比較恰當。","weight":null,"value":null,"unit":null,"flags":[],"race":"yenhold","class":"fighter","level":30,"gender":"male","title":"青邪宮禁衛","equip":[{"path":"/custom/weapon/blade/blood_blade","use":"wield"},{"path":"/custom/armor/feet/flying_boots","use":"wear"},{"path":"/custom/armor/cloth/red_cloth","use":"wear"},{"path":"/custom/armor/armor/raw_iron_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/captain_huang":{"id":"/custom/legacy_npc/captain_huang","file":"source/upstream/mudlib/custom/legacy_npc/captain_huang.c","name":"黃靖國","ids":["captain huang","captain","huang"],"long":"黃靖國近年來轉戰各地，積功無數，以勇猛及鐵槍威震四方，年僅三\n十而能榮膺總兵官要職，可說是少年有成。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":30,"gender":"male","title":"總兵","equip":[{"path":"/custom/weapon/pike/iron_pike","use":"wield"},{"path":"/custom/armor/hand/steel_bracers","use":"wear"},{"path":"/custom/zhenwu/obj/steel_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/chang_ba":{"id":"/custom/legacy_npc/chang_ba","file":"source/upstream/mudlib/custom/legacy_npc/chang_ba.c","name":"張霸","ids":["chang ba","chang","ba"],"long":"張霸乃是黑風寨的五頭目, 原為虎刀門中的好手, 平素行止不端\n, 於十數年前遭武林正道圍攻後消聲匿跡, 數個月後重現師門,\n盜走師門寶刀「虎紋刀」後投入黑風寨中, 目前是黑風寨的刀術\n教頭, 他仗恃著一手爐火純青的瘋虎刀法已是一流高手, 如今寶\n刀在手更如虎添翼, 近年來不少高手魂飛虎紋刀下, 在武林中已\n是惡名昭彰, 他正滿臉邪氣惡狠狠地盯著你。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":50,"gender":"male","title":"黑風寨五頭目","equip":[{"path":"/custom/armor/armor/shoulder_armor","use":"wear"},{"path":"/custom/armor/hand/skin_gloves","use":"wear"},{"path":"/custom/armor/cloth/yellow_suit","use":"wear"},{"path":"/custom/weapon/sword/daoist_sword","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/chaxigol":{"id":"/custom/legacy_npc/chaxigol","file":"source/upstream/mudlib/custom/legacy_npc/chaxigol.c","name":"查思古禮","ids":["chaxigol"],"long":"查思古禮是個留著大鬍子的外國人，身材相當高大，加上體型又胖\n，站在街上任何人都會忍不住多瞧幾眼。不過你不要小看他，查思\n古禮在天朝旅行多年，其武藝在南方一代也小有名氣。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":25,"gender":"male","title":null,"equip":[{"path":"/custom/armor/armor/side_armor","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin/west_street2",1]]},"/custom/legacy_npc/checker":{"id":"/custom/legacy_npc/checker","file":"source/upstream/mudlib/custom/legacy_npc/checker.c","name":"考核官","ids":["checker"],"long":"考核官坐在桌前，拿著硃砂筆評點著送來的奏摺。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":20,"gender":"male","title":null,"equip":[{"path":"/obj/area/obj/pen","use":"wield"},{"path":"/custom/armor/cloth/cyan_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/cheng_huai":{"id":"/custom/legacy_npc/cheng_huai","file":"source/upstream/mudlib/custom/legacy_npc/cheng_huai.c","name":"程槐","ids":["cheng huai","cheng","huai"],"long":"程槐看起來非常強壯, 他雙手上長滿了因長期握斧而長的厚繭, 背上還背著一\n柄重斧, 據說他年輕時曾經以一把利斧「驂龍翔」挑了一個山寨的土匪, 讓道\n上盜匪都聞之喪膽, 不過看他現在臉色不太好, 好像是身上受了重傷。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":25,"gender":"male","title":null,"equip":[{"path":"/custom/weapon/axe/wyvern_axe","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/chin_chao_tian":{"id":"/custom/legacy_npc/chin_chao_tian","file":"source/upstream/mudlib/custom/legacy_npc/chin_chao_tian.c","name":"秦朝天","ids":["chin chao tian","chin","tian"],"long":"一身草繩繫綁厚皮裘衣的高瘦大漢﹐由他一臉瘡疤褐黃的麻子臉看來﹐\n此人約莫四十來歲。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"male","title":null,"equip":[{"path":"/custom/armor/feet/straw_boots","use":"wear"},{"path":"/obj/area/obj/robe","use":"wear"},{"path":"/obj/armor/fur_hat","use":"wear"},{"path":"/obj/area/obj/broadaxe","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/chong_bai_hu":{"id":"/custom/legacy_npc/chong_bai_hu","file":"source/upstream/mudlib/custom/legacy_npc/chong_bai_hu.c","name":"崇白虎","ids":["chong bai-hu","chong","bai-hu"],"long":"一生都在追求完美的鑄刀技巧，為了能鑄出一把寶刀，不惜千里跋涉到奐族境\n內偷學手藝。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":35,"gender":"male","title":null,"equip":[{"path":"/custom/armor/waist/iron_girth","use":"wear"},{"path":"/custom/zhenwu/obj/steel_boots","use":"wear"},{"path":"/custom/armor/armor/tiger_plate","use":"wear"},{"path":"/custom/weapon/blade/blade_of_fire_spirit","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/chu_xang_when":{"id":"/custom/legacy_npc/chu_xang_when","file":"source/upstream/mudlib/custom/legacy_npc/chu_xang_when.c","name":"褚商魂","ids":["chu xang-when","chu","xang-when"],"long":"褚商魂是雪吟莊莊主的大弟子﹐也是他的養子﹐不但武藝出眾﹐而且\n寫得一手好字。雪吟莊作為當今的武林盟主，也有出售一些供江湖中\n各個幫會使用的物品，你可以用 list 指令查看。\n——\n褚商魂是雪吟莊莊主的大弟子﹐也是他的養子﹐不但武藝出眾﹐而且\n寫得一手好字。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":25,"gender":"male","title":"雪吟莊大弟子","equip":[{"path":"/custom/weapon/blade/white_blade","use":"wield"},{"path":"/d/lee/obj/yellow_jade_ring","use":"wear"},{"path":"/custom/armor/feet/flying_boots","use":"wear"},{"path":"/custom/armor/armor/white_rainbow_armor","use":"wear"},{"path":"/custom/armor/cloth/silk_cloth","use":"wear"},{"path":"/custom/weapon/blade/ghosts_blade","use":""}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/dong_fang_gu_ming":{"id":"/custom/legacy_npc/dong_fang_gu_ming","file":"source/upstream/mudlib/custom/legacy_npc/dong_fang_gu_ming.c","name":"東方孤冥","ids":["dong-fang gu ming","dong-fang","ming"],"long":"喜好習武﹐年輕時遊走江湖結識各派高手﹐雖然有家傳心法護身﹐卻苦於僅靠家\n傳劍法難以立足江湖。三十四歲那年﹐他巧得半頁陰心太妃﹐在幾位朋友的解說\n和指點下創出一套怪異的劍訣配合家傳的玄天劍法頗具威力。數年後﹐他聯絡當\n初幫他解說陰心太妃的朋友們創立玄天教。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":65,"gender":"male","title":"玄天教主","equip":[{"path":"/custom/armor/waist/white_jade_girth","use":"wear"},{"path":"/custom/armor/cloth/white_scholar_dress","use":"wear"},{"path":"/custom/armor/finger/han_jade_ring","use":"wear"},{"path":"/custom/weapon/sword/silver_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/du_feng_ling":{"id":"/custom/legacy_npc/du_feng_ling","file":"source/upstream/mudlib/custom/legacy_npc/du_feng_ling.c","name":"杜風凌","ids":["du feng ling","du","ling"],"long":"杜風凌本是西方大漠的巫首族人﹐自幼拜林遠為師﹐修習茅山道法。也許是\n因為天賦異常﹐入門十數年就熟練的掌握了茅山道法的精髓並將其融會貫通,\n漸漸將一些不受重視的小把戲發展起來﹐當時盛傳杜風凌將會是下任茅山的\n掌門人。怎料當時的茅山掌門人﹐林遠﹐為了追查茅山劍法竟然屍橫荒野﹐\n一時間茅山派一片大亂。不少人因鄙視杜風凌所擅長的『茅山奇術』竟然離\n開茅山自成流派﹐而杜風凌也因其家族牽扯到黃泉村一事﹐而不得不暫回西\n方大漠。當他返回天朝以後﹐無法說服他的師兄弟重歸茅山﹐便憤然再返大\n漠﹐借助他家族在大漠的勢力自創『幻霧觀』。此次不知是為何事﹐竟然又\n來到天朝境內。","weight":null,"value":null,"unit":null,"flags":["限平民"],"race":"malik","class":"taoist","level":40,"gender":"male","title":"幻霧觀觀主","equip":[{"path":"/custom/armor/cloth/green_robe","use":"wear"},{"path":"/custom/weapon/sword/peachwood_sword","use":"wield"},{"path":"/custom/armor/finger/han_jade_ring","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/lee/inn","1     // 幻霧觀觀主（使用者指示，2026-10-25）"]]},"/custom/legacy_npc/evil_spirit_of_storm":{"id":"/custom/legacy_npc/evil_spirit_of_storm","file":"source/upstream/mudlib/custom/legacy_npc/evil_spirit_of_storm.c","name":"墮落的風神","ids":["evil spirit of storm","evil","storm"],"long":"墮落的風神看起來沒有什麼特別。","weight":null,"value":null,"unit":null,"flags":[],"race":"avatar","class":"taoist","level":70,"gender":"female","title":null,"equip":[{"path":"/custom/weapon/sword/storm_lords_feather","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ghost_lord":{"id":"/custom/legacy_npc/ghost_lord","file":"source/upstream/mudlib/custom/legacy_npc/ghost_lord.c","name":"噬魂","ids":["ghost lord","ghost","lord"],"long":"噬魂，嗜吃魂，原是鬼王「顝蛪」一員魔將，論能力比十二鬼將更為強\n悍。但當鬼王「顝蛪」被封，噬魂異心即起！自立為鬼王，四處吞噬靈\n魂已增其法力。在一次跟地府鬼將的戰鬥中，戰敗被擒，給困在地獄十\n八層盡受苦刑。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":35,"gender":"male","title":"鬼王","equip":[{"path":"/custom/weapon/axe/eight_ghost_axe","use":"wield"},{"path":"/custom/armor/cloth/blood_stained_cloth","use":"wear"},{"path":"/custom/armor/armor/soul_lapis_lazuli_plate","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ghost_yaksa":{"id":"/custom/legacy_npc/ghost_yaksa","file":"source/upstream/mudlib/custom/legacy_npc/ghost_yaksa.c","name":"鬼夜叉","ids":["ghost yaksa","ghost","yaksa"],"long":"最低級的惡魔戰士﹐主要的任務是保衛夜神殿的安全。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":30,"gender":"male","title":null,"equip":[{"path":"/custom/weapon/blade/colosus_blade","use":"wield"},{"path":"/custom/armor/waist/water_dragon_girdle","use":"wear"},{"path":"/custom/armor/leg/bamboo_legs","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/gong_sun_wei":{"id":"/custom/legacy_npc/gong_sun_wei","file":"source/upstream/mudlib/custom/legacy_npc/gong_sun_wei.c","name":"公孫微","ids":["gong-sun wei","gong-sun","wei"],"long":"此人長得又高又瘦，皮包著骨頭，好象僵屍一樣。一雙小眼睛炯炯有神，正貪\n婪的盯著你看。","weight":null,"value":null,"unit":null,"flags":[],"race":"jiaojao","class":"thief","level":30,"gender":"male","title":null,"equip":[{"path":"/custom/armor/feet/dark_boots","use":"wear"},{"path":"/custom/armor/hand/dark_bracers","use":"wear"},{"path":"/custom/weapon/dagger/black_iron_dagger","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/gong_sun_zhi":{"id":"/custom/legacy_npc/gong_sun_zhi","file":"source/upstream/mudlib/custom/legacy_npc/gong_sun_zhi.c","name":"公孫志","ids":["gong-sun zhi","gong-sun","zhi"],"long":"公孫志是一個在江湖上沒甚麼名氣的老道。這並不是因為他的法力\n不及他人，而是由於他太過醉心與詩詞歌賦，以至於無瑕顧及江湖\n中的是是非非。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"taoist","level":20,"gender":"male","title":"靈雲觀道士","equip":[{"path":"/custom/armor/feet/straw_boots","use":"wear"},{"path":"/d/lee/obj/hemp_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/baihua/inn",1]]},"/custom/legacy_npc/guard":{"id":"/custom/legacy_npc/guard","file":"source/upstream/mudlib/custom/legacy_npc/guard.c","name":"衛兵","ids":["guard"],"long":"他是看守軍情庫的衛兵，從他身上的裝備以及眼睛裡不時流露出\n的精芒看來，你還是不要隨便惹他的好。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"soldier","level":20,"gender":"male","title":null,"equip":[{"path":"/custom/armor/feet/buskins","use":"wear"},{"path":"/custom/armor/waist/iron_girth","use":"wear"},{"path":"/custom/weapon/pike/huge_halberd","use":"wield"},{"path":"/custom/armor/head/iron_helmet","use":"wear"},{"path":"/custom/armor/armor/ring_mail","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/guard_of_hell":{"id":"/custom/legacy_npc/guard_of_hell","file":"source/upstream/mudlib/custom/legacy_npc/guard_of_hell.c","name":"土伯","ids":["guard of hell","guard","hell"],"long":"身高三十丈的黑色巨人﹐頭生雙角﹐腹成牛腹狀。相傳﹐土伯是幽都的\n守門者﹐終日驅趕百鬼﹐性情殘暴。","weight":null,"value":null,"unit":null,"flags":[],"race":"headless","class":"fighter","level":30,"gender":"male","title":null,"equip":[{"path":"/custom/weapon/whip/war_whip","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/han_jiang_hong":{"id":"/custom/legacy_npc/han_jiang_hong","file":"source/upstream/mudlib/custom/legacy_npc/han_jiang_hong.c","name":"韓江洪","ids":["han jiang hong","han","hong"],"long":"你面前的這位精神不振，一身是病的老者就是史部尚書韓江洪了，他不\n僅通曉天文地理，正史野傳，而且他的書法字畫也都是當今一絕，可謂\n是千金難求。近年來他的身體每況日下，若不是聖上屢次挽留，他可能\n早就告老還鄉，過著逗鵝戲竹的生活啦。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"scholar","level":20,"gender":"male","title":"史部尚書","equip":[{"path":"/custom/weapon/sword/jeweled_shortsword","use":"wield"},{"path":"/custom/weapon/sword/jade_sword","use":"wield"},{"path":"/d/lee/obj/crystal_ring","use":"wear"},{"path":"/custom/armor/feet/snakeskin_boots","use":"wear"},{"path":"/custom/armor/cloth/dragon_cloth","use":"wear"},{"path":"/custom/armor/head/jade_hat","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/han_long":{"id":"/custom/legacy_npc/han_long","file":"source/upstream/mudlib/custom/legacy_npc/han_long.c","name":"韓龍","ids":["han long","han","long"],"long":"韓龍四十二歲當上白虎堂知事，掌管各種情報的蒐集與分析。他\n也建立了一個龐大的情報網，把江湖中人每天所有大小事通通納\n入白虎堂的蒐集範圍。讓許多有意為惡的門派不敢輕舉妄動。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":30,"gender":"male","title":"虎刀門知事","equip":[{"path":"/custom/weapon/axe/axe_of_bloodmoon","use":"wield"},{"path":"/custom/armor/head/jade_hat","use":"wear"},{"path":"/custom/armor/cloth/dragon_cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/han_wen_suei":{"id":"/custom/legacy_npc/han_wen_suei","file":"source/upstream/mudlib/custom/legacy_npc/han_wen_suei.c","name":"韓文緒","ids":["han wen-suei","han","wen-suei"],"long":"韓文緒是喬陰縣城的都護衛，負責喬陰縣的軍務工作，他的武藝雖然還\n稱不上一流高手，但是家傳的韓家槍法倒也已有八九分火候，在江湖上\n頗有些名頭。","weight":null,"value":null,"unit":null,"flags":[],"race":"yenhold","class":"soldier","level":30,"gender":"male","title":"喬陰縣督護衛","equip":[{"path":"/d/snow/npc/obj/clothboot","use":"wear"},{"path":"/custom/armor/cloth/cyan_cloth","use":"wear"},{"path":"/custom/weapon/pike/thunder_pike","use":"wield"},{"path":"/custom/armor/head/battle_helm","use":"wear"},{"path":"/custom/armor/armor/battle_armor","use":"wear"},{"path":"/obj/cloth","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin/wgate",1]]},"/custom/legacy_npc/han_xiao":{"id":"/custom/legacy_npc/han_xiao","file":"source/upstream/mudlib/custom/legacy_npc/han_xiao.c","name":"韓笑","ids":["han xiao","han","xiao"],"long":"韓笑自幼極具習武天賦而且練功也很勤，所以在二十多歲時就已是名震武\n林的好手。虎刀門前掌門去世時不顧眾人反對，毅然將掌門之位傳給了當\n時只有二十八歲的韓笑，此事在武林之上也引起不小的震動。如今韓笑的\n內功刀法比起六年前更為精純，成為武林之中公認的最年輕的武學大師。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":60,"gender":"female","title":"虎刀門掌門","equip":[{"path":"/custom/armor/feet/embroidery_boots","use":"wear"},{"path":"/custom/armor/waist/girl_girth","use":"wear"},{"path":"/custom/armor/finger/bloodjade_ring","use":"wear"},{"path":"/custom/armor/armor/white_dragon_plate","use":"wear"},{"path":"/custom/armor/cloth/tigerish_robe","use":"wear"},{"path":"/custom/armor/neck/tiger_necklace","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/hell_soldier":{"id":"/custom/legacy_npc/hell_soldier","file":"source/upstream/mudlib/custom/legacy_npc/hell_soldier.c","name":"地府鬼卒","ids":["hell soldier","hell","soldier"],"long":"一個青面獠牙的鬼卒﹐雙眼大如銅鈴﹐身上穿著有如陽間官兵的衣服。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":25,"gender":"male","title":null,"equip":[{"path":"/custom/armor/armor/iron_torso","use":"wear"},{"path":"/custom/weapon/pike/iron_fork","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/hsiao_lang_sheng":{"id":"/custom/legacy_npc/hsiao_lang_sheng","file":"source/upstream/mudlib/custom/legacy_npc/hsiao_lang_sheng.c","name":"蕭朗生","ids":["hsiao lang-sheng","hsiao","lang-sheng"],"long":"蕭朗生是天邪國小有名氣的劍客﹐一手追魂劍法輕靈狠辣﹐算得是武林\n中一個人物﹐但是自從半年前在一次仇家的突襲中失去了妻子﹐就變得\n性情十分乖戾﹐和從前判若兩人﹐如果你不想惹禍上身的話﹐最好離他\n遠一點。\n——\n蕭朗生是天邪國小有名氣的劍客﹐一手平波劍法輕靈狠辣﹐算得是武林\n中一個人物﹐但是自從半年前在一次仇家的突襲中失去了妻子﹐就變得\n性情十分乖戾﹐和從前判若兩人﹐如果你不想惹禍上身的話﹐最好離他\n遠一點。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":50,"gender":"male","title":null,"equip":[{"path":"/custom/armor/head/white_helmet","use":"wear"},{"path":"/custom/armor/hand/snake_bracers","use":"wear"},{"path":"/custom/armor/armor/padded_armor","use":"wear"},{"path":"/custom/weapon/sword/sword_of_black_justice","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[["/d/qiaoyin/pawnshop",1]]},"/custom/legacy_npc/hsu_yen_chih":{"id":"/custom/legacy_npc/hsu_yen_chih","file":"source/upstream/mudlib/custom/legacy_npc/hsu_yen_chih.c","name":"許彥之","ids":["hsu yen-chih","hsu","yen-chih"],"long":"許彥之是季縣虎刀門的弟子﹐虎刀門以善使刀聞名﹐這次來到雪\n吟山莊﹐倒不是為了參加英雄大會﹐而是想來打探一下消失了多\n年的軒轅龍骨刀是否真的被藏在了雪吟山莊。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":20,"gender":"male","title":null,"equip":[{"path":"/obj/area/obj/leather_boot","use":"wear"},{"path":"/custom/armor/waist/lion_belt","use":"wear"},{"path":"/custom/armor/armor/heart_armor","use":"wear"},{"path":"/obj/area/obj/kris","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/hua_xing":{"id":"/custom/legacy_npc/hua_xing","file":"source/upstream/mudlib/custom/legacy_npc/hua_xing.c","name":"花興","ids":["hua xing","hua","xing"],"long":"江湖中有名的採花大盜，凡是被他遇到的稍有姿色的女子，無一倖免，均是\n先奸後殺，武林中人全都對他恨之入骨，只是他輕功甚高，多次死裏逃生後\n便沒了消息，不知為何來孟家莊。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":25,"gender":"male","title":null,"equip":[{"path":"/custom/weapon/dagger/butterfly_stiletto","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/huang":{"id":"/custom/legacy_npc/huang","file":"source/upstream/mudlib/custom/legacy_npc/huang.c","name":"黃十四娘","ids":["huang"],"long":"一個膚色黝黑的女子，年紀似乎不到三十，但是卻滿頭白髮。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"thief","level":40,"gender":"female","title":"隱教殺手","equip":[{"path":"/custom/armor/feet/soft_leather_boots","use":"wear"},{"path":"/custom/armor/armor/shapeless_heartguard","use":"wear"},{"path":"/custom/armor/cloth/black_robe","use":"wear"},{"path":"/custom/weapon/dagger/dire_spike","use":"wield"},{"path":"/custom/armor/neck/dark_necklace","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/huang_tien_ba":{"id":"/custom/legacy_npc/huang_tien_ba","file":"source/upstream/mudlib/custom/legacy_npc/huang_tien_ba.c","name":"黃天霸","ids":["huang tien-ba","huang","tien-ba"],"long":"黃天霸是江南有名的鏢頭，保過很多趟大鏢，從來沒有出過什麼岔子。一手\n七七四十九路霸王刀招獨豎一格，人家都尊稱他為【霸王刀】，平時為人非\n常豪爽，有困難的話可以來他這，他會盡力去幫你解決。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":30,"gender":"male","title":"黃家鏢局總鏢頭","equip":[{"path":"/custom/armor/finger/golden_ring","use":"wear"},{"path":"/custom/armor/armor/studded_armor","use":"wear"},{"path":"/custom/armor/head/golden_feather_helm","use":"wear"},{"path":"/custom/armor/cloth/golden_robe","use":"wear"},{"path":"/custom/weapon/blade/blade_of_nine_rings","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/island_master":{"id":"/custom/legacy_npc/island_master","file":"source/upstream/mudlib/custom/legacy_npc/island_master.c","name":"邯逸山","ids":["island master","island","master"],"long":"你眼前這位正是當初名震江湖劍斬神猿的陷空島島主, 他正對你微笑著!","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":40,"gender":"male","title":"陷空島島主","equip":[{"path":"/custom/armor/feet/flying_boots","use":"wear"},{"path":"/d/wutang/obj/blue_cloth","use":"wear"},{"path":"/custom/armor/armor/monkey_armor","use":"wear"},{"path":"/custom/weapon/sword/white_dragon_fang","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/jen_commando":{"id":"/custom/legacy_npc/jen_commando","file":"source/upstream/mudlib/custom/legacy_npc/jen_commando.c","name":"任常恩","ids":["jen commando","jen","commando"],"long":"任常恩是振武軍營的校尉，這次因為青邪宮聚集了許多江湖武人朝廷擔心發\n生事故，因此命他選派幾名好手前來，表面上是朝廷重視這次聚會，但是所\n有與會的人都知道他是朝廷暗中監視此間武人的密使。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"soldier","level":25,"gender":"male","title":"振武軍營校尉","equip":[{"path":"/custom/weapon/blade/snow_blade","use":"wield"},{"path":"/custom/armor/finger/ring_of_mighty_lord","use":"wear"},{"path":"/custom/armor/head/royal_helmet","use":"wear"},{"path":"/custom/armor/armor/iron_armor","use":"wear"},{"path":"/custom/armor/cloth/cyan_cloth","use":"wear"},{"path":"/custom/armor/hand/steel_bracers","use":"wear"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/jia_qiu_yu":{"id":"/custom/legacy_npc/jia_qiu_yu","file":"source/upstream/mudlib/custom/legacy_npc/jia_qiu_yu.c","name":"賈秋雨","ids":["jia qiu yu","jia","yu"],"long":"他是一位方臉大耳﹐濃眉高顴的俊挺少年﹐年紀大約十七八歲﹐一身白\n綃般的素淨長袍衣帶飛揚﹐背懸六尺長劍﹐腰繫翡翠白玉佩﹐風度翩翩\n﹐有如玉樹臨風。","weight":null,"value":null,"unit":null,"flags":[],"race":"human","class":"fighter","level":10,"gender":"male","title":null,"equip":[{"path":"/obj/area/obj/longsword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/jing_yu_tao":{"id":"/custom/legacy_npc/jing_yu_tao","file":"source/upstream/mudlib/custom/legacy_npc/jing_yu_tao.c","name":"景愈濤","ids":["jing yu tao","jing","tao"],"long":"景愈濤，一個頻繁出現在武林傳奇中的人物。三十年前大破冷梅劍嵐\n若刀，二十年前與柳東蘆論劍靈狐頂，十余年前獨闖青邪尋殘蟻 ...\n你萬萬想不到的是，他竟然是五堂鎮望族景家的三公子，雖然已入中\n年但是其瀟灑的舉止，讓人迷戀的風度仍是不減當年。據說，冷梅莊\n莊主梅影風的夫人是他的義妹，而他當年也正是為了他妹妹才在梅影\n風和葉風兩人面前一顯身手。","weight":null,"value":null,"unit":null,"flags":[],"race":"yaksa","class":"fighter","level":70,"gender":"male","title":"古劍門掌門","equip":[{"path":"/custom/armor/finger/white_ring","use":"wear"},{"path":"/custom/armor/feet/boots_of_cleanse","use":"wear"},{"path":"/custom/armor/cloth/silver_cloth","use":"wear"},{"path":"/custom/armor/waist/silver_girth","use":"wear"},{"path":"/custom/armor/armor/white_dragon_plate","use":"wear"},{"path":"/custom/weapon/sword/flurry_sword","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/kao_fon":{"id":"/custom/legacy_npc/kao_fon","file":"source/upstream/mudlib/custom/legacy_npc/kao_fon.c","name":"高風","ids":["kao fon","kao","fon"],"long":"高風乃是百花村的一位高手，因為其功夫高強，被黃天霸延攬為鏢頭，他一手\n槍法耍得虎虎生風，令綠林大盜聞風喪膽。他還可以負責幫忙打聽江湖人物的\n下落，只是可信度嘛 ... 嘿嘿嘿。","weight":null,"value":null,"unit":null,"flags":[],"race":"headless","class":"fighter","level":20,"gender":"male","title":"黃家鏢局鏢頭","equip":[{"path":"/custom/weapon/pike/tiger_pike","use":"wield"}],"skills":[],"wander":false,"ghost":false,"rooms":[]},"/custom/legacy_npc/ku_wu_wang":{"id":"/custom/legacy_npc/ku_wu_wang","file":"source/upstream/mudlib/custom/legacy_npc/ku_wu_wang.c","name":"哭無望","ids
