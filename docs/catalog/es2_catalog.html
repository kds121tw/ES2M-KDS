erside_n2":{"id":"/d/lee/riverside_n2","file":"source/upstream/mudlib/d/lee/riverside_n2.c","short":"溪邊小路","long":"小路沿著溪岸南北延伸，腳下散布著細碎石子。溪水貼著村東流過，附近草木因水氣而顯得格外茂盛。幾株垂柳沿岸而生，枝條輕拂水面，蕩起一圈圈細小的漣漪，替這段路添了幾分靜謐的氣氛。","exits":{"south":"/d/lee/riverside_n1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[0,-2,0]},"/d/lee/riverside_s":{"id":"/d/lee/riverside_s","file":"source/upstream/mudlib/d/lee/riverside_s.c","short":"溪邊小路","long":"溪邊小路到了村東門附近，西面可回村口大門，南北則沿著溪岸延伸。水聲在這一帶十分清楚。幾名村婦聚在溪邊，一邊浣洗衣物一邊閒話家常，笑聲不時隨著水聲飄散開來，是這一帶少見的熱鬧光景。","exits":{"west":"/d/lee/gate_e","north":"/d/lee/riverside_n1","south":"/d/lee/creek","southwest":"/d/lee/watermelon_n3"},"objects":{"/d/lee/npc/woman":4},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[0,0,0]},"/d/lee/school":{"id":"/d/lee/school","file":"source/upstream/mudlib/d/lee/school.c","short":"私塾","long":"私塾裡整齊排著舊木桌椅，牆邊堆著幾冊翻得起毛的書本。白日常有孩童朗讀文章，窗外便是通往廣場的石子路。牆上掛著一幅「有教無類」的字幅，墨跡雖已略顯陳舊，仍看得出當年書寫時的用心。案頭擺著一方硯台與幾支毛筆，牆邊立著一根戒尺，看來平日規矩管教不算鬆散。","exits":{"east":"/d/lee/nroad3"},"objects":{"/d/lee/npc/lee_hsu_hsien":1,"/d/lee/npc/child":3},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-6,-1,0]},"/d/lee/shrine":{"id":"/d/lee/shrine","file":"source/upstream/mudlib/d/lee/shrine.c","short":"醫館","long":"這裡是聶晟看診行醫的醫館，四壁的木架上整齊排著大大小小的藥罐，靠窗的長案上攤著幾本醫書與銀針，\n一旁垂著布簾，隔出裡間看診的地方。空氣中瀰著淡淡的藥草香。十多年前村裡爆發一場怪病，便是聶晟\n在此治好了村民，李員外因此請他留下，成為村中的大夫。","exits":{"south":"/d/lee/wroad3","in":"/d/lee/nie_backroom"},"objects":{"/d/lee/npc/nee_cheng":1,"/d/lee/npc/herb_boy":2},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-7,-1,0]},"/d/lee/square_c":{"id":"/d/lee/square_c","file":"source/upstream/mudlib/d/lee/square_c.c","short":"廣場中央","long":"這裡是李家村最容易聚集人群的中央廣場，四周道路交錯。孩童常在空地追逐，村民也會停下交換消息或談論村中近事。廣場中央立著一口老水井，井欄被繩索磨出一道道深痕，是全村人取水的地方。井邊常有婦人打水閒聊，孩童們則繞著井欄追逐嬉戲，笑鬧聲響徹整個廣場。","exits":{"west":"/d/lee/square_s","north":"/d/lee/square_e","south":"/d/lee/street1"},"objects":{"/d/lee/npc/child":3,"/d/lee/obj/well":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,1,0]},"/d/lee/square_e":{"id":"/d/lee/square_e","file":"source/upstream/mudlib/d/lee/square_e.c","short":"廣場","long":"廣場向東西兩側伸展，附近商販和村民常在此碰面交換消息。往南可到廣場中央，往北可回村北道路。地面鋪著大小不一的石板，縫隙間長著幾叢野草，倒也不影響往來行走。","exits":{"west":"/d/lee/square_w","east":"/d/lee/eroad1","south":"/d/lee/square_c"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,0,0]},"/d/lee/square_s":{"id":"/d/lee/square_s","file":"source/upstream/mudlib/d/lee/square_s.c","short":"廣場","long":"這片廣場位在村中心偏南的位置，北面接著村中主路，東邊就是廣場中央。空地邊緣堆著幾捆備用的木料，像是村里修繕房舍時剩下的，平時倒也沒人特地搬動整理清掃。","exits":{"north":"/d/lee/square_w","east":"/d/lee/square_c"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,1,0]},"/d/lee/square_w":{"id":"/d/lee/square_w","file":"source/upstream/mudlib/d/lee/square_w.c","short":"廣場","long":"這片空地是村民日常往來與歇腳的地方，地面被踩得十分結實。北面連著私塾附近的道路，南面還有另一片廣場。空地一角擺著幾張長凳，木質已經有些發黑，看得出是村里人常年歇腳留下的痕跡。","exits":{"north":"/d/lee/nroad3","west":"/d/lee/wroad4","east":"/d/lee/square_e","south":"/d/lee/square_s"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-5,0,0]},"/d/lee/street1":{"id":"/d/lee/street1","file":"source/upstream/mudlib/d/lee/street1.c","short":"街道","long":"村中央往南的街道比石子路平整些，兩側屋舍緊靠。西側就是李記當鋪，南北來往的人多半從這裡穿過。屋簷下掛著幾盞燈籠，入夜後會點起微弱的燈火，照亮這段人來人往的街道。","exits":{"west":"/d/lee/pawnshop","north":"/d/lee/square_c","south":"/d/lee/street2","east":"/d/lee/watermelon_s1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,2,0]},"/d/lee/street2":{"id":"/d/lee/street2","file":"source/upstream/mudlib/d/lee/street2.c","short":"街道","long":"街道繼續向南延伸，北面通往村中央，南面就是村口大門。西側的小旅店常傳出店小二招呼客人的聲音。街邊擺著一個小攤子，賣冰糖葫蘆的小販正吆喝著招攬生意，紅通通的糖葫蘆插在草把上，看著就讓人食指大動，不少路過的孩童都忍不住多看兩眼。","exits":{"north":"/d/lee/street1","west":"/d/lee/inn","south":"/d/lee/gate_s"},"objects":{"/d/lee/npc/hawthorn_seller":1},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-4,3,0]},"/d/lee/watermelon_n1":{"id":"/d/lee/watermelon_n1","file":"source/upstream/mudlib/d/lee/watermelon_n1.c","short":"西瓜田","long":"田畦裡種著一排排西瓜藤，寬大的葉片鋪滿泥地。農人沿著田埂巡看瓜苗，防著路人隨手摘走尚未成熟的西瓜。幾顆碩大的西瓜半埋在泥土裡，表皮泛著油亮的青綠色，看著十分誘人。田埂邊插著一根根竹竿，上頭綁著幾條破布條隨風擺動，是農人用來嚇唬偷嘴的鳥雀。","exits":{"east":"/d/lee/watermelon_n2","south":"/d/lee/watermelon_s1"},"objects":{"/d/lee/npc/farmer":3},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-3,1,0]},"/d/lee/watermelon_n2":{"id":"/d/lee/watermelon_n2","file":"source/upstream/mudlib/d/lee/watermelon_n2.c","short":"西瓜田","long":"大片瓜藤沿田埂向東展開，葉下偶爾露出圓滾滾的西瓜。日照充足時，田間熱氣與泥土氣味格外明顯。幾名農人戴著斗笠，彎腰仔細查看瓜藤的長勢，時不時直起身子擦一把汗，對這片瓜田的收成顯然十分上心。","exits":{"west":"/d/lee/watermelon_n1","east":"/d/lee/watermelon_n3","south":"/d/lee/watermelon_s2"},"objects":{"/d/lee/npc/farmer":3},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-2,1,0]},"/d/lee/watermelon_n3":{"id":"/d/lee/watermelon_n3","file":"source/upstream/mudlib/d/lee/watermelon_n3.c","short":"西瓜田","long":"這片西瓜田已靠近村東溪流，田邊泥土較濕，偶爾能聽見溪水聲。田埂向西與其他瓜田相連。因為靠近水源，這裡的瓜藤長得格外茂盛，葉片肥厚，藤蔓幾乎要蔓過窄窄的田埂。","exits":{"west":"/d/lee/watermelon_n2","south":"/d/lee/watermelon_s3","northeast":"/d/lee/riverside_s","east":"/d/lee/creek"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-1,1,0]},"/d/lee/watermelon_s1":{"id":"/d/lee/watermelon_s1","file":"source/upstream/mudlib/d/lee/watermelon_s1.c","short":"西瓜田","long":"田裡瓜藤交錯，農人留下的腳印沿著窄窄田埂延伸。北面與另一片瓜田緊緊相連，西面就靠近村中央街道。田埂邊散落著幾片乾枯的瓜葉，踩上去發出細碎的聲響，倒也給這片安靜的田地添了幾分生氣。","exits":{"west":"/d/lee/street1","east":"/d/lee/watermelon_s2","north":"/d/lee/watermelon_n1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-3,2,0]},"/d/lee/watermelon_s2":{"id":"/d/lee/watermelon_s2","file":"source/upstream/mudlib/d/lee/watermelon_s2.c","short":"西瓜田","long":"一畦畦西瓜向東西排列，部分瓜實已長得相當飽滿。田間沒有遮蔭，午後常能感到土地散出的熱氣。幾隻蝴蝶在瓜藤間翩翩飛舞，偶爾停在花朵上歇息，替這片單調的田地增添了幾分生趣。","exits":{"west":"/d/lee/watermelon_s1","east":"/d/lee/watermelon_s3","north":"/d/lee/watermelon_n2"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-2,2,0]},"/d/lee/watermelon_s3":{"id":"/d/lee/watermelon_s3","file":"source/upstream/mudlib/d/lee/watermelon_s3.c","short":"西瓜田","long":"李家村東南側的瓜田延伸到溪邊附近，水氣讓此處土壤較為鬆軟。沿田埂可回到西面的其他瓜田。田邊立著一座簡陋的稻草人，衣衫破舊，隨風輕輕晃動，多少能唬住幾隻膽小的鳥雀。","exits":{"west":"/d/lee/watermelon_s2","north":"/d/lee/watermelon_n3"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-1,2,0]},"/d/lee/wroad1":{"id":"/d/lee/wroad1","file":"source/upstream/mudlib/d/lee/wroad1.c","short":"石子路","long":"這段石子路緊靠西村口，路旁泥地上留著車輪與牲口腳印。向東繼續走可以深入李家村，向西便是村口大門。路邊立著一塊簡陋的木牌，寫著「小心牲口」四個字，字跡歪斜，倒也透著幾分鄉野的樸拙。","exits":{"west":"/d/lee/gate_w","east":"/d/lee/wroad2"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-9,0,0]},"/d/lee/wroad2":{"id":"/d/lee/wroad2","file":"source/upstream/mudlib/d/lee/wroad2.c","short":"石子路","long":"石子路穿過幾戶人家之間，北邊有獵戶住處，南邊則是農家院落。村民推著小車往來，路面十分平實。路旁堆著幾張晾曬的獸皮，散發著淡淡的皮革氣味，看得出這一帶住的多是靠山吃飯的人家。","exits":{"west":"/d/lee/wroad1","east":"/d/lee/wroad3","north":"/d/lee/hunter","south":"/d/lee/farm_w1"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-8,0,0]},"/d/lee/wroad3":{"id":"/d/lee/wroad3","file":"source/upstream/mudlib/d/lee/wroad3.c","short":"石子路","long":"村西的石子路在這裡較寬，北側靠近醫館，南側仍是農家。向東再走便能抵達村中廣場。路面因為往來就診的村民較多，被踩得格外平整，偶爾能聞到醫館飄來的淡淡藥香，混著農家的泥土氣息。","exits":{"west":"/d/lee/wroad2","east":"/d/lee/wroad4","north":"/d/lee/shrine","south":"/d/lee/farm_w2"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-7,0,0]},"/d/lee/wroad4":{"id":"/d/lee/wroad4","file":"source/upstream/mudlib/d/lee/wroad4.c","short":"石子路","long":"這段石子路夾在廣場與醫館一帶之間，路面同樣鋪著碎石，偶有村民往來。兩側種著幾株低矮的灌木，替過路人擋去了些許日頭，走起來倒也不算難受。","exits":{"east":"/d/lee/square_w","west":"/d/lee/wroad3"},"objects":{},"special":[],"area":"李家村","layer":null,"areaKey":"李家村","pos":[-6,0,0]},"/d/oldpine/bandit_clearing":{"id":"/d/oldpine/bandit_clearing","file":"source/upstream/mudlib/d/oldpine/bandit_clearing.c","short":"空地","long":"迷霧森林西南角的一塊空地，地上的草被踩得東倒西歪，幾根削尖的木樁斜插在地上，木樁上還掛著破碎的衣物。空地邊緣堆著幾個空酒罈，一面破舊的布旗插在樹上，旗上歪歪斜斜地寫著一個「寨」字。看來老松林的土匪也把手伸進了這片森林。往東北可以回到矮樹叢。","exits":{"northeast":"/d/oldpine/shrubs"},"objects":{"/d/oldpine/npc/bandit":3},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[2,4,0]},"/d/oldpine/bear_cave":{"id":"/d/oldpine/bear_cave","file":"source/upstream/mudlib/d/oldpine/bear_cave.c","short":"山洞","long":"一個陰暗潮濕的山洞，洞頂不時滴下冰涼的水珠，空氣中瀰漫著一股濃重的腥臊味。地上散落著被啃得乾乾淨淨的獸骨，其中似乎還混著幾根人骨，角落裡鋪著一堆被壓扁的乾草，看起來是某種大型野獸的窩。洞口透進一點微光，外頭就是那片比人還高的草叢。","exits":{"out":"/d/oldpine/grass2"},"objects":{"/d/oldpine/npc/wild_bear":1},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[9,2,0]},"/d/oldpine/beast_trail":{"id":"/d/oldpine/beast_trail","file":"source/upstream/mudlib/d/oldpine/beast_trail.c","short":"獸徑","long":"一條野獸踩出來的狹窄小徑，兩旁的灌木被撞得東倒西歪，枝條上勾著幾撮粗硬的黑毛。泥地上的腳印又大又深，越往東走越密集，空氣中還飄著一股野獸的騷味。附近的樹幹上有幾道深深的抓痕，高度竟比人還高。往西南可以回到樹林，往東則是一面山壁。","exits":{"southwest":"/d/oldpine/wood1","east":"/d/oldpine/cave_mouth"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[5,1,0]},"/d/oldpine/cave1":{"id":"/d/oldpine/cave1","file":"source/upstream/mudlib/d/oldpine/cave1.c","short":"山洞","long":"洞內比想像中寬敞，岩壁上長著一層濕滑的青苔，從洞口透進來的光線只能照亮幾步遠。地上鋪著一層乾草和落葉，踩上去軟綿綿的，還混著一股淡淡的奶腥味。洞穴往東和往南延伸，深處不時傳來窸窣的聲響和小獸的哼叫聲。身後的洞口透進一點天光，那是唯一的出路。","exits":{"east":"/d/oldpine/cave2","south":"/d/oldpine/cave3","out":"/d/oldpine/cave_mouth"},"objects":{"/d/oldpine/npc/little_bear":2},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[7,1,0]},"/d/oldpine/cave2":{"id":"/d/oldpine/cave2","file":"source/upstream/mudlib/d/oldpine/cave2.c","short":"山洞","long":"山洞的東側，岩壁上布滿了一道道爪痕，像是有野獸經常在此磨爪。角落裡堆著一些被掏空的蜂巢，蜂蠟和蜂蜜沾了一地，引來一群小蟲嗡嗡飛舞。洞頂有一道細細的裂縫，透進一縷微光，正好照在地上一灘渾濁的積水上。往西可以回到洞口附近，往南通往更深的地方。","exits":{"west":"/d/oldpine/cave1","south":"/d/oldpine/cave_deep"},"objects":{"/d/oldpine/npc/little_bear":3},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[8,1,0]},"/d/oldpine/cave3":{"id":"/d/oldpine/cave3","file":"source/upstream/mudlib/d/oldpine/cave3.c","short":"山洞","long":"洞穴在這裡低了下來，得彎著腰才能前進。地上散落著被咬碎的骨頭和魚鱗，空氣又悶又臭，讓人幾乎喘不過氣。岩壁的凹陷處被扒成了一個淺淺的窩，裡面鋪著柔軟的獸毛，摸上去還帶著餘溫。往北可以回到洞口附近，往東則傳來更粗重的喘息聲。","exits":{"north":"/d/oldpine/cave1","east":"/d/oldpine/cave_deep"},"objects":{"/d/oldpine/npc/little_bear":3},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[7,2,0]},"/d/oldpine/cave_deep":{"id":"/d/oldpine/cave_deep","file":"source/upstream/mudlib/d/oldpine/cave_deep.c","short":"山洞深處","long":"山洞的最深處，空間突然開闊起來，洞頂高得看不見，四周的岩壁上掛著水珠，在黑暗中閃著微光。地上散落著大量獸骨，還有幾件破爛的衣物和一只生鏽的鐵鍋，不知是哪個倒楣的獵人留下的。洞的一角有一塊巨大的石頭，石面上有幾處被踩出來的凹痕，看起來可以攀爬上去。","exits":{"north":"/d/oldpine/cave2","west":"/d/oldpine/cave3"},"objects":{"/d/oldpine/npc/little_bear":2,"/d/oldpine/npc/big_bear":1},"special":[{"cmd":"climb 石頭","to":"/d/oldpine/ledge"}],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[8,2,0]},"/d/oldpine/cave_mouth":{"id":"/d/oldpine/cave_mouth","file":"source/upstream/mudlib/d/oldpine/cave_mouth.c","short":"山洞口","long":"獸徑的盡頭是一面陡峭的山壁，山壁下有一個黑漆漆的洞口，洞口的岩石被磨得光滑，顯然常有東西進出。洞口前散落著吃剩的蜂巢和魚骨，還有一些被扒開的泥土。洞裡隱約傳出低沉的鼾聲和咕嚕聲，讓人遲疑該不該進去....","exits":{"west":"/d/oldpine/beast_trail"},"objects":{},"special":[{"cmd":"enter","to":"/d/oldpine/cave1"}],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[6,1,0]},"/d/oldpine/clearing_n":{"id":"/d/oldpine/clearing_n","file":"source/upstream/mudlib/d/oldpine/clearing_n.c","short":"空地","long":"老松林北緣的一塊空地，四周的老松被人砍倒了幾棵，留下一圈高低不齊的樹樁，正好圍出一片平坦的泥地。地上滿是凌亂的腳印，幾棵松樹的樹幹上留著深淺不一的刀痕，有些痕跡又深又齊，像是有人經常在這裡練刀，而且刀法十分了得。林風穿過松針沙沙作響，四下顯得格外清靜。往南可以走進一片及腰的草叢。","exits":{"south":"/d/oldpine/grass1"},"objects":{"/d/oldpine/npc/kao_shen":1},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[8,1,0]},"/d/oldpine/clearing_w":{"id":"/d/oldpine/clearing_w","file":"source/upstream/mudlib/d/oldpine/clearing_w.c","short":"林間空地","long":"林子中間一塊不大的空地，中央用石頭圍了個火堆，裡面的灰燼還帶著餘溫，旁邊散落著酒罈的碎片和吃剩的獸骨。幾棵松樹的枝椏上掛著破爛的衣物，樹下堆著好幾個被扯開的包袱，裡頭的東西早被搜刮一空，看來是土匪臨時落腳的地方。往北可以回到林子邊緣，往東南則有一條小路穿過樹林。","exits":{"north":"/d/oldpine/entrance","southeast":"/d/oldpine/path0"},"objects":{"/d/oldpine/npc/bandit":2},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[0,1,0]},"/d/oldpine/crossing":{"id":"/d/oldpine/crossing","file":"source/upstream/mudlib/d/oldpine/crossing.c","short":"空地","long":"一塊地面被踩得光禿禿的空地，四周的松樹上綁著幾根斷掉的繩子，地上散落著被翻得亂七八糟的行李和撕破的衣物，看來不久前才有旅人在這裡遭到洗劫。這塊空地是老松林裡幾條小路的交會處，往北、往西、往西南都有路通往林中，往東走則是一片霧氣瀰漫的森林。","exits":{"north":"/d/oldpine/forest_w","west":"/d/oldpine/path2","east":"/d/oldpine/mist_entrance","southwest":"/d/oldpine/hideout"},"objects":{"/d/oldpine/npc/bandit_minion":1,"/d/oldpine/npc/injured_traveller":1},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[4,3,0]},"/d/oldpine/entrance":{"id":"/d/oldpine/entrance","file":"source/upstream/mudlib/d/oldpine/entrance.c","short":"老松林","long":"出了雪亭鎮往東南不遠，便是這片綿延數里的老松林。高大的松樹一株挨著一株，枝葉遮天，即使是正午，林子裡也顯得陰暗。這裡原是雪亭鎮往來喬陰的捷徑，近來卻因為土匪出沒，旅人多半寧可繞道五堂鎮。路旁立著一塊被風雨侵蝕的木牌，上頭的字跡已經模糊難辨。往西北可以回到雪亭鎮，往南則有一條小路深入林中。","exits":{"northwest":"/d/snow/sgate","south":"/d/oldpine/clearing_w"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[0,0,0]},"/d/oldpine/forest_n1":{"id":"/d/oldpine/forest_n1","file":"source/upstream/mudlib/d/oldpine/forest_n1.c","short":"樹林","long":"松林在這裡長得特別茂密，樹與樹之間的空隙只容一人側身通過，地上的松針積了厚厚一層，踩上去軟綿綿的，沒有半點聲響。灌木叢後隱約有被人踩平的痕跡，旁邊還丟著幾根啃過的雞骨頭和一個空酒葫蘆，看來常有人躲在這裡守株待兔。往東樹林延伸開去，往西南則有一條被人踩出來的小徑。","exits":{"east":"/d/oldpine/forest_n2","southwest":"/d/oldpine/forest_w"},"objects":{"/d/oldpine/npc/bandit":2},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[5,1,0]},"/d/oldpine/forest_n2":{"id":"/d/oldpine/forest_n2","file":"source/upstream/mudlib/d/oldpine/forest_n2.c","short":"樹林","long":"一片幽靜的松林，粗大的樹幹上爬滿了青苔，偶爾有幾隻野鳥在枝頭吱吱喳喳地叫著，又倏地飛走。林間沒有像樣的路，只有前人砍斷的枝條和繫在樹上的布條指引方向，布條早已褪色，在風中無力地飄動著。往東、往西都還是一眼望不到盡頭的樹林。","exits":{"west":"/d/oldpine/forest_n1","east":"/d/oldpine/forest_n3"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[6,1,0]},"/d/oldpine/forest_n3":{"id":"/d/oldpine/forest_n3","file":"source/upstream/mudlib/d/oldpine/forest_n3.c","short":"樹林","long":"這裡的松樹稍微稀疏了些，陽光從枝葉的縫隙灑下來，在地上投出斑駁的光影。東北方的林子後面不時傳來刀刃劈開空氣的呼呼聲；東南方的地勢漸漸低下去，長滿了半人高的雜草。往西則是更深的松林，林子裡靜得只剩下自己的腳步聲。","exits":{"west":"/d/oldpine/forest_n2","southeast":"/d/oldpine/grass1"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[7,1,0]},"/d/oldpine/forest_w":{"id":"/d/oldpine/forest_w","file":"source/upstream/mudlib/d/oldpine/forest_w.c","short":"樹林","long":"高大的老松將天空遮得只剩下零星幾點光亮，林中瀰漫著一股松脂的清香。一棵被雷劈倒的大松橫躺在地上，樹身早已腐朽中空，幾朵白色的菇菌從裂縫裡冒出頭來，倒下的樹幹旁長出了一圈嫩綠的小松苗。往東北可以穿過樹林，往南不遠處就是一塊較為開闊的空地。","exits":{"northeast":"/d/oldpine/forest_n1","south":"/d/oldpine/crossing"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[4,2,0]},"/d/oldpine/glade":{"id":"/d/oldpine/glade","file":"source/upstream/mudlib/d/oldpine/glade.c","short":"林間空地","long":"迷霧森林中一塊難得開闊的空地，霧氣在這裡變得稀薄，抬頭還能望見一角灰濛濛的天空。空地西邊有一間冒著炊煙的野店，幾條小路從這裡向四方延伸，是林中往來的人必經之處。空地中央有一截被砍平的大樹樁，上面刻滿了旅人留下的名字。往西是野店，往北、西北、東、南都有路通往森林各處。","exits":{"west":"/d/oldpine/inn","north":"/d/oldpine/mist4","northwest":"/d/oldpine/mist3","east":"/d/oldpine/wood1","south":"/d/oldpine/shrubs"},"objects":{"/d/oldpine/npc/lin_yuchan":1},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[3,2,0]},"/d/oldpine/grass1":{"id":"/d/oldpine/grass1","file":"source/upstream/mudlib/d/oldpine/grass1.c","short":"草叢","long":"松林在這裡忽然斷開，眼前是一大片及腰的野草，風一吹便如波浪般起伏。草叢裡不時傳來窸窸窣窣的聲音，偶爾還能看見一雙發亮的眼睛在草間一閃而過，叫人心裡發毛。草地上有幾處被壓倒的痕跡，像是有什麼大傢伙在這裡打過滾。往西北可以回到松林，往北是一塊空地，往東南的草長得更高更密。","exits":{"northwest":"/d/oldpine/forest_n3","north":"/d/oldpine/clearing_n","southeast":"/d/oldpine/grass2","east":"/d/kangping/forest_exit"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[8,2,0]},"/d/oldpine/grass2":{"id":"/d/oldpine/grass2","file":"source/upstream/mudlib/d/oldpine/grass2.c","short":"草叢","long":"這裡的野草長得比人還高，四周只聽得見草葉摩擦的沙沙聲，根本看不清三步以外的東西。草叢中被壓出了一條條獸徑，泥地上滿是爪印，草根處還散落著幾撮灰黃色的獸毛。北邊的山壁下有一個黑黝黝的洞穴，裡頭不時傳出低沉的吼聲。往西北可以回到較矮的草叢。","exits":{"northwest":"/d/oldpine/grass1","southeast":"/d/baihua/hillside"},"objects":{"/d/oldpine/npc/goat":3},"special":[{"cmd":"cave","to":"/d/oldpine/bear_cave"}],"area":"老松林","layer":null,"areaKey":"老松林","pos":[9,3,0]},"/d/oldpine/gravel_road":{"id":"/d/oldpine/gravel_road","file":"source/upstream/mudlib/d/oldpine/gravel_road.c","short":"碎石路","long":"一條鋪著碎石的小路，碎石大小不一，走起來喀啦作響，是彤雲寺的僧人一擔一擔挑來鋪成的。路旁立著一塊小石碑，刻著「彤雲寺由此往西」。這裡是老松林中少數有人整理的路，往西可以到彤雲寺，往南接上官道，往北的林子裡卻不時傳來粗野的喧鬧聲。","exits":{"west":"/d/oldpine/temple_gate","north":"/d/oldpine/hideout","south":"/d/oldpine/highway"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[3,5,0]},"/d/oldpine/hideout":{"id":"/d/oldpine/hideout","file":"source/upstream/mudlib/d/oldpine/hideout.c","short":"林間空地","long":"松林深處一塊隱密的空地，四周用砍下的樹枝圍起了簡陋的柵欄，柵欄上掛著幾面破舊的布旗。空地中央搭著一個獸皮棚子，裡面堆著搶來的米糧和兵器，棚前插著一把生了鏽的大刀，刀柄上纏著褪色的紅布。這裡顯然是土匪在老松林裡的據點。往東北和往南各有一條小路。","exits":{"northeast":"/d/oldpine/crossing","south":"/d/oldpine/gravel_road"},"objects":{"/d/oldpine/npc/xue_biao":1,"/d/oldpine/npc/bandit":2},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[3,4,0]},"/d/oldpine/highway":{"id":"/d/oldpine/highway","file":"source/upstream/mudlib/d/oldpine/highway.c","short":"官道","long":"老松林南邊的官道，路面寬闊平坦，兩旁種著整齊的柳樹，與林中崎嶇的小路相比，走起來輕鬆許多。路邊立著一塊里程碑，刻著往喬陰縣的方向與里數。由於近來老松林土匪橫行，官道上往來的旅人寥寥無幾，只有幾隻烏鴉停在柳枝上啞啞叫著。往北可以進入老松林，往南的官道通往喬陰縣。","exits":{"north":"/d/oldpine/gravel_road","south":"/d/qiaoyin/ngate"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[3,6,0]},"/d/oldpine/inn":{"id":"/d/oldpine/inn","file":"source/upstream/mudlib/d/oldpine/inn.c","short":"野店","long":"迷霧森林裡一間用原木搭成的野店，屋簷下掛著一串串獸皮與風乾的鹿腿，門口豎著一根竹竿，挑著寫有「酒」字的布幌子。野店來往的人雖然不多，但獵戶和採藥人經常在此落腳，生意倒也還過得去；偶爾有獵人把打到的獵物賣給野店，烤肉的香味還吸引了附近的老饕前來光顧。往東可以回到林間空地，後頭掛著一塊油膩的布簾，裡面就是廚房。","exits":{"east":"/d/oldpine/glade","enter":"/d/oldpine/kitchen"},"objects":{"/d/oldpine/npc/waiter":1},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[2,2,0]},"/d/oldpine/kitchen":{"id":"/d/oldpine/kitchen","file":"source/upstream/mudlib/d/oldpine/kitchen.c","short":"廚房","long":"野店後頭的小廚房，牆壁被煙燻得烏黑，灶上架著一口大鐵鍋，鍋裡燉著不知名的野味，香氣四溢。屋樑上吊著幾串風乾的獸肉和辣椒，牆角堆滿了柴火與裝米的麻袋，麻袋上被咬出了好幾個破洞，地上還散落著米粒和老鼠屎。掀開布簾就能回到前頭的店裡。","exits":{"out":"/d/oldpine/inn"},"objects":{"/d/oldpine/npc/rat":3},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[1,2,0]},"/d/oldpine/ledge":{"id":"/d/oldpine/ledge","file":"source/upstream/mudlib/d/oldpine/ledge.c","short":"平台","long":"一塊突出的大石頭形成的平台，位置高出洞底許多，下面的動靜看得一清二楚。石面上有幾處被人用刀刻下的記號，旁邊還丟著一個乾癟的水袋，看來曾有人在此躲避野獸。在這裡總算可以暫時喘口氣，但下面的低吼聲不時傳來，提醒你危險並未遠離。從這裡可以爬下去，回到山洞深處。","exits":{"down":"/d/oldpine/cave_deep"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[8,3,0]},"/d/oldpine/main_hall":{"id":"/d/oldpine/main_hall","file":"source/upstream/mudlib/d/oldpine/main_hall.c","short":"大雄寶殿","long":"這裡是彤雲寺的大雄寶殿﹐正殿供奉的是一尊巨大的大日如來神像﹐各式法器均整齊地放在一旁﹐神像前放著幾個蒲團﹐大殿的入口在你的南邊﹐東西兩邊各有一扇門通往寺院內部。","exits":{"west":"/d/oldpine/side_hall_w","east":"/d/oldpine/side_hall_e","south":"/d/oldpine/temple_square"},"objects":{"/d/oldpine/npc/da_guan":1},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[1,4,0]},"/d/oldpine/mist1":{"id":"/d/oldpine/mist1","file":"source/upstream/mudlib/d/oldpine/mist1.c","short":"迷霧森林","long":"白茫茫的霧氣在樹林間緩緩流動，十步以外的景物便模糊不清，只剩下一團團灰色的樹影。腳下是濕滑的落葉和腐土，空氣中飄著草藥的苦香，路旁偶爾能看見採藥人遺落的竹簍和斷掉的藥鋤。森林雖然深不可測，往來的人倒也不算少。往西可以走出森林，往東霧氣更加濃重。","exits":{"west":"/d/oldpine/mist_entrance","east":"/d/oldpine/mist2"},"objects":{"/obj/area/traveller":2},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[1,0,0]},"/d/oldpine/mist2":{"id":"/d/oldpine/mist2","file":"source/upstream/mudlib/d/oldpine/mist2.c","short":"迷霧森林","long":"霧氣濃得像化不開的牛乳，衣服沒多久就被沾得濕漉漉的。林間有一塊稍微乾燥的高地，被往來的人當成了歇腳處，地上留著熄滅的火堆和一些吃剩的乾糧碎屑。不時有人影從霧中出現又消失，分不清是旅人還是商販。往西可以回去，往南有一條被人踩出來的小徑。","exits":{"west":"/d/oldpine/mist1","south":"/d/oldpine/mist3"},"objects":{"/d/oldpine/npc/seller":1,"/obj/area/man":1},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[2,0,0]},"/d/oldpine/mist3":{"id":"/d/oldpine/mist3","file":"source/upstream/mudlib/d/oldpine/mist3.c","short":"迷霧森林","long":"這裡的樹木長得歪歪斜斜，樹根像一條條巨蛇般隆出地面，一不留神就會被絆倒。霧氣中隱約傳來潺潺的水聲，循聲望去卻什麼也看不見。樹幹上被人用刀刻了幾個箭頭，指向東南方，大概是往來的獵戶留下的記號。往北可以回到林中的歇腳處，往東南的霧氣稍微淡了一些。","exits":{"north":"/d/oldpine/mist2","southeast":"/d/oldpine/glade"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[2,1,0]},"/d/oldpine/mist4":{"id":"/d/oldpine/mist4","file":"source/upstream/mudlib/d/oldpine/mist4.c","short":"迷霧森林","long":"一片長滿青草的林間窪地，霧氣在此聚積不散，像一池靜止的白水。草地上滿是蹄印和被啃食過的草根，四周的樹皮也被磨去了一塊塊，看來常有野鹿成群在此覓食。一有風吹草動，草叢深處便傳來一陣慌亂的蹄聲，接著又歸於平靜。往南可以走到一塊林間空地。","exits":{"south":"/d/oldpine/glade"},"objects":{"/d/oldpine/npc/deer":4},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[3,1,0]},"/d/oldpine/mist_entrance":{"id":"/d/oldpine/mist_entrance","file":"source/upstream/mudlib/d/oldpine/mist_entrance.c","short":"森林入口","long":"老松林往東走到盡頭，樹木的種類漸漸變得雜亂，高大的樟樹與楓樹取代了松樹，林間開始飄起一層薄薄的白霧。路旁一棵大樟樹上刻著歪歪扭扭的幾個字：「霧深勿入」，旁邊還畫了個骷髏頭。這裡便是迷霧森林的入口，往西可以回到老松林，往東則是霧氣更濃的森林深處。","exits":{"west":"/d/oldpine/crossing","east":"/d/oldpine/mist1"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[0,0,0]},"/d/oldpine/path0":{"id":"/d/oldpine/path0","file":"source/upstream/mudlib/d/oldpine/path0.c","short":"林間小路","long":"一段狹窄的林間小路，兩旁的老松枝椏低垂，行人得不時低頭，才不會被松枝刮到臉。路面上散落著被踩碎的松果，泥土裡還半埋著一隻斷了繩的草鞋和幾枚生鏽的銅錢，看來曾有人在這裡慌忙逃命。西北方隱約飄來柴火的煙味和粗野的笑罵聲，往東則接上一條較為平坦的小路。","exits":{"northwest":"/d/oldpine/clearing_w","east":"/d/oldpine/path1"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[1,2,0]},"/d/oldpine/path1":{"id":"/d/oldpine/path1","file":"source/upstream/mudlib/d/oldpine/path1.c","short":"林間小路","long":"一條夾在松樹之間的泥土小路，路面被往來的人踩得結實，兩旁卻長滿了帶刺的荊棘，稍不留神就會勾破衣裳。路邊的泥地上留著幾個新鮮的馬蹄印，不遠處還有一小攤乾掉的血跡和一隻掉落的布鞋，讓人不禁加快了腳步。小路往西越走越窄，往東南則蜿蜒深入林中。","exits":{"west":"/d/oldpine/path0","southeast":"/d/oldpine/path2"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[2,2,0]},"/d/oldpine/path2":{"id":"/d/oldpine/path2","file":"source/upstream/mudlib/d/oldpine/path2.c","short":"林間小路","long":"林間的小路在這裡轉了個彎，路旁一棵老松的根部盤結隆起，被往來的人當成了歇腳的石凳，坐得光滑發亮。樹枝上掛著幾串風乾的野果，不知是哪個好心的旅人留下來給後人充飢的。近來路上行人稀少，樹根旁已經積了一層沒人掃的落葉。小路往西北通向林子深處，往東則能走到一塊空地。","exits":{"northwest":"/d/oldpine/path1","east":"/d/oldpine/crossing"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[3,3,0]},"/d/oldpine/reeds":{"id":"/d/oldpine/reeds","file":"source/upstream/mudlib/d/oldpine/reeds.c","short":"蘆葦叢","long":"一望無際的蘆葦叢，蘆葦長得比人還高，密密麻麻地擋住了視線，四面八方看起來都一模一樣。腳下是濕軟的泥地，每走一步都會陷下去半寸，身後的足跡很快又被泥水填平。風吹過蘆葦，發出沙沙的聲響，彷彿有人在耳邊低語，讓人完全分不清東南西北。","exits":{"north":"/d/oldpine/reeds2","south":"/d/oldpine/reeds","east":"/d/oldpine/wood3","west":"/d/oldpine/reeds"},"objects":{},"special":[],"area":"迷霧森林","layer":"蘆葦叢","areaKey":"迷霧森林","pos":[3,4,-1]},"/d/oldpine/reeds2":{"id":"/d/oldpine/reeds2","file":"source/upstream/mudlib/d/oldpine/reeds2.c","short":"蘆葦叢","long":"一望無際的蘆葦叢，蘆葦長得比人還高，密密麻麻地擋住了視線，四面八方看起來都一模一樣。腳下是濕軟的泥地，每走一步都會陷下去半寸，身後的足跡很快又被泥水填平。風吹過蘆葦，發出沙沙的聲響，彷彿有人在耳邊低語，讓人完全分不清東南西北。","exits":{"north":"/d/oldpine/reeds3","south":"/d/oldpine/reeds","east":"/d/oldpine/reeds","west":"/d/oldpine/reeds"},"objects":{},"special":[],"area":"迷霧森林","layer":"蘆葦叢","areaKey":"迷霧森林"},"/d/oldpine/reeds3":{"id":"/d/oldpine/reeds3","file":"source/upstream/mudlib/d/oldpine/reeds3.c","short":"蘆葦叢","long":"一望無際的蘆葦叢，蘆葦長得比人還高，密密麻麻地擋住了視線，四面八方看起來都一模一樣。腳下是濕軟的泥地，每走一步都會陷下去半寸，身後的足跡很快又被泥水填平。風吹過蘆葦，發出沙沙的聲響，彷彿有人在耳邊低語，讓人完全分不清東南西北。","exits":{"north":"/d/oldpine/reeds","south":"/d/oldpine/reeds","east":"/d/oldpine/reeds4","west":"/d/oldpine/reeds"},"objects":{},"special":[],"area":"迷霧森林","layer":"蘆葦叢","areaKey":"迷霧森林"},"/d/oldpine/reeds4":{"id":"/d/oldpine/reeds4","file":"source/upstream/mudlib/d/oldpine/reeds4.c","short":"蘆葦叢","long":"一望無際的蘆葦叢，蘆葦長得比人還高，密密麻麻地擋住了視線，四面八方看起來都一模一樣。腳下是濕軟的泥地，每走一步都會陷下去半寸，身後的足跡很快又被泥水填平。風吹過蘆葦，發出沙沙的聲響，彷彿有人在耳邊低語，讓人完全分不清東南西北。","exits":{"north":"/d/oldpine/reeds","south":"/d/oldpine/reeds","east":"/d/oldpine/reeds","west":"/d/oldpine/reeds5"},"objects":{},"special":[],"area":"迷霧森林","layer":"蘆葦叢","areaKey":"迷霧森林"},"/d/oldpine/reeds5":{"id":"/d/oldpine/reeds5","file":"source/upstream/mudlib/d/oldpine/reeds5.c","short":"蘆葦叢","long":"一望無際的蘆葦叢，蘆葦長得比人還高，密密麻麻地擋住了視線，四面八方看起來都一模一樣。腳下是濕軟的泥地，每走一步都會陷下去半寸，身後的足跡很快又被泥水填平。風吹過蘆葦，發出沙沙的聲響，彷彿有人在耳邊低語，讓人完全分不清東南西北。","exits":{"north":"/d/oldpine/reeds_exit","south":"/d/oldpine/reeds","east":"/d/oldpine/reeds","west":"/d/oldpine/reeds"},"objects":{},"special":[],"area":"迷霧森林","layer":"蘆葦叢","areaKey":"迷霧森林"},"/d/oldpine/reeds_exit":{"id":"/d/oldpine/reeds_exit","file":"source/upstream/mudlib/d/oldpine/reeds_exit.c","short":"蘆葦叢","long":"蘆葦叢的邊緣，高大的蘆葦終於稀疏了下來，露出一小片乾燥的土丘。土丘上長著幾株罕見的草藥，在潮濕的霧氣中顯得格外青翠，看來很少有人能找到這裡。從土丘上望出去，東邊隱約可以看見樹林的輪廓，總算是找到了出路。往東可以離開蘆葦叢。","exits":{"east":"/d/oldpine/wood3"},"objects":{"/d/oldpine/npc/herbalist":1},"special":[],"area":"迷霧森林","layer":"蘆葦叢邊緣","areaKey":"迷霧森林","pos":[3,4,1]},"/d/oldpine/shrubs":{"id":"/d/oldpine/shrubs","file":"source/upstream/mudlib/d/oldpine/shrubs.c","short":"矮樹叢","long":"一片低矮的灌木叢，枝葉間結滿了紅色的小漿果，酸甜的氣味混在霧氣裡。灌木叢中被人砍出了一條小路，路旁的樹枝上綁著一條褪色的紅布，大概是給迷路的人做的記號。霧中不時傳來幾聲粗魯的吆喝和大笑，聽起來不像是善類。往北可以回到林間空地，往西南是一片空地。","exits":{"north":"/d/oldpine/glade","southwest":"/d/oldpine/bandit_clearing"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[3,3,0]},"/d/oldpine/side_hall_e":{"id":"/d/oldpine/side_hall_e","file":"source/upstream/mudlib/d/oldpine/side_hall_e.c","short":"側殿","long":"大雄寶殿東側的偏殿，殿內供奉著十八羅漢的泥塑像，有的怒目圓睜，有的含笑撫膝，個個神態不同、栩栩如生。殿角放著一面大鼓和一口銅鐘，鐘身刻滿了經文，看得出年代久遠。地上的青磚被跪拜的人磨得光亮，蒲團上還留著淺淺的膝印。往西可以回到大雄寶殿。","exits":{"west":"/d/oldpine/main_hall"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[2,4,0]},"/d/oldpine/side_hall_w":{"id":"/d/oldpine/side_hall_w","file":"source/upstream/mudlib/d/oldpine/side_hall_w.c","short":"側殿","long":"大雄寶殿西側的偏殿，殿內供奉著一尊手持淨瓶的觀音菩薩像，菩薩低眉垂目，神情慈悲。兩旁的木架上擺滿了經書，許多書頁已經泛黃，用細繩小心地綑紮著。供桌上點著一盞長明燈，微弱的火光映著牆上褪色的壁畫，畫的是菩薩救苦救難的故事。往東可以回到大雄寶殿。","exits":{"east":"/d/oldpine/main_hall"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[0,4,0]},"/d/oldpine/temple_gate":{"id":"/d/oldpine/temple_gate","file":"source/upstream/mudlib/d/oldpine/temple_gate.c","short":"彤雲寺","long":"彤雲寺的山門，兩扇朱漆木門斑駁褪色，門楣上懸著一塊匾額，以蒼勁的筆法寫著「彤雲寺」三個大字。門前蹲著兩隻石獅，被風雨侵蝕得只剩下模糊的輪廓。聽說寺裡的住持到南方雲遊了好些年，香火一度冷清，最近才又熱鬧起來。往西進入寺內的廣場，往東是一條碎石路。","exits":{"west":"/d/oldpine/temple_square","east":"/d/oldpine/gravel_road"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[2,5,0]},"/d/oldpine/temple_square":{"id":"/d/oldpine/temple_square","file":"source/upstream/mudlib/d/oldpine/temple_square.c","short":"彤雲寺","long":"彤雲寺大殿前的廣場，地上鋪著平整的青石板，石縫裡長出幾叢青草。廣場中央立著一座三足銅香爐，爐中插滿了香，裊裊青煙飄向北邊莊嚴的大雄寶殿。廣場兩側種著幾棵老松，樹下擺著石凳，偶爾有僧人拿著竹掃帚在此清掃落葉。往北是大雄寶殿，往東可以走出寺門。","exits":{"north":"/d/oldpine/main_hall","east":"/d/oldpine/temple_gate"},"objects":{},"special":[],"area":"老松林","layer":null,"areaKey":"老松林","pos":[1,5,0]},"/d/oldpine/wood1":{"id":"/d/oldpine/wood1","file":"source/upstream/mudlib/d/oldpine/wood1.c","short":"樹林","long":"霧氣籠罩下的雜木林，樹幹上纏滿了藤蔓，藤上結著一串串紫黑色的果實，引來不少鳥雀啄食。地面上有幾道被重物拖過的痕跡，一路延伸到東北方的林子裡，痕跡旁還印著碗口大的爪印，看得人心頭一緊。往西可以回到空地，往東北和往南各有小路。","exits":{"west":"/d/oldpine/glade","northeast":"/d/oldpine/beast_trail","south":"/d/oldpine/wood2"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[4,2,0]},"/d/oldpine/wood2":{"id":"/d/oldpine/wood2","file":"source/upstream/mudlib/d/oldpine/wood2.c","short":"樹林","long":"林中的霧氣潮濕而清涼，樹下長著各式各樣的蕨類和野草，其中有不少是珍貴的藥材。地上被挖出了許多小坑，坑邊還留著新鮮的泥土，看來有採藥人剛在這裡忙碌過。遠處傳來一陣陣蘆葦被風吹動的沙沙聲，在霧中聽來格外清晰。往北和往南都有路可走。","exits":{"north":"/d/oldpine/wood1","south":"/d/oldpine/wood3"},"objects":{"/d/oldpine/npc/herbalist":1},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[4,3,0]},"/d/oldpine/wood3":{"id":"/d/oldpine/wood3","file":"source/upstream/mudlib/d/oldpine/wood3.c","short":"樹林","long":"森林的南邊，霧氣在這裡被一片廣大的蘆葦叢擋住，樹林與蘆葦交界處長滿了濕漉漉的苔蘚。西邊的蘆葦叢一望無際，隨風起伏如海，據說曾有人走進去就再也沒有出來，附近的獵戶都繞道而行。往北可以回到林中，往西是蘆葦叢，往西南的樹林則越來越幽深。","exits":{"north":"/d/oldpine/wood2","west":"/d/oldpine/reeds","southwest":"/d/oldpine/wood4"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[4,4,0]},"/d/oldpine/wood4":{"id":"/d/oldpine/wood4","file":"source/upstream/mudlib/d/oldpine/wood4.c","short":"樹林","long":"這裡的樹木又高又密，枝葉交錯成一片厚實的頂篷，霧氣被困在林下，濃得幾乎可以用手撈起。地上的落葉積了不知多少年，踩下去鬆鬆軟軟，散發出一股潮濕的霉味。樹枝間不時有小動物竄過，抖落一串冰涼的水珠。往東北可以回去，往南是森林更深的地方。","exits":{"northeast":"/d/oldpine/wood3","south":"/d/oldpine/wood_deep"},"objects":{},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[3,5,0]},"/d/oldpine/wood_deep":{"id":"/d/oldpine/wood_deep","file":"source/upstream/mudlib/d/oldpine/wood_deep.c","short":"樹林深處","long":"迷霧森林的最深處，幾棵需要數人合抱的古松挺立在霧中，樹幹上滿是樹洞，松果落了一地。松鼠們在枝頭間跳來跳去，一點也不怕人，偶爾還會抱著松果好奇地打量你。四周靜謐得出奇，彷彿與外面的世界完全隔絕。往北是唯一的出路。","exits":{"north":"/d/oldpine/wood4"},"objects":{"/d/oldpine/npc/squirrel":4},"special":[],"area":"迷霧森林","layer":null,"areaKey":"迷霧森林","pos":[3,6,0]},"/d/qiaoyin/alchemy_room":{"id":"/d/qiaoyin/alchemy_room","file":"source/upstream/mudlib/d/qiaoyin/alchemy_room.c","short":"煉丹房","long":"這裡是方士煉丹的房間，裡面有許多的丹爐跟丹鼎，還有許多的松柴，由於煉丹需要專心，為了避免在煉丹時受到別人的打擾，這個房間有高級方士施以法術，專供方士專心煉丹用。","exits":{"south":"/d/qiaoyin/big_hall"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-1,-2,0]},"/d/qiaoyin/alley":{"id":"/d/qiaoyin/alley","file":"source/upstream/mudlib/d/qiaoyin/alley.c","short":"小巷子","long":"一條狹窄的小巷子，從東大街往北延伸過來，兩旁的高牆擋住了大半的陽光，青石板路面長著一層薄薄的青苔，走起來有些溼滑。巷子西邊有一間大屋，門口飄出淡淡的藥香與煙火味，偶爾還傳來陶罐碰撞的聲響。","exits":{"west":"/d/qiaoyin/big_hall","south":"/d/qiaoyin/east_street3"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[0,-1,0]},"/d/qiaoyin/bank":{"id":"/d/qiaoyin/bank","file":"source/upstream/mudlib/d/qiaoyin/bank.c","short":"景隆錢莊","long":"景隆錢莊在喬陰縣的分號，店面雖然不如五堂鎮的本號氣派，但櫃臺後的夥計一樣忙著撥算盤，門口與內堂都有護院武師把守。在這裡可以存款、提款，也可以兌換銀兩，城裡的商家大多在此往來。","exits":{"north":"/d/qiaoyin/west_street3"},"objects":{"/d/wutang/npc/guard":2},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-5,1,0]},"/d/qiaoyin/big_hall":{"id":"/d/qiaoyin/big_hall","file":"source/upstream/mudlib/d/qiaoyin/big_hall.c","short":"大屋正廳","long":"進了這間大屋才發現，原來這裡是間方士們煉丹燒爐的丹房，大廳中擺設很簡單，只有一些木櫃跟香煙裊繞的青銅丹爐，幾名童子正用蒲扇在丹爐旁搧火，另外一些童子則蹲在一旁用瓷缽研磨不知名的藥物。","exits":{"north":"/d/qiaoyin/alchemy_room","east":"/d/qiaoyin/alley"},"objects":{"/d/qiaoyin/npc/jiang_hsuren":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-1,-1,0]},"/d/qiaoyin/bookstore":{"id":"/d/qiaoyin/bookstore","file":"source/upstream/mudlib/d/qiaoyin/bookstore.c","short":"名山書肆","long":"你現在來到一間燈光昏暗的書肆，除了你進來的那面牆上開了道門之外，三面牆壁都是書架，滿滿地排列著各式各樣的書。靠裡面的一個矮櫃上面放著文房四寶，一股淡淡的松煙墨香氣縈繞著整間屋子。","exits":{"east":"/d/qiaoyin/west_lane2"},"objects":{"/d/qiaoyin/npc/oldman":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-8,-1,0]},"/d/qiaoyin/east_street1":{"id":"/d/qiaoyin/east_street1","file":"source/upstream/mudlib/d/qiaoyin/east_street1.c","short":"東大街","long":"東大街的西端，鄰近城中心的樹王墳，街邊幾家茶館坐滿了閒聊的鄉民，說書人拍著醒木的聲音隔著窗子都聽得見，講到精彩處還會引來滿堂喝采。街口有個賣糖葫蘆的老漢，身邊總圍著幾個孩子。","exits":{"west":"/d/qiaoyin/tree_tomb","east":"/d/qiaoyin/east_street2"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-2,0,0]},"/d/qiaoyin/east_street2":{"id":"/d/qiaoyin/east_street2","file":"source/upstream/mudlib/d/qiaoyin/east_street2.c","short":"東大街","long":"東大街的中段，兩旁多是賣布匹、雜貨的店鋪，綢緞莊門口掛著幾匹染得鮮豔的花布，在陽光下格外顯眼。這一帶往來的行人比西大街少了一些，顯得清閒許多，偶爾有轎子從街心經過。","exits":{"west":"/d/qiaoyin/east_street1","east":"/d/qiaoyin/east_street3"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-1,0,0]},"/d/qiaoyin/east_street3":{"id":"/d/qiaoyin/east_street3","file":"source/upstream/mudlib/d/qiaoyin/east_street3.c","short":"東大街","long":"東大街的東段，離東門已經不遠，街上的店鋪漸漸稀疏，多了幾分冷清。東北方是一座清幽的宅院，門前打掃得一塵不染，南邊則是同仁藥鋪，門口飄著淡淡的藥香，往來的多是抓藥看病的街坊。","exits":{"west":"/d/qiaoyin/east_street2","east":"/d/qiaoyin/egate","north":"/d/qiaoyin/alley","northeast":"/d/qiaoyin/fonxan_hall","south":"/d/qiaoyin/pharmacy"},"objects":{"/d/qiaoyin/npc/girl":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[0,0,0]},"/d/qiaoyin/egate":{"id":"/d/qiaoyin/egate","file":"source/upstream/mudlib/d/qiaoyin/egate.c","short":"喬陰縣城東門","long":"喬陰縣城的東門，城門緊緊關著，門閂上還加了一道大鎖。出了東門的路原本可以通往平陽山與天寒村，但近來山路不太平靜，官府已經下令暫時封閉，城門邊貼著一張告示，圍觀的鄉民議論紛紛。","exits":{"west":"/d/qiaoyin/east_street3"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[1,0,0]},"/d/qiaoyin/fonxan_hall":{"id":"/d/qiaoyin/fonxan_hall","file":"source/upstream/mudlib/d/qiaoyin/fonxan_hall.c","short":"正廳","long":"這是一座清幽宅院的正廳，據說是封山派在喬陰縣的落腳之處。廳中陳設簡樸，正面牆上掛著一幅山水，畫的正是封山的景色，兩旁擺著幾張太師椅，桌上的茶還冒著熱氣。東邊的門通往一處別院。","exits":{"east":"/d/qiaoyin/fonxan_yard","southwest":"/d/qiaoyin/east_street3"},"objects":{"/custom/legacy_npc/liuh_don_lu":1,"/d/qiaoyin/npc/doo_yeng":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[1,-1,0]},"/d/qiaoyin/fonxan_yard":{"id":"/d/qiaoyin/fonxan_yard","file":"source/upstream/mudlib/d/qiaoyin/fonxan_yard.c","short":"別院","long":"正廳東邊的一處別院，院子裡種著幾株老梅與修竹，牆角一口古井上覆著木蓋。一張石桌旁擺著幾個石凳，四周十分清靜，只聽得見風吹竹葉的沙沙聲，看來是封山派用來招待貴客的地方。","exits":{"west":"/d/qiaoyin/fonxan_hall"},"objects":{"/custom/legacy_npc/wu_yu_nun":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[2,-1,0]},"/d/qiaoyin/grocery":{"id":"/d/qiaoyin/grocery","file":"source/upstream/mudlib/d/qiaoyin/grocery.c","short":"雜貨舖","long":"一間堆得滿滿的雜貨舖，櫃臺上擺著鹽、糖、符紙之類的日常雜貨，牆角疊著一捆捆的松材，屋樑上還吊著幾串乾辣椒。老闆老何在喬陰縣住了大半輩子，城裡人要買什麼零碎東西，多半都往這兒來。","exits":{"east":"/d/qiaoyin/north_street1"},"objects":{"/d/qiaoyin/npc/old_ho":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-4,-3,0]},"/d/qiaoyin/highway":{"id":"/d/qiaoyin/highway","file":"source/upstream/mudlib/d/qiaoyin/highway.c","short":"官道","long":"從五堂鎮通往喬陰縣的官道，路面被往來的車馬碾出兩道深深的車轍，兩旁是一畦畦的稻田，遠處已經可以望見喬陰縣城灰色的城牆。路旁的大樹下擺著一座茶棚，供趕路的旅人歇腳。","exits":{"northwest":"/d/wutang/three_way","east":"/d/qiaoyin/wgate"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-8,-3,0]},"/d/qiaoyin/inn":{"id":"/d/qiaoyin/inn","file":"source/upstream/mudlib/d/qiaoyin/inn.c","short":"金水客棧","long":"一家寬敞的客棧，門口高高掛著「金水客棧」的招牌。大廳裡擺著十幾張桌子，跑堂的店小二穿梭其間，招呼著南來北往的客人，櫃臺後的酒罈堆得老高。牆角有一座木梯通往二樓的雅座。","exits":{"east":"/d/qiaoyin/south_street2","up":"/d/qiaoyin/inn2"},"objects":{"/d/qiaoyin/npc/waiter":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-4,2,0]},"/d/qiaoyin/inn2":{"id":"/d/qiaoyin/inn2","file":"source/upstream/mudlib/d/qiaoyin/inn2.c","short":"金水客棧二樓","long":"這裡是金水客棧的二樓，或者應該說是一樓和二樓之間的閣樓，這有座木梯通往樓下，靠窗一面是二樓的雅座，往北則通往客房。","exits":{"down":"/d/qiaoyin/inn"},"objects":{"/d/qiaoyin/npc/cao_xuanzhi":1,"/custom/legacy_npc/yin_euyen":1},"special":[],"area":"喬陰縣","layer":"二樓","areaKey":"喬陰縣","pos":[-4,2,1]},"/d/qiaoyin/mid_lane1":{"id":"/d/qiaoyin/mid_lane1","file":"source/upstream/mudlib/d/qiaoyin/mid_lane1.c","short":"街道","long":"一條不太寬的街道，兩旁的店面大多關著門，東邊是和豐當鋪的大門，門口掛著一塊褪了色的招牌。路邊的牆角堆著一些破竹簍，常有野狗在這裡翻找吃食，弄得滿地狼藉。","exits":{"east":"/d/qiaoyin/pawnshop","south":"/d/qiaoyin/mid_lane2"},"objects":{"/d/qiaoyin/npc/wild_dog":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-5,-2,0]},"/d/qiaoyin/mid_lane2":{"id":"/d/qiaoyin/mid_lane2","file":"source/upstream/mudlib/d/qiaoyin/mid_lane2.c","short":"街道","long":"一條安靜的街道，兩旁是幾戶人家的後牆，牆頭探出幾枝桃花，在風中輕輕搖曳，落下的花瓣鋪了一地。偶爾有人家推開後門倒水，見到生人便又急忙關上，似乎不太喜歡外人打擾。","exits":{"north":"/d/qiaoyin/mid_lane1","south":"/d/qiaoyin/west_street3"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-5,-1,0]},"/d/qiaoyin/ngate":{"id":"/d/qiaoyin/ngate","file":"source/upstream/mudlib/d/qiaoyin/ngate.c","short":"喬陰縣城北門","long":"喬陰縣城的北門，城門洞裡陰涼幽暗，幾名官兵手按刀柄，仔細盤查著進出的行人，連挑擔的小販也得打開擔子讓他們翻看。城門外是一條通往老松林的官道，近來老松林裡的土匪越聚越多，往北去的商旅都得結伴而行，城牆上也新貼了幾張緝拿盜匪的告示。","exits":{"north":"/d/oldpine/highway","south":"/d/qiaoyin/north_street1"},"objects":{"/obj/area/garrison":4},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,-4,0]},"/d/qiaoyin/north_street1":{"id":"/d/qiaoyin/north_street1","file":"source/upstream/mudlib/d/qiaoyin/north_street1.c","short":"北大街","long":"北大街的北段，離北門已經不遠，西邊開著一間雜貨舖。由於北門外不太平靜，這一帶的行人比往年少了許多，偶爾才有幾個挑著擔子的鄉民匆匆走過，連路邊的攤販也早早收了攤。","exits":{"north":"/d/qiaoyin/ngate","west":"/d/qiaoyin/grocery","south":"/d/qiaoyin/north_street2"},"objects":{"/obj/area/man":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,-3,0]},"/d/qiaoyin/north_street2":{"id":"/d/qiaoyin/north_street2","file":"source/upstream/mudlib/d/qiaoyin/north_street2.c","short":"北大街","long":"北大街的中段，街道兩旁店鋪林立，酒旗招展，挑擔的小販沿街叫賣，是喬陰縣城裡最熱鬧的地方之一。路邊的酒樓傳出划拳行令的喧鬧聲，門口停著幾輛馬車，車伕們蹲在一旁閒聊。","exits":{"north":"/d/qiaoyin/north_street1","south":"/d/qiaoyin/north_street3"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,-2,0]},"/d/qiaoyin/north_street3":{"id":"/d/qiaoyin/north_street3","file":"source/upstream/mudlib/d/qiaoyin/north_street3.c","short":"北大街","long":"北大街的南段，東邊傳來叮叮噹噹的打鐵聲，原來是一間鐵匠鋪，鋪子門口堆著一些剛打好的鋤頭與柴刀，幾個莊稼漢正蹲在一旁挑揀。街上不時有些遊手好閒的人晃來晃去，路人見了都繞道而行。","exits":{"north":"/d/qiaoyin/north_street2","east":"/d/qiaoyin/smithy","south":"/d/qiaoyin/tree_tomb"},"objects":{"/obj/area/vagabond":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,-1,0]},"/d/qiaoyin/pawnshop":{"id":"/d/qiaoyin/pawnshop","file":"source/upstream/mudlib/d/qiaoyin/pawnshop.c","short":"和豐當鋪","long":"一間門面不大的當鋪，高高的櫃臺後面坐著朝奉，只露出一雙精明的眼睛，櫃臺前擺著一張長凳，供來典當的客人歇腳。牆上掛著一塊寫著「童叟無欺」的木牌，字跡已經有些模糊。","exits":{"west":"/d/qiaoyin/mid_lane1"},"objects":{"/d/qiaoyin/npc/hsiao_bi_chen":1,"/custom/legacy_npc/hsiao_lang_sheng":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-4,-2,0]},"/d/qiaoyin/pharmacy":{"id":"/d/qiaoyin/pharmacy","file":"source/upstream/mudlib/d/qiaoyin/pharmacy.c","short":"同仁藥鋪","long":"這裡是一間藥鋪，如果你有什麼需要，可以向藥鋪的掌櫃訊問一下。這種山村裡的小藥鋪，雖然治不了什麼大病，但是治療一般的跌打損傷還是綽綽有餘的。在你的正上方有一塊匾額，上面寫著濟世救人。","exits":{"north":"/d/qiaoyin/east_street3"},"objects":{"/d/qiaoyin/npc/keeper":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[0,1,0]},"/d/qiaoyin/sgate":{"id":"/d/qiaoyin/sgate","file":"source/upstream/mudlib/d/qiaoyin/sgate.c","short":"喬陰縣城南門","long":"喬陰縣城的南門，城牆上的磚石有些斑駁，看來已經許久沒有修繕。城門外是一片平坦的田野，阡陌縱橫，此刻城門卻已關上，幾名官兵守在門邊，不讓閒雜人等隨意出城。","exits":{"north":"/d/qiaoyin/south_street2"},"objects":{"/obj/area/garrison":4},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,3,0]},"/d/qiaoyin/smithy":{"id":"/d/qiaoyin/smithy","file":"source/upstream/mudlib/d/qiaoyin/smithy.c","short":"鐵匠鋪","long":"一間熱氣騰騰的鐵匠鋪，屋子中央的火爐燒得通紅，一旁擺著鐵砧與水箱，燒紅的鐵塊浸入水中時便冒起一陣白煙。牆上掛滿了刀、劍、斧頭等各式兵器，都是鐵匠閒暇時打造的。","exits":{"west":"/d/qiaoyin/north_street3"},"objects":{"/d/qiaoyin/npc/smith":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-2,-1,0]},"/d/qiaoyin/south_street1":{"id":"/d/qiaoyin/south_street1","file":"source/upstream/mudlib/d/qiaoyin/south_street1.c","short":"南大街","long":"南大街的北段，鄰近城中心的樹王墳。街邊有幾家小吃攤，蒸籠裡冒著白煙，飄來陣陣香味，攤子前的長凳上坐滿了埋頭吃喝的客人。路旁一棵老槐樹下，幾個老人正圍著棋盤，看得目不轉睛。","exits":{"north":"/d/qiaoyin/tree_tomb","south":"/d/qiaoyin/south_street2"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,1,0]},"/d/qiaoyin/south_street2":{"id":"/d/qiaoyin/south_street2","file":"source/upstream/mudlib/d/qiaoyin/south_street2.c","short":"南大街","long":"南大街的南段，西邊是金水客棧，客棧門口常有往來的江湖人物進出，腰間佩刀掛劍，神色各異。街邊幾名穿著儒衫的年輕人正高聲談論著詩文，看來是哪家書院的弟子，路人也不禁駐足聆聽。","exits":{"north":"/d/qiaoyin/south_street1","west":"/d/qiaoyin/inn","south":"/d/qiaoyin/sgate"},"objects":{"/d/qiaoyin/npc/apprentice":3},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,2,0]},"/d/qiaoyin/tree_tomb":{"id":"/d/qiaoyin/tree_tomb","file":"source/upstream/mudlib/d/qiaoyin/tree_tomb.c","short":"樹王墳","long":"這裡便是喬陰縣著名的樹王墳了﹐一株約十多人合抱的大樹齊腰而斷﹐上面的紋理因為經常被撫摸而清晰可見﹐樹王墳的周圍方圓數十丈內都沒有建築﹐顯然縣城的居民對樹王墳十分崇敬﹐樹旁立著一塊石碑﹐上面刻得有字。","exits":{"west":"/d/qiaoyin/west_street4","east":"/d/qiaoyin/east_street1","north":"/d/qiaoyin/north_street3","south":"/d/qiaoyin/south_street1"},"objects":{"/d/qiaoyin/npc/fortune_teller":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-3,0,0]},"/d/qiaoyin/west_lane1":{"id":"/d/qiaoyin/west_lane1","file":"source/upstream/mudlib/d/qiaoyin/west_lane1.c","short":"街道","long":"西門內的一條街道，路面鋪著青石板，兩旁是低矮的民宅，牆角長滿了青苔。這裡離城門不遠，常可以聽見守城官兵換班時的吆喝聲，住在附近的人家對此早已習以為常。","exits":{"north":"/d/qiaoyin/wgate","south":"/d/qiaoyin/west_lane2"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-7,-2,0]},"/d/qiaoyin/west_lane2":{"id":"/d/qiaoyin/west_lane2","file":"source/upstream/mudlib/d/qiaoyin/west_lane2.c","short":"街道","long":"西大街北邊的一條街道，西邊有一間書肆，門口掛著一塊寫著「名山書肆」的舊招牌，偶爾可以聞到從裡面飄出來的墨香。街角蹲著一個衣衫襤褸的老婦人，向路過的行人伸手乞討。","exits":{"north":"/d/qiaoyin/west_lane1","west":"/d/qiaoyin/bookstore","south":"/d/qiaoyin/west_street1"},"objects":{"/d/qiaoyin/npc/crone":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-7,-1,0]},"/d/qiaoyin/west_street1":{"id":"/d/qiaoyin/west_street1","file":"source/upstream/mudlib/d/qiaoyin/west_street1.c","short":"西大街","long":"西大街的西端，街角有幾個孩童在玩耍，不時傳來嬉笑聲，一隻黃狗懶洋洋地趴在牆邊曬太陽。路旁的屋簷下掛著一串串風乾的辣椒和玉米，看來這一帶住的多是尋常百姓人家。","exits":{"north":"/d/qiaoyin/west_lane2","east":"/d/qiaoyin/west_street2"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-7,0,0]},"/d/qiaoyin/west_street2":{"id":"/d/qiaoyin/west_street2","file":"source/upstream/mudlib/d/qiaoyin/west_street2.c","short":"西大街","long":"西大街上人來人往，路邊擺著幾個賣菜賣果子的攤子，攤販們扯著嗓子招攬生意，偶爾還有官府的差役穿過人群。地上散落著菜葉和果皮，幾隻雞在攤子底下啄食，熱鬧中帶著幾分雜亂。","exits":{"west":"/d/qiaoyin/west_street1","east":"/d/qiaoyin/west_street3"},"objects":{"/custom/legacy_npc/chaxigol":1},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-6,0,0]},"/d/qiaoyin/west_street3":{"id":"/d/qiaoyin/west_street3","file":"source/upstream/mudlib/d/qiaoyin/west_street3.c","short":"西大街","long":"西大街的中段，南邊是一間氣派的錢莊，朱漆大門上釘著一排銅釘，門口站著幾名護院武師，目光不住地打量著來往的行人。錢莊對面的牆根下，幾個閒漢倚著牆曬太陽，不時朝錢莊門口張望。","exits":{"west":"/d/qiaoyin/west_street2","east":"/d/qiaoyin/west_street4","north":"/d/qiaoyin/mid_lane2","south":"/d/qiaoyin/bank"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-5,0,0]},"/d/qiaoyin/west_street4":{"id":"/d/qiaoyin/west_street4","file":"source/upstream/mudlib/d/qiaoyin/west_street4.c","short":"西大街","long":"西大街的東端，遠遠就能望見城中心那株齊腰而斷的大樹。這一帶的店家多半賣些香燭紙錢，據說是給前往樹王墳祭拜的人準備的，整條街的空氣中總帶著一股淡淡的檀香味。","exits":{"west":"/d/qiaoyin/west_street3","east":"/d/qiaoyin/tree_tomb"},"objects":{},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-4,0,0]},"/d/qiaoyin/wgate":{"id":"/d/qiaoyin/wgate","file":"source/upstream/mudlib/d/qiaoyin/wgate.c","short":"喬陰縣城西門","long":"這裡是喬陰縣城的西門，西門的城樓是喬陰縣城四個城門中最完整的，城牆並不甚高，但是縱深極深，從城樓這端到另一端足足有二十多丈，兩重鐵柵門，四重護城門，當初建造這裡的城樓時正是北方大山裡青邪起兵侵擾最烈的時候，因此城樓建得格外堅固。往西出城門的大路可以通往五堂鎮。","exits":{"west":"/d/qiaoyin/highway","south":"/d/qiaoyin/west_lane1"},"objects":{"/custom/legacy_npc/han_wen_suei":1,"/obj/area/garrison":4},"special":[],"area":"喬陰縣","layer":null,"areaKey":"喬陰縣","pos":[-7,-3,0]},"/d/snow/bazar":{"id":"/d/snow/bazar","file":"source/upstream/mudlib/d/snow/bazar.c","short":"魚記小鋪","long":"這裡是一間小店鋪, 右側擺了個長架, 不甚起眼的幾件日常用品零\n零疏疏地擺在架上, 你看到了有瓶罐, 棉被, 碗盤竹筷等雜物, 不過上\n面隱隱有些灰塵黃土, 似乎這兒老闆不常清掃. 正廳有個大圓桌, 上面\n擺了些布匹服飾. 左側有個高大的櫃臺, 上面橫掛了個匾額  (look 匾\n額 ), 看來像是個小錢莊.","exits":{"west":"/d/snow/sstreet1"},"objects":{"/d/snow/npc/yu":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,4,0]},"/d/snow/bug_room":{"id":"/d/snow/bug_room","file":"source/upstream/mudlib/d/snow/bug_room.c","short":"小廣場","long":"這裏是個小廣場，幾棵樹稀稀落落的長在附近，中央有個小型的\n留言版，可供民眾回報所遭遇的怪異現象，往南可回到人聲鼎沸的雪\n亭鎮廣場。","exits":{"south":"/d/snow/square_w"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,1,0]},"/d/snow/court":{"id":"/d/snow/court","file":"source/upstream/mudlib/d/snow/court.c","short":"鄉校","long":"這裡是雪亭鎮的鄉校﹐平常鎮民對官府的施政有什麼不滿的可以到\n這裡來向校老申訴﹐所謂的校老就是地方上有德行與聲望的老人﹐今年\n擔任校老的是開磨坊的楊老爹﹐但是他最近身體不是很好﹐並不常到鄉\n校裡來﹐往南是街道﹐北邊是一間衙堂﹐當縣裡派師爺來這裡斷事就會\n在那裡開堂。","exits":{"south":"/d/snow/wstreet3"},"objects":{"/d/snow/npc/oldman":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-7,2,0]},"/d/snow/ebridge":{"id":"/d/snow/ebridge","file":"source/upstream/mudlib/d/snow/ebridge.c","short":"木橋","long":"你現在來到一條橫過山澗的木橋上。\n山澗雖不甚寬﹐但是深度卻有三、四丈﹐是雪亭鎮上居民主要的飲用水源。\n木橋連通溪邊小路和東邊的山路，橋面已經有些年頭了﹐不過看起來還算堅固。\n橋下的溪水正發出轟隆轟隆的巨響流過溪谷﹐往西是雪亭鎮﹐往東則通往著名的雪吟山莊。","exits":{"west":"/d/snow/npath3"},"objects":{"/d/snow/npc/guard":2,"/custom/ghost/npc/wronged_ghost":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[1,0,0]},"/d/snow/egate":{"id":"/d/snow/egate","file":"source/upstream/mudlib/d/snow/egate.c","short":"河邊","long":"破舊大宅外，你眼前是兩條河流的匯流處，來自西北、東北的兩條\n小河匯流後，緩緩的向西南流去。西北邊的河流上有一座小橋，過了橋\n，沿著東北邊河流的小石子路可以通往李家村。　","exits":{"west":"/d/snow/ruin1","northeast":"/d/lee/entrance_s"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[2,2,0]},"/d/snow/epath":{"id":"/d/snow/epath","file":"source/upstream/mudlib/d/snow/epath.c","short":"僻靜小巷","long":"這裡是條僻靜的小巷子﹐往西不遠處通往雪亭鎮的廣場﹐小巷的北\n面是一些瓦屋﹐圍繞著高高的圍牆﹐看來是有錢人的屋子﹐南邊有家小\n藥鋪﹐門口掛了好些曬乾的藥草﹐小巷往東是個轉角。","exits":{"east":"/d/snow/lane1","west":"/d/snow/square_e","south":"/d/snow/herb_shop"},"objects":{},"special":[{"cmd":"climb 圍牆","to":"/d/snow/kitchen"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-1,2,0]},"/d/snow/fireplace":{"id":"/d/snow/fireplace","file":"source/upstream/mudlib/d/snow/fireplace.c","short":"大灶內","long":"你現在正蜷縮著擠在一個大灶之中, 頭頂上方隱隱可看到煙囪的出\n口, 不過顯然沒有辦法爬出去, 這裡的牆壁因為長年燒火而變得烏黑, \n地面上積了一層厚厚的柴灰.","exits":{"out":"/d/snow/inn_kitchen"},"objects":{"/d/snow/npc/obj/woodsword":1,"/d/snow/npc/obj/woodblade":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-6,1,0]},"/d/snow/herb_shop":{"id":"/d/snow/herb_shop","file":"source/upstream/mudlib/d/snow/herb_shop.c","short":"小藥鋪","long":"這裡是一間小藥鋪﹐連像樣一點的招牌都沒有﹐只在門邊掛著一塊\n不甚起眼的木牌﹐上面寫著「順生堂」三個字﹐老舊的櫃臺後面陳列著\n一列藥櫃﹐藥櫃的每個抽屜按藥鋪的規矩都沒有任何標籤﹐西面的牆上\n吊著幾束曬乾的甘草﹐像這種小藥鋪沒有錢燒檀香祛除藥味﹐只好用甘\n草替代。","exits":{"north":"/d/snow/epath"},"objects":{"/d/snow/npc/herbalist":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-1,3,0]},"/d/snow/inn_hall":{"id":"/d/snow/inn_hall","file":"source/upstream/mudlib/d/snow/inn_hall.c","short":"客棧大堂","long":"這裡是一家客棧的大堂﹐老舊的桌椅因為經年的使用而變得烏黑黝亮。\n西邊隔著一層竹簾隱隱傳來一陣陣鍋鏟的聲音﹐大概是客棧的廚房。\n靠北邊的牆壁邊上有一道通往二樓雅座的樓梯﹐樓梯下就是櫃臺。\n東邊是客棧的出口﹐門口一串紙糊燈籠隨風搖擺﹐上面寫著「飲風客棧」：\n意思是即使你沒有錢﹐也歡迎來這裡聊天聽書﹐喝西北風。\n西南邊有一扇木門通往客棧後面的馬房。","exits":{"west":"/d/snow/inn_kitchen","east":"/d/snow/square_w"},"objects":{"/d/snow/npc/waiter":1,"/d/snow/npc/innkeeper":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-5,2,0]},"/d/snow/inn_kitchen":{"id":"/d/snow/inn_kitchen","file":"source/upstream/mudlib/d/snow/inn_kitchen.c","short":"廚房","long":"這裡是一間寬敞的廚房﹐一座大灶佔據了東邊半個牆壁﹐南邊的櫃\n子整整齊齊地放著許多鍋碗瓢盆﹐這裡平常是相當忙碌的﹐如果你要在\n這裡東張西望的話﹐最好小心別被店小二端著的熱湯給燙到了﹐往東可\n以回到客棧裡。","exits":{"east":"/d/snow/inn_hall"},"objects":{},"special":[{"cmd":"enter 大灶","to":"/d/snow/fireplace"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-6,2,0]},"/d/snow/inn_staff_room":{"id":"/d/snow/inn_staff_room","file":"source/upstream/mudlib/d/snow/inn_staff_room.c","short":"客棧人員休息室","long":"這裡是飲風客棧後院的員工休息室，供 NPC 員工休息和放鬆。\n普通玩家無法進入這裡，巫師可以在這裡休息，或者和 NPC 員工聊天，了解客棧的內部運作。","exits":{},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮"},"/d/snow/kitchen":{"id":"/d/snow/kitchen","file":"source/upstream/mudlib/d/snow/kitchen.c","short":"廚房","long":"你現在正在一戶有錢人家的廚房裡﹐不過和你想像中的有錢人家廚\n房好像不太一樣﹐並沒有堆滿了雞鴨魚肉跟山珍海味﹐想來有錢人也是\n省吃儉用才能有錢的﹐廚房的門在你的南邊﹐不過鎖住了﹐東邊則是你\n進來的圍牆。","exits":{},"objects":{"/obj/food/dumpling":2},"special":[{"cmd":"climb 圍牆","to":"/d/snow/epath"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-1,1,0]},"/d/snow/lane1":{"id":"/d/snow/lane1","file":"source/upstream/mudlib/d/snow/lane1.c","short":"僻靜小巷","long":"這裡是條僻靜小巷的轉角處﹐小巷往北可以通往溪邊﹐從這裡就可\n以聽到溪流轟轟的聲音﹐東邊是一棟破舊的大宅院﹐門口的一的破匾寫\n著「長樂侯府」﹐不過裡面已經是斷垣殘璧了﹐小巷南邊有一座小土地\n公廟。","exits":{"north":"/d/snow/lane2","west":"/d/snow/epath","east":"/d/snow/ruin1"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[0,2,0]},"/d/snow/lane2":{"id":"/d/snow/lane2","file":"source/upstream/mudlib/d/snow/lane2.c","short":"溪邊小路","long":"你現在來到一處巷子的入口﹐往北通往一條溪邊的小路﹐西邊是一\n棟大瓦屋﹐大門深鎖著﹐東邊有一家磨坊﹐磨坊屋旁一個水車正轆轆地\n轉著﹐往南通往巷子裡的一個轉角。","exits":{"south":"/d/snow/lane1","north":"/d/snow/npath3"},"objects":{},"special":[{"cmd":"enter 磨坊","to":"/d/snow/mill"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[0,1,0]},"/d/snow/mill":{"id":"/d/snow/mill","file":"source/upstream/mudlib/d/snow/mill.c","short":"磨坊","long":"這裡是一間以磨麵粉為業的磨坊﹐屋子裡一大半的空間被一架水車\n佔據﹐水車轉動橫過屋樑上的木軸﹐木軸推動幾個絞盤轉動屋子中央的\n石磨﹐房子的另一角堆放著一些空的麻袋。","exits":{"out":"/d/snow/lane2"},"objects":{"/d/snow/npc/miller":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[1,1,0]},"/d/snow/ngate":{"id":"/d/snow/ngate","file":"source/upstream/mudlib/d/snow/ngate.c","short":"山路","long":"你現在正走在一條蜿蜒的山路上﹐往南不遠處可以看見許多人家和\n房舍﹐往北則通往山上﹐山路兩旁長滿雜草﹐靠西的一面是山壁﹐東邊\n是平緩的山坡﹐山坡盡頭是一片草地。","exits":{"south":"/d/snow/nstreet2"},"objects":{"/d/snow/npc/garrison":4,"/d/snow/npc/lieutenant":1,"/custom/ghost/npc/tiger_thrall":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,-2,0]},"/d/snow/npath1":{"id":"/d/snow/npath1","file":"source/upstream/mudlib/d/snow/npath1.c","short":"小路","long":"這裡是一條黃土小路﹐往西可以回到雪亭鎮的主要街道﹐北邊是一\n片草地﹐草地盡頭則是一片樹林﹐往東你可以聽到淙淙的水聲﹐不遠處\n可以望見一條山溪。","exits":{"east":"/d/snow/npath2","west":"/d/snow/nstreet2"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,-1,0]},"/d/snow/npath2":{"id":"/d/snow/npath2","file":"source/upstream/mudlib/d/snow/npath2.c","short":"溪邊小路","long":"這裡是一條溪邊的小路﹐從這裡可以望見北邊的山間一道瀑布從崖\n上垂下﹐穿過山坡上的一片樹林﹐以及不遠處的草地﹐往你的東南邊流\n過﹐溪水衝激著溪床的岩石﹐發出轟轟的響聲﹐往西沿著小路可以回到\n雪亭鎮的大街﹐小路向東南可以通往溪邊。","exits":{"southeast":"/d/snow/npath3","west":"/d/snow/npath1"},"objects":{"/d/snow/npc/woman":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-1,-1,0]},"/d/snow/npath3":{"id":"/d/snow/npath3","file":"source/upstream/mudlib/d/snow/npath3.c","short":"溪邊小路","long":"你現在來到一條溪流邊上的小路﹐溪水流過佈滿石塊的河床發出轟\n轟的聲音﹐一條木橋跨過溪流往東通往鎮外的小路﹐沿著溪邊往南不遠\n處則可以望見一間磨坊。北邊一條小路可以下到溪谷中。","exits":{"north":"/d/snow/river1","south":"/d/snow/lane2","northwest":"/d/snow/npath2","east":"/d/snow/ebridge"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[0,0,0]},"/d/snow/nstreet1":{"id":"/d/snow/nstreet1","file":"source/upstream/mudlib/d/snow/nstreet1.c","short":"街道","long":"這裡是雪亭鎮北邊的主要街道﹐往南通往鎮上最熱鬧的廣場﹐往北\n則通往鎮北的山路﹐你的西邊都是一些賣雜貨的店鋪﹐這一帶除了市集\n的日子﹐並不常有太多人走動。你注意到東邊有一間不太顯眼的土地公\n廟。","exits":{"south":"/d/snow/square_n","north":"/d/snow/nstreet2","east":"/d/snow/small_temple"},"objects":{"/custom/ghost/npc/wandering_soul":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,0,0]},"/d/snow/nstreet2":{"id":"/d/snow/nstreet2","file":"source/upstream/mudlib/d/snow/nstreet2.c","short":"街道","long":"這裡是雪亭鎮北邊的主要街道﹐往南稍遠處便是一處廣場﹐往北可\n見一條蜿蜒的山路穿過長滿芒草的山坡通往野羊山上﹐東邊是一條小路\n通往溪邊﹐西邊則是一間驛站。","exits":{"west":"/d/snow/post_office","east":"/d/snow/npath1","south":"/d/snow/nstreet1","north":"/d/snow/ngate"},"objects":{"/obj/area/man":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,-1,0]},"/d/snow/post_office":{"id":"/d/snow/post_office","file":"source/upstream/mudlib/d/snow/post_office.c","short":"雪亭驛","long":"這裡是雪亭鎮的驛站﹐雖然驛站主要是替官府遞送文書﹐不過由於近年來\n土匪強盜出沒頻繁﹐也不少百姓會花一些錢請驛站的官員幫忙送信收信，喬陰\n縣的縣令認為土匪擾民是官府的施政缺失，驛站若是還收百姓的錢，實在是受\n之有愧，索性下令縣內驛站對百姓的郵遞委託一律不得收費。\n\n如果你想要收發信，可以用 request 向驛站官員領取收發信的信札。","exits":{"east":"/d/snow/nstreet2"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,-1,0]},"/d/snow/river1":{"id":"/d/snow/river1","file":"source/upstream/mudlib/d/snow/river1.c","short":"溪邊","long":"這裡是溪流旁的亂石灘，溪流兩岸都有一丈多高，只有此處因為溪\n流彎道沖積，形成一處小石灘，水流衝激的聲音經過溪谷的回音震耳欲\n聾，往南一條小路可以回到岸邊。","exits":{"south":"/d/snow/npath3"},"objects":{"/custom/taoism/npc/fire_taoist":1,"/custom/taoism/npc/freeze_taoist":1,"/custom/taoism/npc/storm_taoist":1,"/custom/taoism/npc/thunder_taoist":1,"/custom/ghost/npc/water_goblin":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[0,-1,0]},"/d/snow/riverbank":{"id":"/d/snow/riverbank","file":"source/upstream/mudlib/d/snow/riverbank.c","short":"河邊空地","long":"這裡是河邊的一處空地﹐湍急的河流從你的北邊往東南邊流去﹐離\n這裡的河岸往北一丈多遠的地方可以看見一個水車﹐南邊則是一間破舊\n的大宅院﹐牆壁上一個大缺口足足可以讓人通過。","exits":{"south":"/d/snow/ruin2"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[2,0,0]},"/d/snow/ruin1":{"id":"/d/snow/ruin1","file":"source/upstream/mudlib/d/snow/ruin1.c","short":"破舊大宅","long":"這裡是一間破舊大宅的前院﹐大廳已經崩塌了一半﹐焦黑的樑柱擋\n住了你的去路﹐庭院裡雜草叢生﹐看來已經很久沒有人住了﹐據說這裡\n晚上有鬼魂出現﹐但是倒也從沒聽說過有人被害﹐因此附近的居民仍然\n照常生活﹐往西可以經由大宅的正門回到街上。","exits":{"west":"/d/snow/lane1","east":"/d/snow/egate"},"objects":{"/custom/ghost/npc/wandering_soul":1},"special":[{"cmd":"climb 樑柱","to":"/d/snow/ruin2"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[1,2,0]},"/d/snow/ruin2":{"id":"/d/snow/ruin2","file":"source/upstream/mudlib/d/snow/ruin2.c","short":"破舊大宅正廳","long":"這裡是一棟破舊大宅的正廳﹐北面的牆壁跟屋頂已經整個坍塌了﹐\n涼颼颼的冷風從北邊的缺口直灌進來﹐另你覺得意外的是﹐這裡清掃得\n相當整潔﹐地上用乾草整整齊齊地鋪著一個床舖﹐說是流浪漢在這裡棲\n宿卻也不像﹐哪裡會有這麼愛整潔的流浪漢﹖大廳倒塌的樑柱擋住了往\n西的出口。","exits":{"north":"/d/snow/riverbank"},"objects":{"/d/snow/npc/girl":1},"special":[{"cmd":"climb 樑柱","to":"/d/snow/ruin1"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[2,1,0]},"/d/snow/school":{"id":"/d/snow/school","file":"source/upstream/mudlib/d/snow/school.c","short":"私塾","long":"這裡是一間私塾﹐簡單的陳設與幾張排得整整齊齊的桌椅﹐就是這\n間屋子的所有傢具﹐屋角一個大書櫃﹐裡面放著許多手抄本的古書﹐不\n過書櫃的門是鎖著的﹐最前面的桌上放著文房四寶﹐與一盆小巧的盆栽\n柏樹﹐私塾的出口在北邊。","exits":{"north":"/d/snow/wstreet1"},"objects":{"/d/snow/npc/teacher":1,"/d/snow/npc/alchemist":1,"/d/snow/npc/child3":2},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-5,4,0]},"/d/snow/sgate":{"id":"/d/snow/sgate","file":"source/upstream/mudlib/d/snow/sgate.c","short":"草棚","long":"這裡是雪亭鎮南邊的入口﹐往北穿過草棚通往雪亭鎮的街道﹐出草\n棚往鎮外有兩條路﹐往東南的路穿過雪亭南方的老松林﹐通往縣城喬陰\n﹐這條路雖然比較近﹐但是近來一群自稱老松寨的土匪常常在這一帶出\n沒﹐往西的一條沿著老松林外的大路通往鄰近的五堂鎮﹐從喬陰縣城往\n天邪國的商旅現在大多繞道走這一條路﹐因為往五堂鎮的路上有一處北\n軍府訓練新兵的軍營﹐常有軍士巡邏﹐攔路強人多半不敢滋事。","exits":{"north":"/d/snow/sstreet1","west":"/custom/zhenwu/room/gate","southeast":"/d/oldpine/entrance"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,5,0]},"/d/snow/small_temple":{"id":"/d/snow/small_temple","file":"source/upstream/mudlib/d/snow/small_temple.c","short":"土地公廟","long":"這裡是一處小而整潔的土地公廟，中央一座紅磚砌成的神龕裡供奉著一尊黑色臉龐的土地公神像。\n神龕前有一個黃銅香爐，幾注線香伴隨著輕煙散發出一種安詳的氛圍。","exits":{"west":"/d/snow/nstreet1"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,0,0]},"/d/snow/smithy":{"id":"/d/snow/smithy","file":"source/upstream/mudlib/d/snow/smithy.c","short":"打鐵鋪子","long":"這裡是一間打鐵鋪子﹐牆上掛了許多鐵器的半成品跟工具﹐鋪子中\n間一個燒著熊熊火燄的火爐映得你在牆上的影子一晃一晃的﹐旁邊還有\n一個沈重的大鐵砧﹐鋪子的出口就在東邊。","exits":{"west":"/d/snow/square_s"},"objects":{"/d/snow/npc/smith":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,3,0]},"/d/snow/square":{"id":"/d/snow/square","file":"source/upstream/mudlib/d/snow/square.c","short":"廣場中央","long":"這裡是雪亭鎮廣場的中央﹐一株巨大的老榕樹盤根錯結地站在中央\n﹐一些孩童常常爬上這株老榕嬉戲﹐榕樹下七橫八豎地放著幾張長凳供\n人歇息聊天﹐樹旁還有一個水缸供路人取水解渴。","exits":{"east":"/d/snow/square_e","north":"/d/snow/square_n","west":"/d/snow/square_w","south":"/d/snow/square_s"},"objects":{"/d/snow/npc/obj/pot":1,"/d/snow/npc/gammer":1,"/d/snow/npc/junkman":1,"/custom/ghost/npc/hungry_ghost":2},"special":[{"cmd":"climb 榕樹","to":"/d/snow/tree"}],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,2,0]},"/d/snow/square_e":{"id":"/d/snow/square_e","file":"source/upstream/mudlib/d/snow/square_e.c","short":"廣場","long":"這裡是雪亭鎮廣場東邊﹐往東是一條僻靜的巷子﹐西邊有一株高大\n的榕樹﹐南邊是一家打鐵鋪子﹐不過店門不在這一邊。","exits":{"east":"/d/snow/epath","west":"/d/snow/square"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,2,0]},"/d/snow/square_n":{"id":"/d/snow/square_n","file":"source/upstream/mudlib/d/snow/square_n.c","short":"廣場","long":"這裡是雪亭鎮廣場北邊﹐平常是附近孩童嬉戲遊玩的地方﹐初一十\n五則是市集的所在﹐往南可以看見一株大榕樹﹐往北則是一條筆直的街\n道。","exits":{"north":"/d/snow/nstreet1","south":"/d/snow/square"},"objects":{"/d/snow/npc/child1":1,"/d/snow/npc/child2":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,1,0]},"/d/snow/square_s":{"id":"/d/snow/square_s","file":"source/upstream/mudlib/d/snow/square_s.c","short":"廣場","long":"這裡是雪亭鎮廣場的南邊﹐往北可以望見一株高大的榕樹﹐廣場以\n榕樹為中心形成一個十多丈見方的大空地﹐街道往南通往鎮外﹐東邊不\n遠處有間打鐵鋪子。","exits":{"west":"/d/snow/square_sw","east":"/d/snow/smithy","north":"/d/snow/square","south":"/d/snow/sstreet1"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,3,0]},"/d/snow/square_sw":{"id":"/d/snow/square_sw","file":"source/upstream/mudlib/d/snow/square_sw.c","short":"廣場","long":"這裡是雪亭鎮廣場的西南邊﹐廣場中央的大榕樹就在你的東北方不\n遠處﹐這裡的北邊可以看見一家客棧﹐往西是一條街道﹐東邊穿過一個\n路口可看見一家打鐵鋪子。","exits":{"west":"/d/snow/wstreet1","east":"/d/snow/square_s","north":"/d/snow/square_w"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,3,0]},"/d/snow/square_w":{"id":"/d/snow/square_w","file":"source/upstream/mudlib/d/snow/square_w.c","short":"廣場","long":"這裡是雪亭鎮廣場的西邊﹐往東可以看見廣場中央的大榕樹。 \n一家小客棧座落在西邊不遠處﹐客棧前的一串燈籠上寫著「飲風客棧」四個大字。\n廣場上鋪著整齊的石板，在這樣的小鎮通常是因為驛站的緣故才會費事鋪設。","exits":{"south":"/d/snow/square_sw","west":"/d/snow/inn_hall","east":"/d/snow/square","north":"/d/snow/bug_room"},"objects":{"/d/snow/obj/stone":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,2,0]},"/d/snow/sstreet1":{"id":"/d/snow/sstreet1","file":"source/upstream/mudlib/d/snow/sstreet1.c","short":"街道","long":"這裡是雪亭鎮南邊連接鎮外的街道﹐西邊有一間貨棧﹐東邊則是一\n家雜貨鋪﹐街道往北通往廣場南邊﹐往南穿過一個草棚出鎮外。","exits":{"south":"/d/snow/sgate","north":"/d/snow/square_s","west":"/d/snow/store","east":"/d/snow/bazar"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-3,4,0]},"/d/snow/store":{"id":"/d/snow/store","file":"source/upstream/mudlib/d/snow/store.c","short":"貨棧","long":"這裡是一間貨棧﹐也是旅行客商們儲放貨物﹐運送、轉交的地方﹐\n雪亭鎮因為位於通往天邪國的重要道路﹐所以貨棧往來的貨物相當的多\n﹐因此成為少數幾個設有貨棧的村鎮﹐天朝各地的貨棧大多數都互相連\n繫﹐因此商業十分發達﹐忙碌的貨棧也常常是缺錢的人打零工的地方﹐\n因為貨棧的工作量不固定﹐有大批貨物進來的時候往往需要平常十幾倍\n的人手﹐但是貨棧的利潤又雇不起長期的工人。","exits":{"east":"/d/snow/sstreet1"},"objects":{"/d/snow/npc/foreman":1,"/d/snow/npc/obj/wagon":1,"/d/snow/npc/obj/crate":3},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-4,4,0]},"/d/snow/tree":{"id":"/d/snow/tree","file":"source/upstream/mudlib/d/snow/tree.c","short":"榕樹上","long":"你現在正在一株巨大的榕樹上﹐茂密的枝葉搔得你有些發癢﹐前面\n一根粗大的樹枝上有人放著一塊墊子。","exits":{"down":"/d/snow/square"},"objects":{"/d/snow/npc/child":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-2,1,0]},"/d/snow/wgate":{"id":"/d/snow/wgate","file":"source/upstream/mudlib/d/snow/wgate.c","short":"雪亭鎮","long":"這裡是雪亭鎮西邊的官道﹐雖然雪亭驛設在鎮上的北邊﹐但是官道\n卻是從西邊入雪亭﹐因為原來修官道時利用了一段從前中陽侯征奐族亂\n軍的棧道﹐因此上這條官道便從西邊穿過山谷接古中陽棧道﹐出黃石隘\n﹐往東通往雪亭鎮的街道﹐往西則出鎮。","exits":{"east":"/d/snow/wstreet3"},"objects":{"/custom/ghost/npc/mountain_sprite":1},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-8,3,0]},"/d/snow/wstreet1":{"id":"/d/snow/wstreet1","file":"source/upstream/mudlib/d/snow/wstreet1.c","short":"街道","long":"這裡是雪亭鎮廣場西邊的街道﹐往北是一間客棧﹐不過這個方向沒\n有入口﹐南邊一間青瓦屋﹐門口灑掃得乾乾淨淨﹐似是家私塾模樣﹐往\n西的街道十分寬敞﹐路上還有車馬經過壓出來的溝痕。","exits":{"south":"/d/snow/school","east":"/d/snow/square_sw","west":"/d/snow/wstreet2"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-5,3,0]},"/d/snow/wstreet2":{"id":"/d/snow/wstreet2","file":"source/upstream/mudlib/d/snow/wstreet2.c","short":"街道","long":"這裡是雪亭鎮西邊的街道﹐北邊是一間看起來像是客棧的大屋，圍\n牆上曬著一些陳舊卻潔白的衣服。南邊有間青瓦屋，幾株大樹從圍牆內\n探出頭來。","exits":{"east":"/d/snow/wstreet1","west":"/d/snow/wstreet3"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-6,3,0]},"/d/snow/wstreet3":{"id":"/d/snow/wstreet3","file":"source/upstream/mudlib/d/snow/wstreet3.c","short":"街道","long":"這裡是雪亭鎮西邊的街道﹐北邊是雪亭鎮的鄉校﹐平常會有一些鎮\n上的長者在這裡談論鎮上的閒事﹐縣裡若有公爺來這裡斷事﹐也是在這\n裡設的公堂﹐往西不遠處就是出鎮的官道﹐街道南邊是一家糕餅鋪。","exits":{"north":"/d/snow/court","east":"/d/snow/wstreet2","west":"/d/snow/wgate"},"objects":{},"special":[],"area":"雪亭鎮","layer":null,"areaKey":"雪亭鎮","pos":[-7,3,0]},"/d/wutang/backyard":{"id":"/d/wutang/backyard","file":"source/upstream/mudlib/d/wutang/backyard.c","short":"後院","long":"這裡是民房的後院，在後院裡有養著各式各樣的家畜，而在不遠的前方也有著一條很清澈的小溪，通常這也是這地方人家洗衣服和用水的小溪，而在小溪中也有幾隻小魚，溪中也有鴨子在上面玩水。","exits":{"north":"/d/wutang/path_e"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[6,0,0]},"/d/wutang/bamboo_grove":{"id":"/d/wutang/bamboo_grove","file":"source/upstream/mudlib/d/wutang/bamboo_grove.c","short":"綠竹林","long":"一片茂密的綠竹林，修長的竹子直入雲霄，竹葉沙沙作響，陽光從縫隙間灑落下來，顯得格外清幽。往北隱約可以看見一間綠竹搭成的小屋，往回走則要穿過那一大叢草叢。","exits":{"north":"/d/wutang/bamboo_hall"},"objects":{},"special":[{"cmd":"pass 草叢","to":"/d/wutang/gravel_road_n"}],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-3,4,0]},"/d/wutang/bamboo_hall":{"id":"/d/wutang/bamboo_hall","file":"source/upstream/mudlib/d/wutang/bamboo_hall.c","short":"主廳","long":"這是一間綠竹所造的小屋, 簡單的擺設中流露出異於凡俗的清幽雅緻, 東西兩側兩扇小窗引進樹林的淡淡清香繚繞室內, 幾張竹桌竹椅整齊的排在屋內, 竹桌上還泡著一壺清茶, 和一籃水果。","exits":{"south":"/d/wutang/bamboo_grove"},"objects":{"/d/wutang/npc/huyen_guan":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-3,3,0]},"/d/wutang/bank":{"id":"/d/wutang/bank","file":"source/upstream/mudlib/d/wutang/bank.c","short":"景隆錢莊","long":"五堂鎮最大的景隆錢莊，櫃臺後的夥計正噼哩啪啦地打著算盤，牆上掛著一塊「信義通商」的金字匾額。幾名身材魁梧的護院武師守在門口與內堂，讓人不敢有非分之想。在這裡可以存款、提款，也可以兌換銀兩。","exits":{"north":"/d/wutang/east_street1"},"objects":{"/d/wutang/npc/guard":4},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[1,3,0]},"/d/wutang/boardwalk_e":{"id":"/d/wutang/boardwalk_e","file":"source/upstream/mudlib/d/wutang/boardwalk_e.c","short":"木道","long":"木板步道的東段，木板已經有些老舊，縫隙間長出了青苔。往北是一片放牧著綿羊的草原，常能聽見羊群咩咩的叫聲，往東接到三岔路口，往西則通往鯉君渡，渡口那頭不時傳來船夫的吆喝聲。","exits":{"west":"/d/wutang/boardwalk_w","east":"/d/wutang/three_way","north":"/d/wutang/grass_se"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-1,5,0]},"/d/wutang/boardwalk_w":{"id":"/d/wutang/boardwalk_w","file":"source/upstream/mudlib/d/wutang/boardwalk_w.c","short":"木道","long":"一條用木板鋪成的步道，架在濕軟的河灘上，踩上去會發出吱吱嘎嘎的聲響。兩旁長著高過人頭的蘆葦，風一吹便沙沙作響，偶爾還會驚起幾隻水鳥。往西是鯉君渡，往東可以走往三岔路口。","exits":{"west":"/d/wutang/ferry","east":"/d/wutang/boardwalk_e"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-2,5,0]},"/d/wutang/boat":{"id":"/d/wutang/boat","file":"source/upstream/mudlib/d/wutang/boat.c","short":"小船上","long":"一艘用稻草搭著篷子的小草船，靜靜地停在羿水河心，隨著水波緩緩搖晃。船頭擱著一根釣竿，船上的人似乎已經在這裡垂釣了很久。四周都是河水，想回岸邊只能游回去。","exits":{},"objects":{"/d/wutang/npc/smoke_fisher":1},"special":[{"cmd":"swim","to":"/d/wutang/riverside"}],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-5,4,0]},"/d/wutang/city_god_temple":{"id":"/d/wutang/city_god_temple","file":"source/upstream/mudlib/d/wutang/city_god_temple.c","short":"城隍廟","long":"五堂鎮的城隍廟，是地方上的信仰中心，香火終年不斷。正殿供奉著身穿紫紅官服的城隍爺神像，兩旁站著牛頭馬面，神情威嚴。香案上擺滿了鎮民供奉的鮮花素果，裊裊的香煙中透著一股肅穆的氣氛。","exits":{"west":"/d/wutang/east_street4"},"objects":{"/d/wutang/npc/town_god":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[5,2,0]},"/d/wutang/clearing":{"id":"/d/wutang/clearing","file":"source/upstream/mudlib/d/wutang/clearing.c","short":"空地","long":"菜田前的一片空地，地上留著許多雜亂的蹄印，看來常有野豬從菜田那頭跑過來。空地邊緣擺著幾個用來嚇唬野豬的稻草人，可惜看來沒什麼用處。往西就是一大片菜田，往南則是通往五堂鎮的碎石路。","exits":{"west":"/d/wutang/field5","south":"/d/wutang/gravel_road_n"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-3,1,0]},"/d/wutang/cloth_shop":{"id":"/d/wutang/cloth_shop","file":"source/upstream/mudlib/d/wutang/cloth_shop.c","short":"布莊","long":"一家不大的布莊，架子上堆滿了一疋疋的布料，從粗棉布到上好的綢緞應有盡有。櫃臺上攤開著幾疋顏色鮮豔的花布，是老闆娘李美麗最得意的貨色，常有姑娘家在這裡流連忘返。往南可以回到街道。","exits":{"south":"/d/wutang/east_street3"},"objects":{"/d/wutang/npc/tao":1,"/d/wutang/npc/young_gentleman":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[3,1,0]},"/d/wutang/crossroad":{"id":"/d/wutang/crossroad","file":"source/upstream/mudlib/d/wutang/crossroad.c","short":"交叉路口","long":"這裡是五堂鎮廟口大街的一處交叉路口﹐廟口大街往東西延伸﹐路口中央立著一根高大的鐵旗桿﹐據說是鎮上雍家的先祖所立﹐幾百年來已成為五堂鎮的地標之一﹐街道往東西南北都相當熱鬧﹐人來人往﹐由於五堂鎮位當喬陰縣的水路要衝﹐因此這裡的繁華景象和縣城比起來是毫不遜色。","exits":{"west":"/d/wutang/west_street1","east":"/d/wutang/east_street1","north":"/d/wutang/north_street","south":"/d/wutang/south_street1"},"objects":{"/d/wutang/npc/seller":1,"/d/wutang/npc/guo_boo":1,"/d/wutang/npc/may_yin_fong":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[0,2,0]},"/d/wutang/dark_alley_e":{"id":"/d/wutang/dark_alley_e","file":"source/upstream/mudlib/d/wutang/dark_alley_e.c","short":"暗巷","long":"這是一條非常陰冷的巷子，因為在兩旁的房子的中間，而巷子是非常的窄的，而陽光也是被房子所遮敝著，所以使的這非常的涼快，而巷子的盡頭傳來吵雜的聲音，也看得到那一頭人來人往的樣子。","exits":{"east":"/d/wutang/temple_road_s","west":"/d/wutang/dark_alley_w"},"objects":{"/d/wutang/npc/lee_shan":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[3,0,0]},"/d/wutang/dark_alley_w":{"id":"/d/wutang/dark_alley_w","file":"source/upstream/mudlib/d/wutang/dark_alley_w.c","short":"暗巷","long":"暗巷的另一頭，兩旁的牆壁高得幾乎遮住了天空，地上滿是積水與垃圾，散發出一股霉味。巷子到這裡就到了盡頭，往東可以走回巷口，隱約還聽得到市集那頭傳來的吵雜聲。","exits":{"east":"/d/wutang/dark_alley_e"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[2,0,0]},"/d/wutang/east_street1":{"id":"/d/wutang/east_street1","file":"source/upstream/mudlib/d/wutang/east_street1.c","short":"街道","long":"交叉路口東邊的廟口大街，街上人潮不斷，兩旁的店鋪招牌林立。往南是一間門面氣派的錢莊，門口站著幾個身材魁梧的護院，往東沿著大街可以走到醇雨樓客棧。","exits":{"west":"/d/wutang/crossroad","east":"/d/wutang/east_street2","south":"/d/wutang/bank"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[1,2,0]},"/d/wutang/east_street2":{"id":"/d/wutang/east_street2","file":"source/upstream/mudlib/d/wutang/east_street2.c","short":"街道","long":"廟口大街的中段，北邊就是三層樓高的醇雨樓客棧，飯菜的香味不時從客棧裡飄出來，引得路人頻頻回頭。街上的行人多半是往來的旅客與商販，十分熱鬧。","exits":{"west":"/d/wutang/east_street1","east":"/d/wutang/east_street3","north":"/d/wutang/inn"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[2,2,0]},"/d/wutang/east_street3":{"id":"/d/wutang/east_street3","file":"source/upstream/mudlib/d/wutang/east_street3.c","short":"街道","long":"廟口大街往東延伸的一段，北邊是一間布莊，門口掛著五顏六色的布疋，南邊則是官府設的五堂別館，門口立著兩隻石獅子，顯得十分莊重。往西是熱鬧的大街，往東則通往城隍廟的方向。","exits":{"west":"/d/wutang/east_street2","east":"/d/wutang/east_street4","north":"/d/wutang/cloth_shop","south":"/d/wutang/guesthouse"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[3,2,0]},"/d/wutang/east_street4":{"id":"/d/wutang/east_street4","file":"source/upstream/mudlib/d/wutang/east_street4.c","short":"街道","long":"廟口大街的東端，再往東走就是香火鼎盛的城隍廟，空氣中飄著淡淡的香煙味。往東北可以通往雲棧市集廣場，市集那頭的吵雜聲遠遠就能聽見。","exits":{"west":"/d/wutang/east_street3","east":"/d/wutang/city_god_temple","northeast":"/d/wutang/market_square"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[4,2,0]},"/d/wutang/entrance":{"id":"/d/wutang/entrance","file":"source/upstream/mudlib/d/wutang/entrance.c","short":"五堂鎮口","long":"這裡是五堂鎮的鎮口，幾輛人力車整齊地停在路邊，車伕們一邊擦汗一邊招攬客人，等著把旅客送往附近的城鎮。往北是振武軍營的方向，往南走就進入五堂鎮了。","exits":{"north":"/custom/zhenwu/room/gate","south":"/d/wutang/north_street"},"objects":{"/d/wutang/npc/young_man":1,"/d/wutang/npc/old_fire":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[0,0,0]},"/d/wutang/ferry":{"id":"/d/wutang/ferry","file":"source/upstream/mudlib/d/wutang/ferry.c","short":"鯉君渡","long":"這裡是前往水嵐縣的鯉君渡，河岸邊停泊著幾艘渡船，船夫們吆喝著招攬過河的旅客。往北走下河堤，便是緊鄰河面的渡口，往東則是一條通往三岔路口的木道。","exits":{"east":"/d/wutang/boardwalk_w","northdown":"/d/wutang/ferry_dock"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-3,5,0]},"/d/wutang/ferry_dock":{"id":"/d/wutang/ferry_dock","file":"source/upstream/mudlib/d/wutang/ferry_dock.c","short":"鯉君渡口","long":"這裡是來往喬陰縣和水嵐縣的主要交通要衝，在喬陰縣和水嵐縣發展的越來越具規模之後，鯉君渡也變得越來越繁榮，相傳鯉君渡這渡口的由來是在寒於氏死後靈魂化身的十三精靈之一的川鬼「濁魚」因羿水這裡山靈水秀而在這裡安定下來，由於本身所具有對於山川河水的神祕能力，使的原本急湍旋流很多的羿水成為一條穩定的河川，後人為了緬懷祂們，尊稱祂們為鯉君，更在這裡設立一個鯉君渡，讓過往的旅客能受祂們的庇佑安全渡過羿水。","exits":{"southup":"/d/wutang/ferry","southeast":"/d/wutang/river_bank"},"objects":{"/d/wutang/npc/fisher":2},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-3,6,0]},"/d/wutang/field1":{"id":"/d/wutang/field1","file":"source/upstream/mudlib/d/wutang/field1.c","short":"菜田","long":"一大片菜田，田裡種著白菜、蘿蔔與青蔥，只是不少菜苗被翻得東倒西歪，地上滿是野豬的蹄印與拱出來的土坑。田埂上插著幾根削尖的竹竿，似乎是主人用來防範野豬的。往西是菜田主人的草屋。","exits":{"west":"/d/wutang/hut","south":"/d/wutang/field2"},"objects":{"/d/wutang/npc/big_boar":1,"/d/wutang/npc/boar":2},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-5,-1,0]},"/d/wutang/field2":{"id":"/d/wutang/field2","file":"source/upstream/mudlib/d/wutang/field2.c","short":"菜田","long":"菜田的中央，一畦畦的菜圃整齊排列，卻被野豬啃得七零八落，田邊的竹籬笆也被撞出了好幾個破洞。四周不時傳來野豬哼哼的叫聲，田裡的泥土被翻得亂七八糟，一不小心就會踩進泥坑裡，往北、往東、往南都還是菜田。","exits":{"north":"/d/wutang/field1","east":"/d/wutang/field3","south":"/d/wutang/field4"},"objects":{"/d/wutang/npc/boar":3},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-5,0,0]},"/d/wutang/field3":{"id":"/d/wutang/field3","file":"source/upstream/mudlib/d/wutang/field3.c","short":"菜田","long":"菜田的東北角，這裡種的是一排排的豆藤，竹架子歪歪斜斜，有些已經被拱倒在地。泥地裡散落著被咬了一半的瓜果，引來了一群蒼蠅嗡嗡作響。往西、往南都還是菜田，幾隻野豬正埋頭在田裡大快朵頤。","exits":{"west":"/d/wutang/field2","south":"/d/wutang/field5"},"objects":{"/d/wutang/npc/boar":3},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-4,0,0]},"/d/wutang/field4":{"id":"/d/wutang/field4","file":"source/upstream/mudlib/d/wutang/field4.c","short":"菜田","long":"菜田的西南角，地上的蘿蔔幾乎都被野豬拱了出來，只剩下一個個坑洞。看來菜田主人對這群野豬實在是束手無策。田邊的水溝已經被泥土填平了一半，往北、往東還有更多被糟蹋的菜圃。","exits":{"north":"/d/wutang/field2","east":"/d/wutang/field5"},"objects":{"/d/wutang/npc/boar":3},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-5,1,0]},"/d/wutang/field5":{"id":"/d/wutang/field5","file":"source/upstream/mudlib/d/wutang/field5.c","short":"菜田","long":"菜田的東側，往東就是菜田前的空地。田裡的作物被踩得亂七八糟，泥地上的蹄印一路延伸到空地那頭。田邊幾棵果樹的樹皮被啃得斑斑駁駁，往西、往北都是一片狼藉的菜田。","exits":{"west":"/d/wutang/field4","north":"/d/wutang/field3","east":"/d/wutang/clearing"},"objects":{"/d/wutang/npc/boar":2},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-4,1,0]},"/d/wutang/grass_ne":{"id":"/d/wutang/grass_ne","file":"source/upstream/mudlib/d/wutang/grass_ne.c","short":"草原","long":"草原上微風徐徐，牧羊人倚著一根木杖看著羊群，偶爾吹起口哨把走遠的綿羊趕回來。往西、往南都還是一望無際的草地，草叢中不時竄出幾隻野兔，又飛快地鑽進草堆裡不見蹤影。","exits":{"west":"/d/wutang/grass_nw","south":"/d/wutang/grass_se"},"objects":{"/d/wutang/npc/sheep":2,"/d/wutang/npc/shepherd":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-1,3,0]},"/d/wutang/grass_nw":{"id":"/d/wutang/grass_nw","file":"source/upstream/mudlib/d/wutang/grass_nw.c","short":"草原","long":"一片青翠的草原，綠草長得又密又嫩，幾隻綿羊低著頭悠閒地吃著草，不時發出咩咩的叫聲。草原往東、往南延伸，遠處看得見五堂鎮的屋頂。草地上開著一些不知名的小黃花，偶爾有蝴蝶飛舞其間，十分恬靜。","exits":{"east":"/d/wutang/grass_ne","south":"/d/wutang/grass_sw"},"objects":{"/d/wutang/npc/sheep":2},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-2,3,0]},"/d/wutang/grass_se":{"id":"/d/wutang/grass_se","file":"source/upstream/mudlib/d/wutang/grass_se.c","short":"草原","long":"草原的東南角，這裡的草被羊群啃得短短的，露出一塊塊泥土。往南可以走上通往三岔路口的木道，往北、往西則是更大的草原。草地上散落著幾坨羊糞，牧羊人搭的一個小棚子歪歪斜斜地立在一旁。","exits":{"west":"/d/wutang/grass_sw","north":"/d/wutang/grass_ne","south":"/d/wutang/boardwalk_e"},"objects":{"/d/wutang/npc/sheep":2,"/d/wutang/npc/shepherd":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-1,4,0]},"/d/wutang/grass_sw":{"id":"/d/wutang/grass_sw","file":"source/upstream/mudlib/d/wutang/grass_sw.c","short":"草原","long":"草原的西南角，地勢稍低，草叢間有幾處小水窪，綿羊們聚在水邊喝水。往北、往東都是綠油油的草地。水窪邊的泥地上印滿了羊蹄印，空氣中帶著青草與泥土混合的氣味。","exits":{"north":"/d/wutang/grass_nw","east":"/d/wutang/grass_se"},"objects":{"/d/wutang/npc/sheep":2},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-2,4,0]},"/d/wutang/gravel_road_n":{"id":"/d/wutang/gravel_road_n","file":"source/upstream/mudlib/d/wutang/gravel_road_n.c","short":"碎石路","long":"一條鋪滿碎石的小路，走起來沙沙作響。西側不遠就是羿水河邊，路旁長著一大叢茂密的草叢，旁邊還有一片竹蘆，風一吹便沙沙作響，似乎可以從草叢穿過去。往東是五堂鎮的街道，往北是菜田前的空地。","exits":{"west":"/d/wutang/pavilion","east":"/d/wutang/west_street2","north":"/d/wutang/clearing","southwest":"/d/wutang/gravel_road_s"},"objects":{"/d/wutang/npc/yang_zlin":1,"/d/wutang/npc/apprentice":1},"special":[{"cmd":"pass 草叢","to":"/d/wutang/bamboo_grove"}],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-3,2,0]},"/d/wutang/gravel_road_s":{"id":"/d/wutang/gravel_road_s","file":"source/upstream/mudlib/d/wutang/gravel_road_s.c","short":"碎石路","long":"碎石路往西南延伸，路旁的雜草漸漸茂密起來，空氣中帶著河水的濕氣。遠處傳來潺潺的流水聲與船夫的吆喝聲，越往西走路面越是濕滑。往西走就是羿水河邊，往東北則可以走回五堂鎮的方向。","exits":{"west":"/d/wutang/riverside","northeast":"/d/wutang/gravel_road_n"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-4,3,0]},"/d/wutang/guesthouse":{"id":"/d/wutang/guesthouse","file":"source/upstream/mudlib/d/wutang/guesthouse.c","short":"五堂別館","long":"這裏是五堂鎮官府所設的別館，專供往來的大官休息之用，別館裏樸實雅緻的佈置，可看出鎮方樸實的一面。","exits":{"north":"/d/wutang/east_street3"},"objects":{"/d/wutang/npc/royalist":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[3,3,0]},"/d/wutang/hut":{"id":"/d/wutang/hut","file":"source/upstream/mudlib/d/wutang/hut.c","short":"草屋","long":"一間用茅草與土牆搭成的簡陋草屋，是菜田主人的住處。屋裡擺著幾件農具與一張竹床，牆角堆著剛收成的蔬菜，屋簷下掛著幾串風乾的辣椒與玉米。門板上釘著好幾塊新補上的木板，看來是被野豬撞壞過不只一次。往東就是一大片菜田。","exits":{"east":"/d/wutang/field1"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-6,-1,0]},"/d/wutang/inn":{"id":"/d/wutang/inn","file":"source/upstream/mudlib/d/wutang/inn.c","short":"醇雨樓客棧","long":"這是一家中等規模的客棧﹐樓面不甚寬闊﹐但是卻有三層樓﹐看牆面樑柱的樣子﹐大概有七、八十年的歷史了﹐大門兩側的柱子還題得有字﹐只不過龍飛鳳舞地不知道寫些什麼﹐東首有座樓梯往二樓雅座。","exits":{"south":"/d/wutang/east_street2","up":"/d/wutang/inn2"},"objects":{"/d/wutang/npc/waiter":1,"/d/wutang/npc/yung_tai":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[2,1,0]},"/d/wutang/inn2":{"id":"/d/wutang/inn2","file":"source/upstream/mudlib/d/wutang/inn2.c","short":"醇雨樓客棧二樓","long":"這裡是醇雨樓客棧的二樓，樓梯旁的蘭花增添了幾分清香，七八張木桌整齊排列，川流不息。倚著窗欄可以看到五堂鎮來往的路人，是休憩用膳喘口氣的好去處。","exits":{"down":"/d/wutang/inn","up":"/d/wutang/inn3"},"objects":{"/d/wutang/npc/white_taoist":3,"/d/wutang/npc/red_taoist":3},"special":[],"area":"五堂鎮","layer":"二樓","areaKey":"五堂鎮","pos":[2,1,1]},"/d/wutang/inn3":{"id":"/d/wutang/inn3","file":"source/upstream/mudlib/d/wutang/inn3.c","short":"醇雨樓客棧三樓","long":"這裡是醇雨樓客棧的三樓﹐佈置和二樓雅座大致差不多﹐不過樓中放了幾盆蘭花﹐更添幾分雅致﹐往下的樓梯在西邊。","exits":{"down":"/d/wutang/inn2"},"objects":{"/d/wutang/npc/jeweller":1,"/d/wutang/npc/young_scholar":1},"special":[],"area":"五堂鎮","layer":"三樓","areaKey":"五堂鎮","pos":[2,1,2]},"/d/wutang/market_square":{"id":"/d/wutang/market_square","file":"source/upstream/mudlib/d/wutang/market_square.c","short":"雲棧市集廣場","long":"這是雲棧市集廣場，在這不算廣闊的空地裡，卻是此市集最繁榮之處，不時傳來震耳欲聾的吵雜聲，真的不難想像這到底有多熱鬧，所到之處那一個地方不是人擠人，尤其是西方的雲棧客棧和北方的鎮天神廟，都是本地的名勝古蹟，而在廣場的中央有著官府所設製的公告欄是當地官府向人民宣布重要事情之用。","exits":{"north":"/d/wutang/temple_road_s","southwest":"/d/wutang/east_street4"},"objects":{"/d/wutang/npc/yaesae":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[5,1,0]},"/d/wutang/north_street":{"id":"/d/wutang/north_street","file":"source/upstream/mudlib/d/wutang/north_street.c","short":"五堂鎮","long":"從鎮口往南走，街道兩旁的店鋪漸漸多了起來，挑擔的小販與趕路的行人來來往往，越往鎮中心越顯得熱鬧。西邊是陸家的和豐當鋪，往北可以走回鎮口，往南就是鎮上最熱鬧的交叉路口。","exits":{"north":"/d/wutang/entrance","west":"/d/wutang/pawnshop","south":"/d/wutang/crossroad"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[0,1,0]},"/d/wutang/path_e":{"id":"/d/wutang/path_e","file":"source/upstream/mudlib/d/wutang/path_e.c","short":"小路","long":"一條夾在民房之間的泥土小路，兩旁的竹籬笆上晾著衣物，偶爾傳來幾聲雞鳴犬吠。往西可以回到熱鬧的廟口小路，往南則是民房的後院，隱約聽得見潺潺的溪水聲。","exits":{"west":"/d/wutang/temple_road_n","south":"/d/wutang/backyard"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[6,-1,0]},"/d/wutang/pavilion":{"id":"/d/wutang/pavilion","file":"source/upstream/mudlib/d/wutang/pavilion.c","short":"涼亭","long":"一座建在小丘上的木造涼亭，四周種著幾株垂柳，微風吹過時柳枝輕輕搖曳。站在亭中向西望去，可以眺望寬闊的羿水在遠方緩緩流過，河面上點點帆影，景色十分宜人。往東是一條碎石路。","exits":{"east":"/d/wutang/gravel_road_n"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-4,2,0]},"/d/wutang/pawnshop":{"id":"/d/wutang/pawnshop","file":"source/upstream/mudlib/d/wutang/pawnshop.c","short":"和豐當鋪","long":"這裡是一家中等規模的當鋪﹐老闆便是五堂鎮上陸姓一堂的當家﹐因為陸家的祖先是從經營當鋪發跡的﹐因此這家當鋪也被視為是陸家家長的主要基業﹐現在的大朝奉是由陸大當家的四弟擔任﹐大家都稱他陸四爺﹐當鋪的出口在東邊﹐北邊的牆上掛著一幅工筆花鳥﹐西邊是櫃臺﹐通往內間的門就在櫃臺邊﹐不過顯然是從裡面鎖著的。","exits":{"east":"/d/wutang/north_street"},"objects":{"/d/wutang/npc/lu_estimator":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-1,1,0]},"/d/wutang/river_bank":{"id":"/d/wutang/river_bank","file":"source/upstream/mudlib/d/wutang/river_bank.c","short":"羿水河邊","long":"羿水河邊的一片沙灘，河水在這裡轉了個彎，流速緩了下來，水面上不時有魚兒躍出。岸邊散落著幾塊大石頭，是釣客們最喜歡的位置。往西北可以回到鯉君渡口。","exits":{"northwest":"/d/wutang/ferry_dock"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-2,7,0]},"/d/wutang/riverside":{"id":"/d/wutang/riverside","file":"source/upstream/mudlib/d/wutang/riverside.c","short":"河邊","long":"這裏是羿水河邊, 西邊是一座大山, 陡峭的山壁隱隱現出不凡的氣勢, 東邊則是通往五堂鎮的石道, 商旅不時的來來往往。","exits":{"east":"/d/wutang/gravel_road_s"},"objects":{"/d/wutang/npc/ro":1,"/d/wutang/npc/huang":1},"special":[{"cmd":"swim","to":"/d/wutang/boat"}],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-5,3,0]},"/d/wutang/school":{"id":"/d/wutang/school","file":"source/upstream/mudlib/d/wutang/school.c","short":"鄉校","long":"五堂鎮的鄉校，比一般的私塾大上許多，屋裡排滿了一張張書桌，學生們搖頭晃腦地唸著書。牆上貼著一張紅紙，寫著前幾年鎮上出了一位舉人，從那之後鎮民讀書的風氣便越來越盛。往南可以回到街道。","exits":{"south":"/d/wutang/west_street2"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-2,1,0]},"/d/wutang/south_street1":{"id":"/d/wutang/south_street1","file":"source/upstream/mudlib/d/wutang/south_street1.c","short":"街道","long":"交叉路口往南的街道，路面漸漸寬了起來，常有挑著貨擔的商人與趕車的旅客經過。路旁有一家打鐵鋪傳來叮叮噹噹的聲音，也有幾間賣雜貨的小店。往北可以回到鎮中心，往南則通往鎮外的三岔路口。","exits":{"north":"/d/wutang/crossroad","south":"/d/wutang/south_street2"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[0,3,0]},"/d/wutang/south_street2":{"id":"/d/wutang/south_street2","file":"source/upstream/mudlib/d/wutang/south_street2.c","short":"街道","long":"五堂鎮南邊的街道，兩旁的房舍漸漸稀疏，遠處可以望見一片綠油油的草原。路邊的大樹下有幾個老人坐著乘涼閒聊，旁邊拴著幾頭準備上路的驢子。往北走回到鎮上，往南不遠就是通往四方的三岔路口。","exits":{"north":"/d/wutang/south_street1","south":"/d/wutang/three_way"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[0,4,0]},"/d/wutang/temple":{"id":"/d/wutang/temple","file":"source/upstream/mudlib/d/wutang/temple.c","short":"鎮天神廟","long":"這裡是這個地方最有名的鎮天神廟，也是這地方最古老的廟，從這間廟建築的老舊可是卻香火鼎盛，就可以知道人們一定認為這間廟很靈，而這間廟主要是供奉著雲棧鎮天神，在廟前的廣場通常也是村人舉行活動的好地方，而旁邊也有一條進入後院的路。","exits":{"south":"/d/wutang/temple_road_n"},"objects":{"/d/wutang/npc/keeper":1},"special":[{"cmd":"enter 後院","to":"/d/wutang/temple_yard"}],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[5,-2,0]},"/d/wutang/temple_road_n":{"id":"/d/wutang/temple_road_n","file":"source/upstream/mudlib/d/wutang/temple_road_n.c","short":"廟口小路","long":"通往鎮天神廟的石板小路，往來的香客絡繹不絕，人聲雖然鼎沸，越往北走卻越顯得莊嚴肅穆。路的西邊是最近出了事的顏家大宅，高牆下有一條陰暗的巷子，鎮民經過時都刻意繞開。東邊有條小路通往民房，往南則回到廟口。","exits":{"north":"/d/wutang/temple","south":"/d/wutang/temple_road_s","east":"/d/wutang/path_e"},"objects":{},"special":[{"cmd":"enter 暗巷","to":"/d/wutang/yan_gate"}],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[5,-1,0]},"/d/wutang/temple_road_s":{"id":"/d/wutang/temple_road_s","file":"source/upstream/mudlib/d/wutang/temple_road_s.c","short":"廟口小路","long":"往北通往鎮天神廟的石板路，路旁擺著幾個賣香燭紙錢的小攤，空氣裡瀰漫著檀香的氣味。路邊兩棟房子中間夾著一條狹窄的小巷子，看不清裡頭有些什麼。往南走就是熱鬧的雲棧市集廣場。","exits":{"north":"/d/wutang/temple_road_n","south":"/d/wutang/market_square"},"objects":{},"special":[{"cmd":"enter 小巷子","to":"/d/wutang/dark_alley_e"}],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[5,0,0]},"/d/wutang/temple_yard":{"id":"/d/wutang/temple_yard","file":"source/upstream/mudlib/d/wutang/temple_yard.c","short":"後院","long":"這是鎮天神廟的後院，通常開放給鎮民來此休息，在此有種著許多的樹和盆景，而在老黃桐樹下也有著四張石椅和一張光滑的石桌供人在此乘涼。","exits":{"out":"/d/wutang/temple"},"objects":{"/d/wutang/npc/oldman":1},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[6,-2,0]},"/d/wutang/three_way":{"id":"/d/wutang/three_way","file":"source/upstream/mudlib/d/wutang/three_way.c","short":"三岔路口","long":"一處三岔路口，路旁立著一塊斑駁的石碑，上頭刻著往各地的方向。往西是一片草原，再往西則是鯉君渡，往東南的官道可以前往喬陰縣，往北則回到五堂鎮。","exits":{"north":"/d/wutang/south_street2","west":"/d/wutang/boardwalk_e","southeast":"/d/qiaoyin/highway"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[0,5,0]},"/d/wutang/west_street1":{"id":"/d/wutang/west_street1","file":"source/upstream/mudlib/d/wutang/west_street1.c","short":"街道","long":"五堂鎮的街道，往東不遠就是鎮中心的交叉路口，人聲漸漸熱鬧起來。路旁有幾個小販擺著攤子叫賣，偶爾還能看見幾隻從城外菜田跑進來的野豬，惹得鎮民一陣驚呼。","exits":{"west":"/d/wutang/west_street2","east":"/d/wutang/crossroad"},"objects":{},"special":[],"area":"五堂鎮","layer":null,"areaKey":"五堂鎮","pos":[-1,2,0]},"/d/wutang/west_street2":{"id":"/d/wutang/west_street2","file":"source/upstream/mudlib/d/wutang/west_street2.c","short":"街道","long":"五堂鎮西側的街道，路面由青石板鋪成，兩旁是幾間簡樸的民房。往北可以聽見鄉校傳來的讀書聲，往西走則漸漸離開市街，通往一條碎石路，往東是鎮上的街道。","exits":{"west":"/d/wutang/gravel_road_n","east":"/d/wutang/west_street1","north":"/d/wutang/school"},"objects":{},"special":[],"are
